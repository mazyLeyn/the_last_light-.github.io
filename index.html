let actx = null, masterGain = null, audioReady = false;
let ambOsc = null, windSrc = null, ambGain2 = null, windGain2 = null;

function initAudio() {
  if (audioReady) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain();
    masterGain.gain.value = soundEnabled ? 0.6 : 0;
    masterGain.connect(actx.destination);
    audioReady = true;
    if (actx.state === 'suspended') actx.resume().catch(()=>{});
  } catch(e) {}
}

function playTone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol || 0.1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur);
}

function playCrystal() {
  playTone(880, 0.4, 'sine', 0.12);
  playTone(1320, 0.5, 'sine', 0.08, 0.08);
  playTone(1760, 0.4, 'sine', 0.06, 0.16);
}

function playStep() {
  if (!actx) return;
  const sr = actx.sampleRate;
  const len = Math.floor(sr * 0.055);
  const buf = actx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const env = Math.pow(1 - i / len, 2.5);
    d[i] = (Math.random() * 2 - 1) * env * 0.18;
  }
  const flt = actx.createBiquadFilter();
  flt.type = 'lowpass';
  flt.frequency.value = 900 + Math.random() * 400;
  flt.Q.value = 0.6;
  const o = actx.createOscillator();
  const og = actx.createGain();
  o.type = 'sine';
  o.frequency.value = 120 + Math.random() * 40;
  og.gain.setValueAtTime(0.04, actx.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.04);
  o.connect(og); og.connect(masterGain);
  o.start(); o.stop(actx.currentTime + 0.04);
  const src = actx.createBufferSource();
  const ng = actx.createGain();
  ng.gain.value = 0.55;
  src.buffer = buf;
  src.connect(flt); flt.connect(ng); ng.connect(masterGain);
  src.start();
}

function playTick() {
  if (!actx) return;
  const sr = actx.sampleRate;
  const t = actx.currentTime;
  const len = Math.floor(sr * 0.025);
  const buf = actx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3) * 1.0;
  }
  const src = actx.createBufferSource();
  const flt = actx.createBiquadFilter();
  flt.type = 'bandpass';
  flt.frequency.value = 800 + Math.random() * 300;
  flt.Q.value = 2.5;
  const g = actx.createGain();
  g.gain.value = 0.45;
  src.buffer = buf;
  src.connect(flt); flt.connect(g); g.connect(masterGain);
  src.start(t);
  const o = actx.createOscillator();
  const og = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(180 + Math.random() * 40, t);
  o.frequency.exponentialRampToValueAtTime(90, t + 0.03);
  og.gain.setValueAtTime(0.12, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  o.connect(og); og.connect(masterGain);
  o.start(t); o.stop(t + 0.04);
}

function playJump() {
  if (!actx) return;
  const t = actx.currentTime;
  const o1 = actx.createOscillator();
  const g1 = actx.createGain();
  o1.type = 'sine';
  o1.frequency.setValueAtTime(180, t);
  o1.frequency.exponentialRampToValueAtTime(420, t + 0.14);
  g1.gain.setValueAtTime(0.09, t);
  g1.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o1.connect(g1); g1.connect(masterGain);
  o1.start(t); o1.stop(t + 0.18);
  const o2 = actx.createOscillator();
  const g2 = actx.createGain();
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(360, t + 0.02);
  o2.frequency.exponentialRampToValueAtTime(700, t + 0.13);
  g2.gain.setValueAtTime(0.04, t + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  o2.connect(g2); g2.connect(masterGain);
  o2.start(t + 0.02); o2.stop(t + 0.16);
}

function playDeath() { playTone(150, 0.3, 'sawtooth', 0.06); playTone(100, 0.4, 'sine', 0.04, 0.1); }

function startAmbient(lvl) {
  if (!actx) return;
  stopAmbient();
  const scales = [
    [220, 261, 294, 330, 392],
    [196, 220, 261, 294, 349],
    [174, 196, 220, 261, 294],
    [164, 196, 220, 246, 294],
    [220, 246, 294, 330, 370],
  ];
  const scale = scales[Math.min(lvl, scales.length - 1)];
  windGain2 = actx.createGain();
  windGain2.gain.value = 0;
  windGain2.connect(masterGain);
  // Derin uğultu
  ambOsc = actx.createOscillator(); ambOsc.type='sine'; ambOsc.frequency.value=scale[0]/4;
  const dg = actx.createGain(); dg.gain.value=0.05; ambOsc.connect(dg); dg.connect(masterGain); ambOsc.start();
  let melodyActive = true;
  function schedMelody(startTime) {
    if (!melodyActive) return;
    const gap = 2.2 + Math.random() * 3.5;
    const note = scale[Math.floor(Math.random() * scale.length)];
    const harmNote = scale[Math.floor(Math.random() * scale.length)];
    const t = startTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine';
    o.frequency.value = note;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.028, t + 0.18);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 1.4);
    const o2 = actx.createOscillator();
    const g2 = actx.createGain();
    o2.type = 'triangle';
    o2.frequency.value = harmNote * 1.5;
    g2.gain.setValueAtTime(0, t + 0.05);
    g2.gain.linearRampToValueAtTime(0.010, t + 0.25);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
    o2.connect(g2); g2.connect(masterGain);
    o2.start(t + 0.05); o2.stop(t + 1.2);
    const tid = setTimeout(() => { if (melodyActive) schedMelody(actx.currentTime); }, gap * 1000);
    windGain2._tid = tid;
  }
  schedMelody(actx.currentTime + 0.5);
  windGain2._stop = () => { melodyActive = false; if (windGain2._tid) clearTimeout(windGain2._tid); };
}

function stopAmbient() {
  try { if (ambOsc) ambOsc.stop(); } catch(e){}
  try { if (windSrc) windSrc.stop(); } catch(e){}
  try { if (windGain2 && windGain2._stop) windGain2._stop(); } catch(e){}
  ambOsc = null; windSrc = null; windGain2 = null;
}

function playEnding(type) {
  if (!actx) return;
  const notes = type === 'sacrifice'
    ? [262,294,330,349,392,440,494,523,587]
    : [220,196,185,165,147,131,123,110,98];
  notes.forEach((n,i) => {
    playTone(n, 1.0, 'sine', 0.10, i*0.5);
    playTone(n*1.5, 0.7, 'triangle', 0.05, i*0.5+0.15);
  });
}

const parts = [];
for (let i = 0; i < PARTICLE_POOL; i++) parts.push({a:false,x:0,y:0,vx:0,vy:0,l:0,ml:0,s:1,c:'#fff',t:'n'});

function emit(x,y,vx,vy,life,size,color,type) {
  for (let p of parts) {
    if (!p.a) { p.a=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.l=life;p.ml=life;p.s=size;p.c=color;p.t=type||'n'; return; }
  }
}

function updateParts() {
  for (let p of parts) {
    if (!p.a) continue;
    p.x+=p.vx; p.y+=p.vy; p.l--;
    if (p.t==='dust') p.vy-=0.008;
    if (p.t==='spark') { p.vy+=0.015; p.vx*=0.97; }
    if (p.l<=0) p.a=false;
  }
}

function drawParts(cx,cy) {
  renderCtx.save();
  renderCtx.globalCompositeOperation = 'lighter';
  for (let p of parts) {
    if (!p.a) continue;
    const sx=p.x-cx, sy=p.y-cy;
    if (sx<-10||sx>WIDTH+10||sy<-10||sy>HEIGHT+10) continue;
    renderCtx.globalAlpha = p.l/p.ml;
    renderCtx.fillStyle = p.c;
    renderCtx.fillRect(Math.floor(sx), Math.floor(sy), p.s, p.s);
  }
  renderCtx.restore();
}

let S = newSave();
function newSave() { return {v:SAVE_V,level:0,cx:null,cy:null,cr:[],ab:[],met:[],boss:false}; }
function writeSave() {
  try {
    const old=localStorage.getItem(SAVE_KEY);
    if (old) localStorage.setItem(SAVE_KEY+'_bak',old);
    localStorage.setItem(SAVE_KEY,JSON.stringify(S));
  } catch(e) {}
}
function readSave() {
  for (const k of [SAVE_KEY,SAVE_KEY+'_bak']) {
    try {
      const d=JSON.parse(localStorage.getItem(k));
      if (d&&d.v===SAVE_V&&levels[d.level]&&[d.cr,d.ab,d.met].every(Array.isArray)) return d;
    } catch(e) {}
  }
  return null;
}

const cam = {x:0,y:0,look:0};
function updateCam(lvl,snap) {
  cam.look += (player.face*18-cam.look)*0.035;
  const gx = player.x - WIDTH/2 + player.w/2 + cam.look;
  const gy = player.y - HEIGHT/2 - 8;
  const dy = gy-cam.y;
  cam.x += (gx-cam.x)*(snap?1:0.09);
  if (snap) cam.y=gy; else if (Math.abs(dy)>10) cam.y += (dy-Math.sign(dy)*10)*0.1;
  cam.x = Math.max(0, Math.min(cam.x, lvl.w*TILE-WIDTH));
  cam.y = Math.max(0, Math.min(cam.y, lvl.h*TILE-HEIGHT));
}

const ESIZE={crawler:[9,6,2],moth:[7,6,2],lurker:[9,12,3]};
let enemies=[], shots=[], motes=[], boss=null, bossIntro=false;
function spawnEnemies(lvl) {
  shots=[]; motes=[];
  enemies=lvl.spawns.map(([t,c,r])=>{
    const [w,h,hp]=ESIZE[t], x=c*TILE;
    const y=t==='moth'?r*TILE:groundY(lvl,x,r*TILE)-h;
    return {t,x,y,hx:x,hy:y,w,h,hp,vx:t==='crawler'?0.35:0,vy:0,st:0,tm:Math.random()*99|0,hurt:0,face:1};
  });
  boss=null;
  if (lvl.arena) { setGate(lvl,lvl.arena.l,false); setGate(lvl,lvl.arena.r,!S.boss); }
}
function setGate(lvl,c,on) { for (let r=3;r<20;r++) lvl.tiles[r][c]=on?T.GATE:T.AIR; }
const ov=(a,x,y,w,h)=>a.x<x+w&&a.x+a.w>x&&a.y<y+h&&a.y+a.h>y;

function hurtPlayer(fromX) {
  if (player.inv>0||player.dash>0) return;
  player.hp--; player.inv=75; player.lock=12;
  player.vx=player.x<fromX?-2:2; player.vy=-2; player.cut=true;
  impact(0.6,6); playTone(110,0.25,'sawtooth',0.08);
  for (let i=0;i<14;i++) emit(player.x+2,player.y+3,(Math.random()-0.5)*2.4,(Math.random()-0.5)*2.4,30,1,'#ffcc88','spark');
  if (player.hp<=0) respawn();
}
function pitFall() {
  player.hp--; impact(0.5,0); playDeath();
  if (player.hp<=0) { respawn(); return; }
  resetPlayer(player.safeX,player.safeY); player.inv=75;
  fadeAlpha=0.8; fadeDir=-1;
}
function dropMotes(x,y,n) { for (let i=0;i<n;i++) motes.push({x,y,vx:(Math.random()-0.5)*2,vy:-1-Math.random(),l:480}); }

function strike() {
  const r = player.atkDown ? [player.x-5,player.y+player.h-2,15,15]
    : [player.face>0?player.x+3:player.x-16,player.y-5,18,16];
  const targets = boss&&boss.st!=='die' ? enemies.concat(boss) : enemies;
  for (const e of targets) {
    if (player.hit.includes(e)||!ov(e,...r)) continue;
    player.hit.push(e); e.hp--; e.hurt=10;
    impact(0.22,3); playTone(520,0.12,'triangle',0.1); playTone(180,0.1,'square',0.04);
    for (let i=0;i<8;i++) emit(e.x+e.w/2,e.y+e.h/2,(Math.random()-0.5)*2.5,(Math.random()-0.5)*2.5,22,1,'#bbddff','spark');
    if (player.atkDown) { player.vy=-3.3; player.cut=true; player.airDash=true; }
    else { player.vx-=player.face*1.4; if (e!==boss) e.vx=player.face*1.6; }
    if (e===boss) {
      if (e.hp%4===0) dropMotes(e.x+7,e.y+8,1);
      if (e.hp<=0) { e.st='die'; e.tm=0; shots=[]; impact(1,9); }
    } else if (e.hp<=0) {
      impact(0.2,4); dropMotes(e.x+e.w/2,e.y,e.t==='lurker'?2:1);
      for (let i=0;i<18;i++) emit(e.x+e.w/2,e.y+e.h/2,(Math.random()-0.5)*2,(Math.random()-0.5)*2,45,1,'#5a4a88','dust');
    }
  }
  enemies=enemies.filter(e=>e.hp>0);
}

function updateEnemies(lvl) {
  const t=lvl.tiles;
  for (const e of enemies) {
    e.tm++; if (e.hurt>0) e.hurt--;
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy);
    if (e.t==='crawler') {
      if (e.hurt<=0) e.vx=0.35*e.face;
      const ahead=e.vx>0?e.x+e.w+1:e.x-1;
      if (isSolid(t,ahead,e.y+3)||!isSolid(t,ahead,e.y+e.h+2)||ahead<0) { if (e.hurt<=0) e.face*=-1; }
      else e.x+=e.vx;
    } else if (e.t==='moth') {           // ışığa çekilir
      const on=d<90, gx=on?dx:e.hx-e.x, gy=on?dy-4:e.hy-e.y, gd=Math.hypot(gx,gy)||1;
      const k=on?0.032:0.015;
      e.vx=(e.vx+gx/gd*k)*0.97; e.vy=(e.vy+gy/gd*k+Math.sin(e.tm*0.12)*0.02)*0.97;
      e.x+=e.vx; e.y+=e.vy; e.face=e.vx<0?-1:1;
    } else {                              // pusu: 0 gizli, 1 uyanış, 2 atılış, 3 dinlenme
      if (e.st===0&&d<52&&Math.abs(dy)<26) { e.st=1; e.tm=0; e.face=dx<0?-1:1; playTone(90,0.4,'sine',0.08); }
      else if (e.st===1&&e.tm>34) { e.st=2; e.tm=0; e.vx=e.face*2; }
      else if (e.st===2) {
        if (e.hurt<=0) e.vx=e.face*2*Math.max(0,1-e.tm/34);
        const ahead=e.vx>0?e.x+e.w+1:e.x-1;
        if (!isSolid(t,ahead,e.y+4)&&isSolid(t,ahead,e.y+e.h+2)) e.x+=e.vx;
        if (e.tm>32) { e.st=3; e.tm=0; }
      } else if (e.st===3&&e.tm>60) { e.st=0; e.tm=0; }
    }
    if (!(e.t==='lurker'&&e.st===0)&&e.hurt<=0&&ov(player,e.x+1,e.y+1,e.w-2,e.h-2)) hurtPlayer(e.x+e.w/2);
  }
  for (const s of shots) {
    s.x+=s.vx; s.y+=s.vy; s.l--;
    if (frameCount%3===0) emit(s.x+3,s.y+3,0,-0.2,18,1,'#8855cc','dust');
    if (ov(player,s.x,s.y,s.w,s.h)) hurtPlayer(s.x+3);
  }
  shots=shots.filter(s=>s.l>0);
  for (const m of motes) {
    const dx=player.x+2-m.x, dy=player.y+3-m.y, d=Math.hypot(dx,dy)||1;
    if (d<60) { m.vx+=dx/d*0.2; m.vy+=dy/d*0.2; } else m.vy+=0.03;
    m.vx*=0.93; m.vy*=0.93; m.x+=m.vx; m.y+=m.vy; m.l--;
    if (d<8) {
      m.l=0; player.motes++; playTone(990,0.15,'sine',0.06);
      if (player.motes>=3) { player.motes=0; if (player.hp<MAX_HP) { player.hp++; playCrystal(); } }
    }
  }
  motes=motes.filter(m=>m.l>0);
}

function updateBoss(lvl) {
  if (!lvl.arena||S.boss) return;
  const L=(lvl.arena.l+1)*TILE, R=lvl.arena.r*TILE, FY=20*TILE-26;
  if (!boss) {
    if (player.x>L+28) {
      setGate(lvl,lvl.arena.l,true);
      boss={x:R-70,y:FY,w:14,h:26,hp:18,vx:0,vy:0,st:'idle',tm:0,hurt:0,face:-1,last:''};
      impact(0.7,0); playTone(55,1.4,'sawtooth',0.08);
      if (!bossIntro) { bossIntro=true; startDlg(tx('bossLines')); }
    }
    return;
  }
  const b=boss, rage=b.hp<=9; b.tm++; if (b.hurt>0) b.hurt--;
  const dx=player.x-b.x-5;
  if (b.st==='die') {
    emit(b.x+Math.random()*14,b.y+Math.random()*26,(Math.random()-0.5),-Math.random(),50,1,'#ffddaa','spark');
    if (b.tm>110) {
      S.boss=true; boss=null; setGate(lvl,lvl.arena.l,false); setGate(lvl,lvl.arena.r,false);
      writeSave(); playEnding('sacrifice'); startDlg(tx('bossEndLines'));
    }
    return;
  }
  if (b.st==='idle') {
    b.face=dx<0?-1:1; b.x+=b.face*0.25;
    if (b.y<FY) b.y=Math.min(FY,b.y+2);
    if (b.tm>(rage?32:54)) {
      const o=['charge','rise','cast'].filter(s=>s!==b.last);
      b.next=b.last=o[Math.random()*o.length|0]; b.st='tele'; b.tm=0;
      playTone(b.next==='rise'?140:b.next==='cast'?220:80,0.5,'triangle',0.09);
    }
  } else if (b.st==='tele') {
    if (b.tm>(rage?22:32)) { b.st=b.next; b.tm=0; b.face=dx<0?-1:1; }
  } else if (b.st==='charge') {
    b.x+=b.face*(rage?3.4:2.8);
    emit(b.x+7,b.y+20,-b.face,0,25,2,'#5533aa','dust');
    if (b.x<=L||b.x>=R-b.w) { impact(0.4,0); b.st='idle'; b.tm=0; }
  } else if (b.st==='rise') {
    b.y+=(60-b.y)*0.1; b.x+=Math.max(-2,Math.min(2,dx*0.12));
    if (b.tm>44) { b.st='slam'; b.tm=0; }
  } else if (b.st==='slam') {
    if (b.tm>8) b.y+=6;
    if (b.y>=FY) {
      b.y=FY; impact(0.6,0); playTone(60,0.4,'sawtooth',0.1);
      for (const s of [-1,1]) shots.push({x:b.x+4,y:20*TILE-8,vx:s*(rage?2.2:1.7),vy:0,w:6,h:8,l:110});
      b.st='idle'; b.tm=-14;
    }
  } else if (b.st==='cast') {
    if (b.tm%14===0) {
      const ox=b.x+4, oy=b.y+6, a=Math.atan2(player.y-oy,player.x-ox);
      shots.push({x:ox,y:oy,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6,w:6,h:6,l:150});
      playTone(330,0.2,'triangle',0.06);
    }
    if (b.tm>=(rage?58:44)) { b.st='idle'; b.tm=0; }
  }
  b.x=Math.max(L,Math.min(R-b.w,b.x));
  if (ov(player,b.x+2,b.y+3,b.w-4,b.h-3)) hurtPlayer(b.x+7);
}

let dlgActive=false, dlgLines=[], dlgLine=0, dlgChar=0, dlgTimer=0, dlgCB=null;

function startDlg(lines,cb) {
  dlgActive=true; dlgLines=lines; dlgLine=0; dlgChar=0; dlgTimer=0; dlgCB=cb||null;
  gameState='dialogue';
}

function updateDlg() {
  if (!dlgActive) return;
  dlgTimer++;
  if (dlgTimer%2===0 && dlgChar<dlgLines[dlgLine].length) {
    dlgChar++;
    if (dlgChar%3===0) playTick();
  }
  if (jp['Space']||jp['KeyE']||jp['Enter']) {
    if (dlgChar<dlgLines[dlgLine].length) { dlgChar=dlgLines[dlgLine].length; }
    else { dlgLine++; dlgChar=0; if (dlgLine>=dlgLines.length) { dlgActive=false; gameState='play'; if(dlgCB) dlgCB(); } }
  }
}

function drawDlg() {
  if (!dlgActive) return;
  renderCtx.save();
  renderCtx.fillStyle='rgba(0,0,0,0.88)';
  renderCtx.fillRect(8,HEIGHT-52,WIDTH-16,46);
  renderCtx.strokeStyle='#445'; renderCtx.lineWidth=1;
  renderCtx.strokeRect(8,HEIGHT-52,WIDTH-16,46);
  renderCtx.fillStyle='#ccd';
  renderCtx.font='7px "Press Start 2P",monospace';
  const txt=dlgLines[dlgLine].substring(0,dlgChar);
  wrapTxt(renderCtx,txt,14,HEIGHT-40,WIDTH-28,9);
  if (dlgChar>=dlgLines[dlgLine].length) {
    renderCtx.fillStyle='#889';
    renderCtx.fillText('▼',WIDTH-20,HEIGHT-12);
  }
  renderCtx.restore();
}

function wrapTxt(c,text,x,y,mw,lh) {
  const words=text.split(' '); let line='', ly=y;
  for (let w of words) {
    const test=line+w+' ';
    if (c.measureText(test).width>mw&&line!=='') { c.fillText(line.trim(),x,ly); line=w+' '; ly+=lh; }
    else line=test;
  }
  c.fillText(line.trim(),x,ly);
}

function getCrystDlg(id) { return tx('crystDlg')[id]; }

function drawParallax(lvl) {
  const cols=lvl.pcolors;
  renderCtx.fillStyle=cols[0];
  for (let i=0;i<8;i++) {
    const bx=i*55-(cam.x*0.1)%55;
    const bh=25+Math.sin(i*1.7)*12+Math.cos(i*0.8)*8;
    drawMtn(bx,HEIGHT-bh,55,bh);
  }
  renderCtx.fillStyle=cols[1];
  for (let i=0;i<10;i++) {
    const bx=i*40-(cam.x*0.3)%40;
    const bh=18+Math.sin(i*2.3+1)*8;
    drawHill(bx,HEIGHT-bh,40,bh);
  }
  renderCtx.fillStyle=cols[2];
  for (let i=0;i<14;i++) {
    const bx=i*30-(cam.x*0.55)%30;
    const bh=12+Math.sin(i*3.1+2)*6;
    drawHill(bx,HEIGHT-bh,30,bh);
  }
}

function drawMtn(x,y,w,h) {
  renderCtx.beginPath();
  renderCtx.moveTo(x,y+h); renderCtx.lineTo(x+w*0.2,y+h*0.3);
  renderCtx.lineTo(x+w*0.4,y); renderCtx.lineTo(x+w*0.6,y+h*0.2);
  renderCtx.lineTo(x+w*0.8,y+h*0.1); renderCtx.lineTo(x+w,y+h);
  renderCtx.fill();
}

function drawHill(x,y,w,h) {
  renderCtx.beginPath();
  renderCtx.moveTo(x,y+h);
  renderCtx.quadraticCurveTo(x+w*0.5,y-h*0.4,x+w,y+h);
  renderCtx.fill();
}

const ZONE_TILES=[
  ['#16202a','#0e161d','#1a4a3e','#256054','#3a8a78'],['#1d1830','#130f20','#3a2a50','#4e3a68','#7a5c96'],
  ['#1e1a1c','#141012','#46301e','#5e4228','#8a6238'],['#161c30','#0e1222','#25406a','#325688','#5c88bc'],
  ['#17163a','#0e0d26','#36328a','#4a46aa','#7c7ae0']];
function drawTiles(lvl) {
  const [zb,zd,z1,z2,z3]=ZONE_TILES[lvl.zone];
  const sc=Math.max(0,Math.floor(cam.x/TILE));
  const ec=Math.min(lvl.w,Math.ceil((cam.x+WIDTH)/TILE)+1);
  const sr=Math.max(0,Math.floor(cam.y/TILE));
  const er=Math.min(lvl.h,Math.ceil((cam.y+HEIGHT)/TILE)+1);
  for (let r=sr;r<er;r++) for (let c=sc;c<ec;c++) {
    const tile=lvl.tiles[r][c];
    const sx=Math.floor(c*TILE-cam.x), sy=Math.floor(r*TILE-cam.y);
    if (tile===T.SOLID) {
      const isBottom = r < lvl.h - 1 && lvl.tiles[r+1][c] === T.AIR;
      const isTop = r > 0 && lvl.tiles[r-1][c] === T.AIR;
      const isLeft = c > 0 && lvl.tiles[r][c-1] === T.AIR;
      const isRight = c < lvl.w - 1 && lvl.tiles[r][c+1] === T.AIR;
      renderCtx.fillStyle = zb;
      renderCtx.fillRect(sx, sy, TILE, TILE);
      renderCtx.fillStyle = zd;
      for (let x = 0; x < TILE; x++) {
        const waveY = 4 + Math.sin((c * TILE + x) * 0.6) * 1.5;
        renderCtx.fillRect(sx + x, sy + Math.floor(waveY), 1, TILE - Math.floor(waveY));
      }
      if (c % 2 === 0) {
        renderCtx.fillStyle = '#0a0910';
        renderCtx.fillRect(sx + 3, sy, 1, TILE);
      }
      if (isBottom) {
        renderCtx.fillStyle = '#05040a';
        for (let x = 0; x < TILE; x++) {
          const cut = (x === 0 || x === 7) ? 1 : (x === 3 || x === 4) ? 2 : 1;
          renderCtx.fillRect(sx + x, sy + TILE - cut, 1, cut);
        }
      }
      if (isLeft) { renderCtx.fillStyle = '#0d0b17'; renderCtx.fillRect(sx, sy, 1, TILE); }
      if (isRight) { renderCtx.fillStyle = '#0d0b17'; renderCtx.fillRect(sx + TILE - 1, sy, 1, TILE); }
      if (isTop) {
        const mossBase  = z1;
        const mossMid   = z2;
        const mossLight = z3;
        const drips = [2, 3, 2, 1, 2, 4, 3, 2];
        renderCtx.fillStyle = mossBase;
        for (let x = 0; x < TILE; x++) {
          const dripIdx = (c * TILE + x) % drips.length;
          const h = drips[dripIdx];
          renderCtx.fillRect(sx + x, sy, 1, h);
        }
        renderCtx.fillStyle = mossMid;
        for (let x = 1; x < TILE - 1; x++) {
          const dripIdx = (c * TILE + x) % drips.length;
          const h = drips[dripIdx];
          if (h >= 2) renderCtx.fillRect(sx + x, sy, 1, h - 1);
        }
        renderCtx.fillStyle = mossLight;
        renderCtx.fillRect(sx, sy, TILE, 1);
        for (let x = 0; x < TILE; x += 2) {
          if ((c + x) % 4 === 0) renderCtx.fillRect(sx + x, sy, 1, 1);
        }
      }
    } else if (tile===T.PLATFORM) {
      renderCtx.fillStyle='#333346'; renderCtx.fillRect(sx,sy,TILE,2);
      renderCtx.fillStyle='#444460'; renderCtx.fillRect(sx,sy,TILE,1);
    } else if (tile===T.VEIL) {
      for (let k=0;k<4;k++) {
        renderCtx.fillStyle=k%2?'#4b2f78':'#1d1233';
        renderCtx.fillRect(sx+k*2+Math.round(Math.sin(frameCount*0.05+r*0.6+k)),sy,2,TILE);
      }
    } else if (tile===T.GATE) {
      renderCtx.fillStyle='#2a1f48'; renderCtx.fillRect(sx+1,sy,2,TILE); renderCtx.fillRect(sx+5,sy,2,TILE);
      renderCtx.fillStyle='#5a3f90'; renderCtx.fillRect(sx+1,sy+(r*3+(frameCount>>3))%TILE,6,1);
    } else if (tile===T.CHOICE_A) {
      renderCtx.fillStyle=`rgba(80,160,255,${0.3+Math.sin(frameCount*0.04)*0.15})`;
      renderCtx.fillRect(sx,sy,TILE,TILE);
    } else if (tile===T.CHOICE_B) {
      renderCtx.fillStyle=`rgba(255,140,80,${0.3+Math.sin(frameCount*0.04)*0.15})`;
      renderCtx.fillRect(sx,sy,TILE,TILE);
    }
  }
}

function drawCrystals(lvl) {
  for (let c of lvl.crystals) {
    if (c.col) continue;
    const sx=c.x-cam.x, sy=c.y-cam.y+Math.sin(frameCount*0.05)*2;
    if (sx<-16||sx>WIDTH+16) continue;
    renderCtx.save();
    renderCtx.globalAlpha=0.25+Math.sin(frameCount*0.07)*0.1;
    renderCtx.fillStyle='#88ddff';
    renderCtx.beginPath(); renderCtx.arc(sx+4,sy+4,6,0,Math.PI*2); renderCtx.fill();
    renderCtx.globalAlpha=1;
    renderCtx.fillStyle='#bbffff';
    renderCtx.beginPath();
    renderCtx.moveTo(sx+4,sy); renderCtx.lineTo(sx+7,sy+4);
    renderCtx.lineTo(sx+4,sy+8); renderCtx.lineTo(sx+1,sy+4);
    renderCtx.fill();
    renderCtx.fillStyle='#fff'; renderCtx.fillRect(sx+3,sy+2,2,2);
    renderCtx.restore();
    if (frameCount%18===0) emit(c.x+4+Math.random()*4-2,c.y+4,(Math.random()-0.5)*0.4,-Math.random()*0.4,25,1,'#88ddff','spark');
  }
}

function drawNPCs(lvl) {
  for (let npc of lvl.npcs) {
    const sx=npc.x-cam.x, sy=npc.y-cam.y;
    if (sx<-20||sx>WIDTH+20) continue;
    if (npc.type==='tree') {
      const sway = Math.sin(frameCount * 0.018) * 0.7;
      const glow = Math.sin(frameCount * 0.04) * 0.12 + 0.55;
      renderCtx.save();
      // Kökler
      renderCtx.fillStyle='#1a1008';
      renderCtx.fillRect(Math.floor(sx),   Math.floor(sy+20), 3, 2);
      renderCtx.fillRect(Math.floor(sx+5), Math.floor(sy+20), 3, 2);
      renderCtx.fillRect(Math.floor(sx+1), Math.floor(sy+19), 2, 1);
      renderCtx.fillRect(Math.floor(sx+5), Math.floor(sy+19), 2, 1);
      // Ana gövde
      renderCtx.fillStyle='#1c1209';
      renderCtx.fillRect(Math.floor(sx+2), Math.floor(sy+8),  4, 13);
      renderCtx.fillStyle='#251810';
      renderCtx.fillRect(Math.floor(sx+3), Math.floor(sy+8),  2, 12);
      // Kabuk dokusu
      renderCtx.fillStyle='#120c06';
      renderCtx.fillRect(Math.floor(sx+2), Math.floor(sy+10), 1, 3);
      renderCtx.fillRect(Math.floor(sx+5), Math.floor(sy+13), 1, 3);
      renderCtx.fillRect(Math.floor(sx+3), Math.floor(sy+16), 1, 2);
      // Dallar
      renderCtx.fillStyle='#1e1409';
      renderCtx.fillRect(Math.floor(sx+1+sway*0.3), Math.floor(sy+10), 2, 1);
      renderCtx.fillRect(Math.floor(sx-1+sway*0.5), Math.floor(sy+9),  2, 1);
      renderCtx.fillRect(Math.floor(sx+5-sway*0.3), Math.floor(sy+11), 2, 1);
      renderCtx.fillRect(Math.floor(sx+6-sway*0.5), Math.floor(sy+10), 2, 1);
      // Yaprak kütleleri - arka (koyu)
      renderCtx.fillStyle='#0d1f10';
      renderCtx.fillRect(Math.floor(sx-1+sway*0.4), Math.floor(sy+2),  10, 7);
      renderCtx.fillRect(Math.floor(sx+0+sway*0.3), Math.floor(sy+0),  8,  4);
      renderCtx.fillRect(Math.floor(sx-2+sway*0.5), Math.floor(sy+4),  4,  5);
      renderCtx.fillRect(Math.floor(sx+6-sway*0.4), Math.floor(sy+3),  3,  5);
      // Orta ton
      renderCtx.fillStyle='#163220';
      renderCtx.fillRect(Math.floor(sx+0+sway*0.35),Math.floor(sy+3),  8,  6);
      renderCtx.fillRect(Math.floor(sx+1+sway*0.25),Math.floor(sy+1),  6,  4);
      renderCtx.fillRect(Math.floor(sx-1+sway*0.45),Math.floor(sy+5),  3,  4);
      renderCtx.fillRect(Math.floor(sx+6-sway*0.35),Math.floor(sy+4),  2,  3);
      // Parlak kenarlar
      renderCtx.fillStyle='#1e4a2a';
      renderCtx.fillRect(Math.floor(sx+2+sway*0.2), Math.floor(sy+2),  4,  3);
      renderCtx.fillRect(Math.floor(sx+1+sway*0.3), Math.floor(sy+5),  3,  2);
      renderCtx.fillRect(Math.floor(sx+5-sway*0.2), Math.floor(sy+4),  2,  2);
      // Mistik parıltı
      renderCtx.globalAlpha = glow * 0.18;
      renderCtx.fillStyle='#55ffaa';
      renderCtx.fillRect(Math.floor(sx+3+sway*0.15),Math.floor(sy+3),  2,  1);
      renderCtx.fillRect(Math.floor(sx+2+sway*0.2), Math.floor(sy+6),  1,  1);
      renderCtx.fillRect(Math.floor(sx+5-sway*0.15),Math.floor(sy+5),  1,  1);
      renderCtx.globalAlpha = glow * 0.07;
      renderCtx.fillStyle='#44cc77';
      renderCtx.beginPath(); renderCtx.arc(sx+4+sway*0.3, sy+5, 9, 0, Math.PI*2); renderCtx.fill();
      renderCtx.globalAlpha = 1;
      renderCtx.restore();
      if (frameCount%38===0) emit(npc.x+2+Math.random()*6, npc.y+6, (Math.random()-0.5)*0.25+sway*0.03, Math.random()*0.2+0.05, 55, 1, '#2a6635', 'dust');
    } else if (npc.type==='source') {
      const p=Math.sin(frameCount*0.03)*0.3+0.7;
      renderCtx.save();
      renderCtx.globalAlpha=p*0.4;
      renderCtx.fillStyle='#5577ff';
      renderCtx.beginPath(); renderCtx.arc(sx+4,sy+8,14,0,Math.PI*2); renderCtx.fill();
      renderCtx.globalAlpha=1;
      renderCtx.fillStyle='#99bbff';
      renderCtx.beginPath();
      renderCtx.moveTo(sx+4,sy); renderCtx.lineTo(sx+9,sy+10);
      renderCtx.lineTo(sx+4,sy+20); renderCtx.lineTo(sx-1,sy+10);
      renderCtx.fill();
      renderCtx.fillStyle='#fff'; renderCtx.fillRect(sx+3,sy+8,2,2);
      renderCtx.restore();
      if (frameCount%6===0) emit(npc.x+4+Math.random()*8-4,npc.y+Math.random()*16,(Math.random()-0.5)*0.3,-Math.random()*0.3,35,1,'#7799ff','spark');
    }
    else drawWanderer(npc,sx,sy);
    const dist=Math.abs(player.x-npc.x)+Math.abs(player.y-npc.y);
    if (dist<35&&!npc.done) {
      renderCtx.fillStyle='#aab'; renderCtx.font='6px "Press Start 2P",monospace';
      renderCtx.fillText('E',Math.floor(sx+2),Math.floor(sy-6));
    }
  }
}

function drawDoor(lvl) {

function drawWorldProps(lvl) {
  for (const c of lvl.cps) {              // fenerler
    const x=Math.floor(c.x-cam.x), y=Math.floor(c.y-cam.y);
    if (x<-20||x>WIDTH+20) continue;
    const lit=S.level===currentLevel&&S.cx===c.x;
    renderCtx.fillStyle='#2a2836'; renderCtx.fillRect(x+3,y+3,1,11); renderCtx.fillRect(x+1,y+13,5,1);
    renderCtx.fillRect(x+1,y,5,1); renderCtx.fillRect(x+1,y+6,5,1); renderCtx.fillRect(x+1,y,1,6); renderCtx.fillRect(x+5,y,1,6);
    renderCtx.fillStyle=lit?'#ffd890':'#3a3850';
    renderCtx.fillRect(x+3,y+2+(lit&&frameCount%20<10?0:1),1,3);
    if (lit&&frameCount%14===0) emit(c.x+3,c.y+2,(Math.random()-0.5)*0.2,-0.3,40,1,'#ffcc77','dust');
  }
  for (const s of lvl.shrines) {
    if (has(s.ab)) continue;
    const x=Math.floor(s.x-cam.x), y=Math.floor(s.y-cam.y+Math.sin(frameCount*0.05)*2);
    renderCtx.strokeStyle='#ffd9a0'; renderCtx.lineWidth=1; renderCtx.strokeRect(x+0.5,y+0.5,6,6);
    renderCtx.fillStyle='#fff2cc'; renderCtx.fillRect(x+2,y+2,3,3);
    if (frameCount%8===0) emit(s.x+3,s.y+4,(Math.random()-0.5)*0.6,-0.4,40,1,'#ffddaa','spark');

function drawPlayer() {
  if (player.inv>0&&player.hp<MAX_HP&&frameCount%8<4) return;
  let rw=5, rh=7;
  if (player.dash>0) { rw=9; rh=4; }
  else if (player.squash>0) { const t=player.squash/8; rw=Math.round(5+2*t); rh=Math.round(7-2*t); }
  else if (player.squash<0) { rw=4; rh=8; }
  const sx=Math.floor(player.x-cam.x)+Math.floor((5-rw)/2), sy=Math.floor(player.y-cam.y)+7-rh;
  const R=renderCtx;
  R.save();
  R.globalCompositeOperation='lighter';
  const p=Math.sin(frameCount*0.07)*0.12+0.85;
  R.globalAlpha=0.25*p; R.fillStyle='#88bbff';
  R.beginPath(); R.arc(sx+rw/2,sy+rh/2,7,0,Math.PI*2); R.fill();
  R.globalAlpha=0.45*p; R.fillStyle='#cceeff';
  R.beginPath(); R.arc(sx+rw/2,sy+rh/2,4,0,Math.PI*2); R.fill();
  R.restore();
  // Alev kuyruğu: hareketin tersine savrulur
  for (let i=0;i<3;i++) {
    R.fillStyle=['#dff2ff','#9fcfff','#5f8fd0'][i];
    R.fillRect(sx+Math.floor(rw/2)-Math.round(player.vx*i*0.8)+(i?Math.round(Math.sin(frameCount*0.15+i)):0),sy-i,1,1);
  }
  R.fillStyle='#eef8ff'; R.fillRect(sx+1,sy,rw-2,rh); R.fillRect(sx,sy+1,rw,rh-2);
  if (player.dash<=0) {

  }
  if (player.atk>0) {

    const cx=player.x-cam.x+2, cy=player.y-cam.y+3;

const ZONE_DARK=['3,9,12','9,6,15','5,4,6','6,8,18','5,5,20'];
function drawLighting() {
  const L=lightCtx, lvl=levels[currentLevel];

  const hole=(wx,wy,r,a)=>{
    const x=wx-cam.x, y=wy-cam.y;
    if (x<-r||x>WIDTH+r||y<-r||y>HEIGHT+r) return;
    const g=L.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(0,0,0,${a})`); g.addColorStop(0.45,`rgba(0,0,0,${a*0.7})`); g.addColorStop(1,'rgba(0,0,0,0)');
    L.fillStyle=g; L.beginPath(); L.arc(x,y,r,0,Math.PI*2); L.fill();
  };
  // Can = ışık: yara aldıkça dünya daralır
  player.glow+=((34+Math.max(0,player.hp)*9)-player.glow)*0.06;
  hole(player.x+2,player.y+3,player.glow+Math.sin(frameCount*0.05)*2.5+(player.atk>0?8:0),1);

  for (const n of lvl.npcs) hole(n.x+4,n.y+8,n.type==='source'?44:24,0.65);
  for (const c of lvl.cps) hole(c.x+3,c.y+3,S.level===currentLevel&&S.cx===c.x?40:10,0.75);
  for (const s of lvl.shrines) if (!has(s.ab)) hole(s.x+3,s.y+4,24,0.75);
  for (const m of motes) hole(m.x,m.y,9,0.6);
  for (const s of shots) hole(s.x+3,s.y+3,10,0.6);
  if (boss) hole(boss.x+7,boss.y+12,36,0.75);
  if (lvl.door) hole(lvl.door.x+4,lvl.door.y+8,24,0.65);
  if (currentLevel>0) hole(lvl.sx+3,lvl.sy,14,0.4);

  L.restore();

}

let candleLen=48, candleTrail=48;
function drawCandle() {
  const R=renderCtx, SEG=12, X=9, Y=9, hp=Math.max(0,player.hp), goal=hp*SEG;
  const px=(c,x,y,w,h)=>{R.fillStyle=c;R.fillRect(Math.round(x),Math.round(y),w,h);};
  candleLen+=(goal-candleLen)*0.25;
  candleTrail=Math.max(candleLen,candleTrail-0.35);
  const len=Math.round(candleLen), full=MAX_HP*SEG, low=hp<=1;
  // Şamdan ve boş yuva
  px('#4a4058',X-5,Y-2,3,9); px('#6e6284',X-5,Y-2,1,9); px('#4a4058',X-2,Y+6,full+3,1);
  px('#15121f',X,Y,full,5);
  // Yeni kaybedilen kısım kor gibi söner
  const tr=Math.round(candleTrail); if (tr>len) px('#a8452c',X+len,Y+1,tr-len,4);
  // Balmumu gövde
  px(low?'#b98a72':'#cfc4a4',X,Y,len,5); px(low?'#d8ac90':'#f3ebd0',X,Y,len,1); px('#8c8068',X,Y+4,len,1);
  for (let k=1;k<MAX_HP;k++) {
    if (k*SEG<len) px('#8c8068',X+k*SEG,Y+1,1,3); else px('#2c2638',X+k*SEG,Y+1,1,3);
  }
  // Erime damlaları
  if (len>8) { px('#cfc4a4',X+len-3,Y+5,1,2); px('#cfc4a4',X+len-7,Y+5,1,1); }
  // Fitil ve alev
  px('#2a1f1a',X+len,Y+2,2,1);
  const fl=Math.round(Math.sin(frameCount*(low?0.5:0.16))), fx=X+len+2;
  R.save(); R.globalCompositeOperation='lighter'; R.globalAlpha=0.16+0.05*fl; R.fillStyle=low?'#ff5522':'#ffbb66';
  R.beginPath(); R.arc(fx+1,Y,7,0,Math.PI*2); R.fill(); R.restore();
  px(low?'#e0502c':'#ff9a3c',fx,Y-1,3,4); px(low?'#e0502c':'#ff9a3c',fx+1,Y-4-fl,1,4+fl);
  px('#fff3c4',fx+1,Y,1,2);
  // Kıvılcımlar: üçü bir bölüm mumu onarır
  for (let k=0;k<3;k++) {
    const x=X+2+k*8, y=Y+12, on=k<player.motes, c=on?'#ffd27a':'#3a344a';
    px(c,x,y-1,1,3); px(c,x-1,y,3,1); if (on) px('#fff8e0',x,y,1,1);
  }
}

function getTile(tiles,px,py) {
  const c=Math.floor(px/TILE), r=Math.floor(py/TILE);
  if (r<0||r>=tiles.length||c<0||c>=tiles[0].length) return T.AIR;
  return tiles[r][c];
}
function isSolid(tiles,px,py) {
  const t=getTile(tiles,px,py);
  return t===T.SOLID||t===T.GATE||(t===T.VEIL&&player.dash<=0);
}
function inVeil(t) { return [0,player.w].some(dx=>getTile(t,player.x+dx,player.y+3)===T.VEIL); }

function resolveX(lvl) {
  const t=lvl.tiles;
  for (let i=0;i<3;i++) {
    const cy=player.y+1+(player.h-2)*i/2;
    if (player.vx>0&&isSolid(t,player.x+player.w,cy)) { player.x=Math.floor((player.x+player.w)/TILE)*TILE-player.w-0.01; player.vx=0; break; }
    if (player.vx<0&&isSolid(t,player.x,cy)) { player.x=Math.floor(player.x/TILE)*TILE+TILE; player.vx=0; break; }
  }
  player.x=Math.max(0,Math.min(player.x,lvl.w*TILE-player.w));
}

function resolveY(lvl) {
  const t=lvl.tiles;
  player.grounded=false;
  if (player.vy>0) {
    if (isSolid(t,player.x+1,player.y+player.h)||isSolid(t,player.x+player.w-1,player.y+player.h)) {
      player.y=Math.floor((player.y+player.h)/TILE)*TILE-player.h;
      player.vy=0; player.grounded=true;
    }
  } else if (player.vy<0) {
    const l=isSolid(t,player.x+1,player.y), r=isSolid(t,player.x+player.w-1,player.y);
    if (l!==r) {                          // köşe düzeltmesi
      for (let n=1;n<=3;n++) {
        const nx=player.x+(l?n:-n);
        if (!isSolid(t,nx+1,player.y)&&!isSolid(t,nx+player.w-1,player.y)&&!isSolid(t,nx,player.y+4)&&!isSolid(t,nx+player.w,player.y+4)) { player.x=nx; return; }
      }
    }
    if (l||r) { player.y=Math.floor(player.y/TILE)*TILE+TILE; player.vy=0; }
  }
}

function movePlayer(lvl) {
  const t=lvl.tiles, p=player;
  if (p.inv>0) p.inv--;
  if (p.atkCd>0) p.atkCd--;
  if (p.dashCd>0) p.dashCd--;
  if (p.lock>0) p.lock--;
  const dir=(isRight()?1:0)-(isLeft()?1:0);
  if (p.lock<=0&&p.dash<=0) {
    if (dir&&p.atk<=0) p.face=dir;
    const goal=dir*PLAYER_SPEED, acc=p.grounded?0.28:0.18;
    p.vx+=Math.max(-acc,Math.min(acc,goal-p.vx));
  }
  if (p.grounded&&Math.abs(p.vx)>0.3) { if (++p.stepT>15) { playStep(); p.stepT=0; } } else p.stepT=10;
  if (p.grounded) { p.coyote=COYOTE_TIME; p.airDash=true; } else if (p.coyote>0) p.coyote--;
  if (isJump()) p.jbuf=JUMP_BUFFER; else if (p.jbuf>0) p.jbuf--;

  p.wall=0;
  if (has('cling')&&!p.grounded&&p.dash<=0) {
    if (isSolid(t,p.x+p.w+1,p.y+3)) p.wall=1; else if (isSolid(t,p.x-1,p.y+3)) p.wall=-1;
    if (p.wall&&dir===p.wall&&p.vy>0.8) { p.vy=0.8; if (frameCount%6===0) emit(p.x+2,p.y+6,0,0.2,16,1,'#8899bb','dust'); }
  }
  if (p.jbuf>0&&p.dash<=0) {
    if (p.coyote>0) { p.vy=JUMP_FORCE; p.jbuf=0; p.coyote=0; p.cut=false; p.grounded=false; playJump(); }
    else if (p.wall) { p.vy=-3.8; p.vx=-p.wall*1.9; p.face=-p.wall; p.lock=9; p.jbuf=0; p.cut=false; p.airDash=true; playJump(); }
  }
  if (!jumpHeld()&&!p.cut&&p.vy<-1) { p.vy*=0.45; p.cut=true; }

  if (isDash()&&has('dash')&&p.dashCd<=0&&p.airDash) {
    p.dash=10; p.dashCd=32; p.airDash=false; p.lock=0; if (dir) p.face=dir;
    impact(0.12,0); playTone(300,0.18,'triangle',0.08); playTone(700,0.15,'sine',0.05,0.03);
  }
  if (p.dash>0) {
    p.vx=p.face*3.6; p.vy=0;
    emit(p.x+2,p.y+3,-p.face*0.3,0,20,2,'#88bbff','dust');
  } else {
    let g=p.vy>0?FALL_GRAVITY:GRAVITY;
    if (jumpHeld()&&Math.abs(p.vy)<0.6) g*=0.5;
    p.vy=Math.min(p.vy+g,MAX_FALL);
  }
  if (isAttack()&&p.atkCd<=0) {
    p.atk=7; p.atkCd=20; p.hit=[]; p.atkDown=!p.grounded&&!!(keys['ArrowDown']||keys['KeyS']);
    playTone(640,0.1,'triangle',0.05); playTone(1100,0.07,'sine',0.03,0.02);
  }
  p.x+=p.vx; resolveX(lvl);
  p.y+=p.vy; resolveY(lvl);
  // Atılma perdenin içinde bitmez
  if (p.dash>0&&--p.dash===0) { if (inVeil(t)) p.dash=1; else p.vx=p.face*PLAYER_SPEED; }
  // Güvenli zemin: iki yanı da dolu olan son nokta
  if (p.grounded&&frameCount%8===0&&isSolid(t,p.x-8,p.y+9)&&isSolid(t,p.x+12,p.y+9)) { p.safeX=p.x; p.safeY=p.y; }

  if (!p.wasGrounded&&p.grounded&&p.prevVy>1.5) {
    p.squash=Math.min(8,Math.round(p.prevVy*1.8));
    for (let i=0;i<5;i++) emit(p.x+2,p.y+6,(Math.random()-0.5)*1.2,-Math.random()*0.3,18,1,'#667799','dust');
  } else if (p.grounded&&p.squash<0) p.squash=0;
  if (p.squash>0) p.squash--;
  if (!p.grounded&&p.vy<-0.5&&p.squash<=0) p.squash=-1;
  p.wasGrounded=p.grounded; p.prevVy=p.vy;
}

function updatePlay() {
  trauma=Math.max(0,trauma-0.02);
  if (fadeCallback) return;
  if (isPause()) { gameState='pause'; pauseSel=0; return; }
  if (hitStop>0) { hitStop--; if (isJump()) player.jbuf=JUMP_BUFFER; return; }
  const lvl=levels[currentLevel];
  movePlayer(lvl);
  if (player.atk>0) { strike(); player.atk--; }
  const hx=player.x+player.w/2, hy=player.y+player.h;
  if (player.y>lvl.h*TILE+20||getTile(lvl.tiles,hx,hy)===T.HAZARD) { pitFall(); updateCam(lvl); return; }
  updateEnemies(lvl);
  updateBoss(lvl);
  updateCam(lvl);
  if (gameState!=='play'||fadeCallback) return;

  for (const c of lvl.crystals) {
    if (c.col||Math.abs(player.x-c.x)>=10||Math.abs(player.y-c.y)>=10) continue;
    c.col=true; S.cr.push(c.id); fragments=S.cr.length; writeSave(); playCrystal();
    for (let i=0;i<14;i++) emit(c.x+4,c.y+4,(Math.random()-0.5)*2,(Math.random()-0.5)*2,35,1,'#88eeff','spark');
    startDlg(getCrystDlg(c.id)); return;
  }
  for (const s of lvl.shrines) {
    if (has(s.ab)||Math.abs(player.x-s.x)>=10||Math.abs(player.y-s.y)>=14) continue;
    S.ab.push(s.ab); writeSave(); impact(0.4,0); playCrystal(); startDlg(tx(s.ab+'Lines')); return;
  }
  for (const c of lvl.cps) {
    if (Math.abs(player.x-c.x)>=12||Math.abs(player.y-c.y)>=14) continue;
    const isNew=!(S.level===currentLevel&&S.cx===c.x);
    if (isNew||isInteract()) {
      S.level=currentLevel; S.cx=c.x; S.cy=c.y+6; checkpointX=c.x; checkpointY=c.y+6;
      player.hp=MAX_HP; writeSave(); playTone(523,0.5,'sine',0.08); playTone(784,0.6,'sine',0.06,0.12);
      for (let i=0;i<12;i++) emit(c.x+3,c.y+3,(Math.random()-0.5),(Math.random()-0.5),40,1,'#ffcc77','spark');
      if (!isNew) { if (!boss) spawnEnemies(lvl); return; }
    }
  }
  if (isInteract()) {
    for (const npc of lvl.npcs) {
      if (Math.abs(player.x-npc.x)+Math.abs(player.y-npc.y)>=40) continue;
      if (npc.type==='source') {
        if (!npc.done) { npc.done=true; startDlg(tx('npc1lines').concat(canShare()?tx('shareHint'):[])); return; }
        if (canShare()) { beginEnding('share'); return; }
      } else if (!npc.done) {
        npc.done=true; if (!S.met.includes(npc.type)) S.met.push(npc.type);
        writeSave(); startDlg(tx(npc.linesKey)); return;
      } else if (T_TEXT[lang][npc.linesKey+'R']) { startDlg(tx(npc.linesKey+'R')); return; }
    }
    if (currentLevel>0&&!boss&&Math.abs(player.x-lvl.sx)<8&&Math.abs(player.y-lvl.sy)<24) {
      const to=currentLevel-1, d=levels[to].door;
      startFade(1,()=>startLevel(to,d.x-28,d.y)); return;
    }
    const src=lvl.npcs.find(n=>n.type==='source');
    if (src&&src.done) {
      const ct=getTile(lvl.tiles,hx,player.y+3);
      if (ct===T.CHOICE_A) { beginEnding('sacrifice'); return; }
      if (ct===T.CHOICE_B) { beginEnding('selfish'); return; }
    }
  }
  if (lvl.door&&Math.abs(player.x-lvl.door.x)<12&&Math.abs(player.y-lvl.door.y)<18) {
    const to=currentLevel+1; startFade(1,()=>startLevel(to));
  }
}

function beginEnding(type) {
  endingType=type;
  startFade(1,()=>{ gameState='ending'; endingTimer=0; stopAmbient(); playEnding(type==='selfish'?'selfish':'sacrifice'); });
}

function respawn() {
  playDeath(); impact(0.8,0);
  player.hp=MAX_HP; player.motes=0; hitStop=0;
  startLevel(S.level,S.cx,S.cy);
  for (let i=0;i<20;i++) emit(player.x+3,player.y+4,(Math.random()-0.5)*2,(Math.random()-0.5)*2,40,1,'#88aadd','spark');
}

function startLevel(idx,x,y) {
  currentLevel=idx;
  const lvl=levels[idx];
  for (const c of lvl.crystals) c.col=S.cr.includes(c.id);
  for (const n of lvl.npcs) n.done=n.type!=='source'&&S.met.includes(n.type);
  fragments=S.cr.length;
  if (x==null) { x=lvl.sx; y=lvl.sy; }
  // Bölge girişi de kayıt noktasıdır
  if (S.level!==idx||S.cx==null) { S.level=idx; S.cx=x; S.cy=y; }
  writeSave();
  resetPlayer(x,y);
  checkpointX=x; checkpointY=y;
  spawnEnemies(lvl);
  updateCam(lvl,true);
  gameState='play';
  startAmbient(idx);
  fadeAlpha=1; fadeDir=-1;
  zoneTimer=0;
}

function startFade(dir,cb) { if (fadeCallback) return; fadeDir=dir; fadeCallback=cb; if(dir===1)fadeAlpha=0; }
function updateFade() {
  if (fadeDir===1) {
    fadeAlpha+=0.025;
    if (fadeAlpha>=1) { fadeAlpha=1; fadeDir=-1; const cb=fadeCallback; fadeCallback=null; if (cb) cb(); }
  } else if (fadeDir===-1) { fadeAlpha-=0.025; if(fadeAlpha<=0){fadeAlpha=0;fadeDir=0;} }
}
function drawFade() { if(fadeAlpha>0){renderCtx.save();renderCtx.globalAlpha=fadeAlpha;renderCtx.fillStyle='#000';renderCtx.fillRect(0,0,WIDTH,HEIGHT);renderCtx.restore();} }

const fogLayers = [
  { y: 0.55, speed: 0.18, amp: 6,  freq: 0.012, alpha: 0.13, h: 28, color: '#1a1830' },
  { y: 0.65, speed: 0.28, amp: 8,  freq: 0.018, alpha: 0.18, h: 22, color: '#1e1a3a' },
  { y: 0.72, speed: 0.12, amp: 5,  freq: 0.009, alpha: 0.12, h: 32, color: '#141228' },
  { y: 0.80, speed: 0.38, amp: 10, freq: 0.022, alpha: 0.22, h: 20, color: '#231e42' },
  { y: 0.88, speed: 0.20, amp: 7,  freq: 0.015, alpha: 0.16, h: 26, color: '#1a1830' },
];
let fogOffset = 0;

// Sis için offscreen buffer
let fogCanvas = null, fogCtx = null;

function drawFog() {
  fogOffset += 0.18;

  const PX = 4; // daha iri piksel bloklar
  const cols = Math.ceil(WIDTH / PX);
  const rows = Math.ceil(HEIGHT / PX);

  if (!fogCanvas) {
    fogCanvas = document.createElement('canvas');
    fogCanvas.width = cols;
    fogCanvas.height = rows;
    fogCtx = fogCanvas.getContext('2d');
  }

  const imgData = fogCtx.createImageData(cols, rows);
  const data = imgData.data;

  for (let row = 0; row < rows; row++) {
    for (let ny = row / rows, col = 0; col < cols; col++) {
      const nx = col / cols;

      // Yavaş kayan köşegen bantlar
      const d1 = Math.sin((nx * 1.8 - ny * 2.4 + fogOffset * 0.006) * Math.PI);
      const d2 = Math.sin((nx * 0.9 + ny * 1.6 - fogOffset * 0.004) * Math.PI * 1.5);
      const d3 = Math.sin((nx * 2.9 - ny * 1.1 + fogOffset * 0.003) * Math.PI * 0.8);

      const noise = d1 * 0.5 + d2 * 0.3 + d3 * 0.2;

      // Sadece koyu bant bölgelerinde piksel bas
      if (noise < 0.05 || noise > 0.62) continue;

      const t = (noise - 0.05) / 0.57;
      const a = t * (1 - t) * 4 * 0.28; // max ~%28 opaklık

      const idx = (row * cols + col) * 4;
      // Neredeyse siyah, çok hafif mor tint
      data[idx]     = 8;
      data[idx + 1] = 6;
      data[idx + 2] = 16;
      data[idx + 3] = Math.floor(a * 255);
    }
  }

  fogCtx.putImageData(imgData, 0, 0);
  renderCtx.save();
  renderCtx.imageSmoothingEnabled = false;
  renderCtx.drawImage(fogCanvas, 0, 0, WIDTH, HEIGHT);
  renderCtx.restore();
}

// --- FLICKER DURUMU (global, drawMenu dışında tutulur) ---
const flicker = {
  phase: 0,       // 0=normal, 1=kesinti
  timer: 0,
  nextAt: 90 + Math.floor(Math.random() * 130),
  alpha: 1,
  offsetX: 0,
  type: 'rapid',  // 'rapid' | 'blackout' | 'glitch'
  dur: 3,
  glitchLine: 0
};

function updateFlicker() {
  flicker.timer++;
  if (flicker.phase === 0) {
    // Normal: alpha'yı 1'e çek, offsetX'i sıfırla
    flicker.alpha += (1 - flicker.alpha) * 0.18;
    flicker.offsetX *= 0.75;
    if (flicker.timer >= flicker.nextAt) {
      flicker.phase = 1;
      flicker.timer = 0;
      // Kesinti türünü seç
      const r = Math.random();
      flicker.type = r < 0.35 ? 'blackout' : r < 0.65 ? 'rapid' : 'glitch';
      flicker.dur = flicker.type === 'blackout' ? 4 + Math.floor(Math.random() * 9)
                  : flicker.type === 'glitch'   ? 5 + Math.floor(Math.random() * 7)
                  :                               2 + Math.floor(Math.random() * 4);
      flicker.glitchLine = Math.floor(Math.random() * 3);
    }
  } else {
    // Kesinti aktif
    if (flicker.type === 'blackout') {
      flicker.alpha = flicker.timer % 2 === 0 ? 0.0 : 0.12;
    } else if (flicker.type === 'rapid') {
      flicker.alpha = flicker.timer % 2 === 0 ? 0.85 : 0.08;
    } else { // glitch
      flicker.alpha = 0.65 + Math.sin(flicker.timer * 2.1) * 0.35;
      flicker.offsetX = (Math.random() - 0.5) * 7;
    }
    if (flicker.timer >= flicker.dur) {
      // %40 ihtimalle ard arda ikinci kısa titreme (sadece rapid/blackout)
      if (Math.random() < 0.4 && flicker.type !== 'glitch') {
        flicker.timer = 0;
        flicker.dur = 1 + Math.floor(Math.random() * 3);
      } else {
        flicker.phase = 0;
        flicker.timer = 0;
        flicker.nextAt = 55 + Math.floor(Math.random() * 200);
        flicker.offsetX = 0;
      }
    }
  }
}

function updateMenu() {
  if (showCtrl) { if(jp['Escape']||jp['Enter']||jp['Space']) showCtrl=false; return; }
  if (showSettings) { updateSettings(); return; }
  const acts=menuActs();
  if (jp['ArrowDown']||jp['KeyS']) menuSel=(menuSel+1)%acts.length;
  if (jp['ArrowUp']||jp['KeyW']) menuSel=(menuSel+acts.length-1)%acts.length;
  if (jp['Enter']||jp['Space']) {
    initAudio();
    const a=acts[menuSel];
    if (a==='cont') {
      S=readSave(); player.hp=MAX_HP; player.motes=0;
      startFade(1,()=>startLevel(S.level,S.cx,S.cy));
    } else if (a==='play'||a==='newGame') {
      S=newSave(); player.hp=MAX_HP; player.motes=0; bossIntro=false;
      startFade(1,()=>{gameState='intro';introStep=0;introTimer=0;});
    } else if (a==='controls') showCtrl=true;
    else showSettings=true;
  }
}
function menuActs() { return readSave()?['cont','newGame','controls','settings']:['play','controls','settings']; }

function updateSettings() {
  if (jp['Escape']) { showSettings=false; settingSel=0; return; }
  if (jp['ArrowDown']||jp['KeyS']) settingSel=(settingSel+1)%2;
  if (jp['ArrowUp']||jp['KeyW']) settingSel=(settingSel+2)%2;
  if (jp['Enter']||jp['Space']||jp['ArrowLeft']||jp['ArrowRight']||jp['KeyA']||jp['KeyD']) {
    if (settingSel===0) {
      soundEnabled=!soundEnabled;
      if (masterGain) masterGain.gain.value = soundEnabled ? 0.6 : 0;
    } else {
      lang = lang==='TR' ? 'ENG' : 'TR';
    }
  }
}

function drawMenu() {
  renderCtx.fillStyle='#030306'; renderCtx.fillRect(0,0,WIDTH,HEIGHT);
  drawFog();
  if (frameCount%4===0) emit(Math.random()*WIDTH,HEIGHT+2,(Math.random()-0.5)*0.2,-Math.random()*0.6-0.3,55,1,'#3344aa','dust');
  drawParts(0,0);
  renderCtx.save();

  // --- BAŞLIK: THE / LAST / LIGHT — elektrik kesintisi efekti ---
  updateFlicker();
  const fk = flicker;
  const titleLines = ['THE', 'LAST', 'LIGHT'];
  const lineH = 20;

  renderCtx.save();
  renderCtx.translate(WIDTH/2 + fk.offsetX, 42);
  renderCtx.rotate(-20 * Math.PI / 180);

  titleLines.forEach(function(line, i) {
    const isMiddle = i === 1;
    renderCtx.font = (isMiddle ? '15px' : '12px') + ' "Press Start 2P",monospace';

    // Glitch satırına özel kayma
    let la = fk.alpha;
    let lox = 0;
    if (fk.phase === 1 && fk.type === 'glitch' && i === fk.glitchLine) {
      la = Math.random() < 0.5 ? 1.0 : 0.15;
      lox = (Math.random() - 0.5) * 9;
    }

    const lw = renderCtx.measureText(line).width;
    const bx = -lw / 2 + lox;
    const by = i * lineH;

    // Elektrik mavi halo (normal fazda hafif, kesintide parlayan)
    if (la > 0.3) {
      renderCtx.globalAlpha = la * (fk.phase === 1 ? 0.35 : 0.12);
      renderCtx.fillStyle = '#33aaff';
      renderCtx.fillText(line, bx + 1, by + 1);
      renderCtx.fillText(line, bx - 1, by - 1);
    }

    // Glitch renk ayrışması (kırmızı + cyan katmanları)
    if (fk.phase === 1 && fk.type === 'glitch' && i === fk.glitchLine) {
      renderCtx.globalAlpha = la * 0.6;
      renderCtx.fillStyle = '#ff4422';
      renderCtx.fillText(line, bx - 2, by);
      renderCtx.globalAlpha = la * 0.5;
      renderCtx.fillStyle = '#22ffee';
      renderCtx.fillText(line, bx + 2, by);
    }

    // Ana metin
    renderCtx.globalAlpha = la;
    renderCtx.fillStyle = isMiddle ? '#cceeff' : '#7799bb';
    renderCtx.fillText(line, bx, by);

    // "LAST" satırı üzerinde ince parlama çizgisi (tam parlak anında)
    if (isMiddle && la > 0.85 && fk.phase === 0) {
      renderCtx.globalAlpha = (la - 0.85) * 1.2;
      renderCtx.fillStyle = '#aaddff';
      renderCtx.fillRect(bx, by - 13, lw, 1);
    }
  });

  renderCtx.globalAlpha = 1;
  renderCtx.restore();
  // --- BAŞLIK SONU ---

  // Alt yazı ve menü seçenekleri
  renderCtx.fillStyle='#334'; renderCtx.font='6px "Press Start 2P",monospace';
  const subW=renderCtx.measureText(tx('atmospheric')).width;
  renderCtx.fillText(tx('atmospheric'),WIDTH/2-subW/2,108);
  const items=menuActs().map(tx);
  renderCtx.font='7px "Press Start 2P",monospace';
  items.forEach((it,i)=>{
    renderCtx.fillStyle=i===menuSel?'#dde':'#556';
    const tw=renderCtx.measureText('> '+it).width;
    renderCtx.fillText((i===menuSel?'> ':'  ')+it,WIDTH/2-tw/2,124+i*14);
  });
  renderCtx.restore();
  if (showCtrl) drawCtrlScreen();
  if (showSettings) drawSettingsScreen();
}

}
function drawIntro() {
  renderCtx.fillStyle='#020204'; renderCtx.fillRect(0,0,WIDTH,HEIGHT);
  const introTxts=tx('introTxts');
  if (introStep<introTxts.length&&introTxts[introStep]) {
    const a=Math.min(1,introTimer/35);
    renderCtx.save(); renderCtx.globalAlpha=a;
    renderCtx.fillStyle='#8899bb'; renderCtx.font='7px "Press Start 2P",monospace';
    const txt=introTxts[introStep];
    const tw=renderCtx.measureText(txt).width;
    renderCtx.fillText(txt,(WIDTH-tw)/2,HEIGHT/2);
    renderCtx.restore();
  }
}

function updatePause() {
  if (jp['ArrowDown']||jp['KeyS']) pauseSel=(pauseSel+1)%2;
  if (jp['ArrowUp']||jp['KeyW']) pauseSel=(pauseSel+1)%2;
  if (jp['Enter']||jp['Space']) { if(pauseSel===0)gameState='play'; else{gameState='menu';menuSel=0;stopAmbient();} }
  if (jp['Escape']) gameState='play';
}
function drawPause() {
  renderCtx.fillStyle='rgba(0,0,0,0.82)'; renderCtx.fillRect(0,0,WIDTH,HEIGHT);
  renderCtx.fillStyle='#ccd'; renderCtx.font='7px "Press Start 2P",monospace';
  renderCtx.fillText(tx('pause'),WIDTH/2-34,55);
  [tx('resume'),tx('mainMenu')].forEach((it,i)=>{
    renderCtx.fillStyle=i===pauseSel?'#fff':'#556';
    renderCtx.fillText((i===pauseSel?'> ':'  ')+it,WIDTH/2-40,80+i*16);
  });
}

const END_SPEED=330;
const endTexts=()=>tx(endingType==='sacrifice'?'endSacrifice':endingType==='share'?'endShare':'endSelfish');
function updateEnding() {
  endingTimer++;
  const last=Math.ceil(endTexts().length/3)-1, g=Math.floor(endingTimer/END_SPEED);
  if (endingTimer>END_SPEED*(last+1)+30) {
    if (jp['Enter']||jp['Space']) { gameState='menu'; menuSel=0; endingTimer=0; S=newSave(); fragments=0; clearSave(); }
  } else if ((jp['Enter']||jp['Space'])&&fadeAlpha<=0) endingTimer=g<last?(g+1)*END_SPEED:END_SPEED*(last+1)+31;
}
function drawEnding() {
  renderCtx.fillStyle=endingType==='sacrifice'?'#030508':'#050303';
  renderCtx.fillRect(0,0,WIDTH,HEIGHT);
  const texts=endTexts(), speed=END_SPEED;
  const grp=Math.min(Math.ceil(texts.length/3)-1,Math.floor(endingTimer/speed));
  const alpha=Math.min(1,(endingTimer-grp*speed)/30);
  renderCtx.save(); renderCtx.font='7px "Press Start 2P",monospace';
  for (let i=0;i<3;i++) {
    const li=grp*3+i; if(li>=texts.length) break;
    renderCtx.fillStyle=endingType==='sacrifice'?'#99ccee':endingType==='share'?'#ffe2a8':'#ddaa77';
    renderCtx.globalAlpha=alpha;
    const tw=renderCtx.measureText(texts[li]).width;
    renderCtx.fillText(texts[li],(WIDTH-tw)/2,55+i*22);
  }
  renderCtx.restore();
  if (endingType!=='selfish') {
    if(frameCount%3===0) emit(Math.random()*WIDTH,HEIGHT+3,(Math.random()-0.5)*0.4,-Math.random()*1.2-0.4,70,1,'#88ccff','dust');
  } else {
    if(frameCount%8===0) emit(Math.random()*WIDTH,Math.random()*HEIGHT,(Math.random()-0.5)*0.15,(Math.random()-0.5)*0.15,50,1,'#443322','dust');
  }
  drawParts(0,0);
  if (endingTimer>speed*Math.ceil(texts.length/3)+30) {
    renderCtx.globalAlpha=0.7+Math.sin(frameCount*0.05)*0.3;
    renderCtx.fillStyle='#778'; renderCtx.font='6px "Press Start 2P",monospace';
    const rt=tx('returnMenu'); renderCtx.fillText(rt,(WIDTH-renderCtx.measureText(rt).width)/2,HEIGHT-14);
    renderCtx.globalAlpha=1;
  }
}

const STEP=1000/60;
let acc=0;
function loop(time) {
  requestAnimationFrame(loop);
  let dt=Math.max(0,Math.min(100,time-lastTime)); lastTime=time;
  if (Math.abs(dt-STEP)<1.5) dt=STEP;      // 60 Hz ekranda titremeyi önle
  acc+=dt;
  let ran=false;
  while (acc>=STEP) { acc-=STEP; tick(); clearJP(); ran=true; }
  if (ran) render();
}

function tick() {
  frameCount++;
  updateFade();
  updateParts();
  switch(gameState) {
    case 'loading':
    case 'menu': if (!fadeCallback) updateMenu(); break;
    case 'intro': if (!fadeCallback) updateIntro(); break;
    case 'play': updatePlay(); break;
    case 'dialogue': trauma=Math.max(0,trauma-0.02); updateDlg(); break;
    case 'pause': updatePause(); break;
    case 'ending': updateEnding(); break;
  }
}

function drawWorld() {
  const lvl=levels[currentLevel], ox=cam.x, oy=cam.y, sh=trauma*trauma;
  cam.x+=Math.round(Math.sin(frameCount*0.85)*6*sh);
  cam.y+=Math.round(Math.sin(frameCount*1.15)*4*sh);
  drawParallax(lvl); drawDeco(lvl); drawTiles(lvl); drawWorldProps(lvl);
  drawCrystals(lvl); drawNPCs(lvl); drawDoor(lvl); drawEnemies(); drawPlayer();
  drawParts(cam.x,cam.y); drawLighting(); drawEyes(); drawForeground();
  cam.x=ox; cam.y=oy;
  drawHUD();
  if (lvl.arena) drawChoices();
}

function render() {
  renderCtx.globalAlpha=1;
  renderCtx.fillStyle=levels[currentLevel].bg;
  renderCtx.fillRect(0,0,WIDTH,HEIGHT);
  switch(gameState) {
    case 'loading':
    case 'menu': drawMenu(); break;
    case 'intro': drawIntro(); break;
    case 'play': drawWorld(); break;
    case 'dialogue': drawWorld(); drawDlg(); break;
    case 'pause': drawWorld(); drawPause(); break;
    case 'ending': drawEnding(); break;
  }
  drawFade();
  ctx.drawImage(renderCanvas,0,0);
}

function resize() {
  const ratio=WIDTH/HEIGHT;
  let w=window.innerWidth, h=window.innerHeight;
  if (w/h>ratio) w=h*ratio; else h=w/ratio;
  canvas.style.width=Math.floor(w)+'px';
  canvas.style.height=Math.floor(h)+'px';
}

function init() {
  if (window.gameInitialized) return;
  window.gameInitialized = true;
  canvas=document.getElementById('game');
  canvas.width=WIDTH; canvas.height=HEIGHT;
  ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  renderCanvas=document.createElement('canvas');
  renderCanvas.width=WIDTH; renderCanvas.height=HEIGHT;
  renderCtx=renderCanvas.getContext('2d');
  renderCtx.imageSmoothingEnabled=false;
  lightCanvas=document.createElement('canvas');
  lightCanvas.width=WIDTH; lightCanvas.height=HEIGHT;
  lightCtx=lightCanvas.getContext('2d');
  window.addEventListener('resize',resize);
  resize();
  clearJP();
  for (let k in keys) delete keys[k];
  gameState = 'menu';
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function startWhenReady() {
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function() { setTimeout(init, 100); }).catch(function() { setTimeout(init, 100); });
  } else {
    setTimeout(init, 500);
  }
}

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  startWhenReady();
} else {
  document.addEventListener('DOMContentLoaded', startWhenReady);
}
setTimeout(function() { if (!window.gameInitialized) init(); }, 3000);

})();
</script>
</body>
</html>
