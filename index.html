function tx(key) { return T_TEXT[lang][key]; }

const keys = {};
const jp = {};

document.addEventListener('keydown', e => {
  if (!keys[e.code]) jp[e.code] = true;
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (actx && actx.state === 'suspended') actx.resume().catch(()=>{});
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function isLeft() { return keys['ArrowLeft'] || keys['KeyA']; }
function isRight() { return keys['ArrowRight'] || keys['KeyD']; }
function isJump() { return jp['Space'] || jp['ArrowUp'] || jp['KeyW']; }
function isInteract() { return jp['KeyE'] || jp['Enter']; }
function isPause() { return jp['Escape']; }
function clearJP() { for (let k in jp) delete jp[k]; }

let actx = null, masterGain = null, audioReady = false;
let ambOsc = null, windSrc = null, ambGain2 = null, windGain2 = null;

function initAudio() {
  if (audioReady) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain();
    masterGain.gain.value = 0.6;
    masterGain.connect(actx.destination);
    audioReady = true;
    if (actx.state === 'suspended') actx.resume().catch(()=>{});
  } catch(e) {}
}

function playTone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol || 0.1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur);
}

function playCrystal() {
  playTone(880, 0.4, 'sine', 0.12);
  playTone(1320, 0.5, 'sine', 0.08, 0.08);
  playTone(1760, 0.4, 'sine', 0.06, 0.16);
}

function playStep() {
  if (!actx) return;
  const sr = actx.sampleRate;
  const len = Math.floor(sr * 0.055);
  const buf = actx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const env = Math.pow(1 - i / len, 2.5);
    d[i] = (Math.random() * 2 - 1) * env * 0.18;
  }
  const flt = actx.createBiquadFilter();
  flt.type = 'lowpass';
  flt.frequency.value = 900 + Math.random() * 400;
  flt.Q.value = 0.6;
  const o = actx.createOscillator();
  const og = actx.createGain();
  o.type = 'sine';
  o.frequency.value = 120 + Math.random() * 40;
  og.gain.setValueAtTime(0.04, actx.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.04);
  o.connect(og); og.connect(masterGain);
  o.start(); o.stop(actx.currentTime + 0.04);
  const src = actx.createBufferSource();
  const ng = actx.createGain();
  ng.gain.value = 0.55;
  src.buffer = buf;
  src.connect(flt); flt.connect(ng); ng.connect(masterGain);
  src.start();
}

function playTick() {
  if (!actx) return;
  const sr = actx.sampleRate;
  const t = actx.currentTime;
  const len = Math.floor(sr * 0.025);
  const buf = actx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3) * 1.0;
  }
  const src = actx.createBufferSource();
  const flt = actx.createBiquadFilter();
  flt.type = 'bandpass';
  flt.frequency.value = 800 + Math.random() * 300;
  flt.Q.value = 2.5;
  const g = actx.createGain();
  g.gain.value = 0.45;
  src.buffer = buf;
  src.connect(flt); flt.connect(g); g.connect(masterGain);
  src.start(t);
  const o = actx.createOscillator();
  const og = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(180 + Math.random() * 40, t);
  o.frequency.exponentialRampToValueAtTime(90, t + 0.03);
  og.gain.setValueAtTime(0.12, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  o.connect(og); og.connect(masterGain);
  o.start(t); o.stop(t + 0.04);
}

function playJump() {
  if (!actx) return;
  const t = actx.currentTime;
  const o1 = actx.createOscillator();
  const g1 = actx.createGain();
  o1.type = 'sine';
  o1.frequency.setValueAtTime(180, t);
  o1.frequency.exponentialRampToValueAtTime(420, t + 0.14);
  g1.gain.setValueAtTime(0.09, t);
  g1.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o1.connect(g1); g1.connect(masterGain);
  o1.start(t); o1.stop(t + 0.18);
  const o2 = actx.createOscillator();
  const g2 = actx.createGain();
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(360, t + 0.02);
  o2.frequency.exponentialRampToValueAtTime(700, t + 0.13);
  g2.gain.setValueAtTime(0.04, t + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  o2.connect(g2); g2.connect(masterGain);
  o2.start(t + 0.02); o2.stop(t + 0.16);
}

function playDeath() { playTone(150, 0.3, 'sawtooth', 0.06); playTone(100, 0.4, 'sine', 0.04, 0.1); }

function startAmbient(lvl) {
  if (!actx) return;
  stopAmbient();
  const scales = [
    [220, 261, 294, 330, 392],
    [196, 220, 261, 294, 349],
    [174, 196, 220, 261, 294],
    [164, 196, 220, 246, 294],
    [220, 246, 294, 330, 370],
  ];
  const scale = scales[Math.min(lvl, scales.length - 1)];
  windGain2 = actx.createGain();
  windGain2.gain.value = 0;
  windGain2.connect(masterGain);
  let melodyActive = true;
  function schedMelody(startTime) {
    if (!melodyActive) return;
    const gap = 2.2 + Math.random() * 3.5;
    const note = scale[Math.floor(Math.random() * scale.length)];
    const harmNote = scale[Math.floor(Math.random() * scale.length)];
    const t = startTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine';
    o.frequency.value = note;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.028, t + 0.18);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 1.4);
    const o2 = actx.createOscillator();
    const g2 = actx.createGain();
    o2.type = 'triangle';
    o2.frequency.value = harmNote * 1.5;
    g2.gain.setValueAtTime(0, t + 0.05);
    g2.gain.linearRampToValueAtTime(0.010, t + 0.25);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
    o2.connect(g2); g2.connect(masterGain);
    o2.start(t + 0.05); o2.stop(t + 1.2);
    const tid = setTimeout(() => { if (melodyActive) schedMelody(actx.currentTime); }, gap * 1000);
    windGain2._tid = tid;
  }
  schedMelody(actx.currentTime + 0.5);
  windGain2._stop = () => { melodyActive = false; if (windGain2._tid) clearTimeout(windGain2._tid); };
}

function stopAmbient() {
  try { if (ambOsc) ambOsc.stop(); } catch(e){}
  try { if (windSrc) windSrc.stop(); } catch(e){}
  try { if (windGain2 && windGain2._stop) windGain2._stop(); } catch(e){}
  ambOsc = null; windSrc = null; windGain2 = null;
}

function playEnding(type) {
  if (!actx) return;
  const notes = type === 'sacrifice'
    ? [262,294,330,349,392,440,494,523,587]
    : [220,196,185,165,147,131,123,110,98];
  notes.forEach((n,i) => {
    playTone(n, 1.0, 'sine', 0.10, i*0.5);
    playTone(n*1.5, 0.7, 'triangle', 0.05, i*0.5+0.15);
  });
}

const parts = [];
for (let i = 0; i < PARTICLE_POOL; i++) parts.push({a:false,x:0,y:0,vx:0,vy:0,l:0,ml:0,s:1,c:'#fff',t:'n'});

function emit(x,y,vx,vy,life,size,color,type) {
  for (let p of parts) {
    if (!p.a) { p.a=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.l=life;p.ml=life;p.s=size;p.c=color;p.t=type||'n'; return; }
  }
}

function updateParts() {
  for (let p of parts) {
    if (!p.a) continue;
    p.x+=p.vx; p.y+=p.vy; p.l--;
    if (p.t==='dust') p.vy-=0.008;
    if (p.t==='spark') { p.vy+=0.015; p.vx*=0.97; }
    if (p.l<=0) p.a=false;
  }
}

function drawParts(cx,cy) {
  renderCtx.save();
  renderCtx.globalCompositeOperation = 'lighter';
  for (let p of parts) {
    if (!p.a) continue;
    const sx=p.x-cx, sy=p.y-cy;
    if (sx<-10||sx>WIDTH+10||sy<-10||sy>HEIGHT+10) continue;
    renderCtx.globalAlpha = p.l/p.ml;
    renderCtx.fillStyle = p.c;
    renderCtx.fillRect(Math.floor(sx), Math.floor(sy), p.s, p.s);
  }
  renderCtx.restore();
}

const cam = {x:0,y:0};
function updateCam(lvl) {
  const tx = player.x - WIDTH/2 + player.w/2;
  const ty = player.y - HEIGHT/2 + player.h/2;
  cam.x += (tx-cam.x)*0.07;
  cam.y += (ty-cam.y)*0.07;
  cam.x = Math.max(0, Math.min(cam.x, lvl.w*TILE-WIDTH));
  cam.y = Math.max(0, Math.min(cam.y, lvl.h*TILE-HEIGHT));
}

}

function fillR(t,x1,y1,x2,y2,v) {
  for (let y=y1;y<=y2;y++) for (let x=x1;x<=x2;x++)
    if (y>=0&&y<t.length&&x>=0&&x<t[0].length) t[y][x]=v;
}

let dlgActive=false, dlgLines=[], dlgLine=0, dlgChar=0, dlgTimer=0, dlgCB=null;

function startDlg(lines,cb) {
  dlgActive=true; dlgLines=lines; dlgLine=0; dlgChar=0; dlgTimer=0; dlgCB=cb||null;
  gameState='dialogue';
}

function updateDlg() {
  if (!dlgActive) return;
  dlgTimer++;
  if (dlgTimer%2===0 && dlgChar<dlgLines[dlgLine].length) {
    dlgChar++;
    if (dlgChar%3===0) playTick();
  }
  if (jp['Space']||jp['KeyE']||jp['Enter']) {
    if (dlgChar<dlgLines[dlgLine].length) { dlgChar=dlgLines[dlgLine].length; }
    else { dlgLine++; dlgChar=0; if (dlgLine>=dlgLines.length) { dlgActive=false; gameState='play'; if(dlgCB) dlgCB(); } }
  }
}

function drawDlg() {
  if (!dlgActive) return;
  renderCtx.save();
  renderCtx.fillStyle='rgba(0,0,0,0.88)';
  renderCtx.fillRect(8,HEIGHT-52,WIDTH-16,46);
  renderCtx.strokeStyle='#445'; renderCtx.lineWidth=1;
  renderCtx.strokeRect(8,HEIGHT-52,WIDTH-16,46);
  renderCtx.fillStyle='#ccd';
  renderCtx.font='7px "Press Start 2P",monospace';
  const txt=dlgLines[dlgLine].substring(0,dlgChar);
  wrapTxt(renderCtx,txt,14,HEIGHT-40,WIDTH-28,9);
  if (dlgChar>=dlgLines[dlgLine].length) {
    renderCtx.fillStyle='#889';
    renderCtx.fillText('▼',WIDTH-20,HEIGHT-12);
  }
  renderCtx.restore();
}

function wrapTxt(c,text,x,y,mw,lh) {
  const words=text.split(' '); let line='', ly=y;
  for (let w of words) {
    const test=line+w+' ';
    if (c.measureText(test).width>mw&&line!=='') { c.fillText(line.trim(),x,ly); line=w+' '; ly+=lh; }
    else line=test;
  }
  c.fillText(line.trim(),x,ly);
}

function getCrystDlg(id) { return tx('crystDlg')[id]; }

function drawParallax(lvl) {
  const cols=lvl.pcolors;
  renderCtx.fillStyle=cols[0];
  for (let i=0;i<8;i++) {
    const bx=i*55-(cam.x*0.1)%55;
    const bh=25+Math.sin(i*1.7)*12+Math.cos(i*0.8)*8;
    drawMtn(bx,HEIGHT-bh,55,bh);
  }
  renderCtx.fillStyle=cols[1];
  for (let i=0;i<10;i++) {
    const bx=i*40-(cam.x*0.3)%40;
    const bh=18+Math.sin(i*2.3+1)*8;
    drawHill(bx,HEIGHT-bh,40,bh);
  }
  renderCtx.fillStyle=cols[2];
  for (let i=0;i<14;i++) {
    const bx=i*30-(cam.x*0.55)%30;
    const bh=12+Math.sin(i*3.1+2)*6;
    drawHill(bx,HEIGHT-bh,30,bh);
  }
}

function drawMtn(x,y,w,h) {
  renderCtx.beginPath();
  renderCtx.moveTo(x,y+h); renderCtx.lineTo(x+w*0.2,y+h*0.3);
  renderCtx.lineTo(x+w*0.4,y); renderCtx.lineTo(x+w*0.6,y+h*0.2);
  renderCtx.lineTo(x+w*0.8,y+h*0.1); renderCtx.lineTo(x+w,y+h);
  renderCtx.fill();
}

function drawHill(x,y,w,h) {
  renderCtx.beginPath();
  renderCtx.moveTo(x,y+h);
  renderCtx.quadraticCurveTo(x+w*0.5,y-h*0.4,x+w,y+h);
  renderCtx.fill();
}

function drawTiles(lvl) {
  const sc=Math.max(0,Math.floor(cam.x/TILE));
  const ec=Math.min(lvl.w,Math.ceil((cam.x+WIDTH)/TILE)+1);
  const sr=Math.max(0,Math.floor(cam.y/TILE));
  const er=Math.min(lvl.h,Math.ceil((cam.y+HEIGHT)/TILE)+1);
  for (let r=sr;r<er;r++) for (let c=sc;c<ec;c++) {
    const tile=lvl.tiles[r][c];
    const sx=Math.floor(c*TILE-cam.x), sy=Math.floor(r*TILE-cam.y);
    if (tile===T.SOLID) {
      const isBottom = r < lvl.h - 1 && lvl.tiles[r+1][c] === T.AIR;
      const isTop = r > 0 && lvl.tiles[r-1][c] === T.AIR;
      const isLeft = c > 0 && lvl.tiles[r][c-1] === T.AIR;
      const isRight = c < lvl.w - 1 && lvl.tiles[r][c+1] === T.AIR;
      renderCtx.fillStyle = '#171524';
      renderCtx.fillRect(sx, sy, TILE, TILE);
      renderCtx.fillStyle = '#100e1a';
      for (let x = 0; x < TILE; x++) {
        const waveY = 4 + Math.sin((c * TILE + x) * 0.6) * 1.5;
        renderCtx.fillRect(sx + x, sy + Math.floor(waveY), 1, TILE - Math.floor(waveY));
      }
      if (c % 2 === 0) {
        renderCtx.fillStyle = '#0a0910';
        renderCtx.fillRect(sx + 3, sy, 1, TILE);
      }
      if (isBottom) {
        renderCtx.fillStyle = '#05040a';
        for (let x = 0; x < TILE; x++) {
          const cut = (x === 0 || x === 7) ? 1 : (x === 3 || x === 4) ? 2 : 1;
          renderCtx.fillRect(sx + x, sy + TILE - cut, 1, cut);
        }
      }
      if (isLeft) { renderCtx.fillStyle = '#0d0b17'; renderCtx.fillRect(sx, sy, 1, TILE); }
      if (isRight) { renderCtx.fillStyle = '#0d0b17'; renderCtx.fillRect(sx + TILE - 1, sy, 1, TILE); }
      if (isTop) {
        const mossBase  = '#1a4a1e';
        const mossMid   = '#256030';
        const mossLight = '#317a3a';
        const drips = [2, 3, 2, 1, 2, 4, 3, 2];
        renderCtx.fillStyle = mossBase;
        for (let x = 0; x < TILE; x++) {
          const dripIdx = (c * TILE + x) % drips.length;
          const h = drips[dripIdx];
          renderCtx.fillRect(sx + x, sy, 1, h);
        }
        renderCtx.fillStyle = mossMid;
        for (let x = 1; x < TILE - 1; x++) {
          const dripIdx = (c * TILE + x) % drips.length;
          const h = drips[dripIdx];
          if (h >= 2) renderCtx.fillRect(sx + x, sy, 1, h - 1);
        }
        renderCtx.fillStyle = mossLight;
        renderCtx.fillRect(sx, sy, TILE, 1);
        for (let x = 0; x < TILE; x += 2) {
          if ((c + x) % 4 === 0) renderCtx.fillRect(sx + x, sy, 1, 1);
        }
      }
    } else if (tile===T.PLATFORM) {
      renderCtx.fillStyle='#333346'; renderCtx.fillRect(sx,sy,TILE,2);
      renderCtx.fillStyle='#444460'; renderCtx.fillRect(sx,sy,TILE,1);
    } else if (tile===T.CHOICE_A) {
      renderCtx.fillStyle=`rgba(80,160,255,${0.3+Math.sin(frameCount*0.04)*0.15})`;
      renderCtx.fillRect(sx,sy,TILE,TILE);
    } else if (tile===T.CHOICE_B) {
      renderCtx.fillStyle=`rgba(255,140,80,${0.3+Math.sin(frameCount*0.04)*0.15})`;
      renderCtx.fillRect(sx,sy,TILE,TILE);
    }
  }
}

function drawCrystals(lvl) {
  for (let c of lvl.crystals) {
    if (c.col) continue;
    const sx=c.x-cam.x, sy=c.y-cam.y+Math.sin(frameCount*0.05)*2;
    if (sx<-16||sx>WIDTH+16) continue;
    renderCtx.save();
    renderCtx.globalAlpha=0.25+Math.sin(frameCount*0.07)*0.1;
    renderCtx.fillStyle='#88ddff';
    renderCtx.beginPath(); renderCtx.arc(sx+4,sy+4,6,0,Math.PI*2); renderCtx.fill();
    renderCtx.globalAlpha=1;
    renderCtx.fillStyle='#bbffff';
    renderCtx.beginPath();
    renderCtx.moveTo(sx+4,sy); renderCtx.lineTo(sx+7,sy+4);
    renderCtx.lineTo(sx+4,sy+8); renderCtx.lineTo(sx+1,sy+4);
    renderCtx.fill();
    renderCtx.fillStyle='#fff'; renderCtx.fillRect(sx+3,sy+2,2,2);
    renderCtx.restore();
    if (frameCount%18===0) emit(c.x+4+Math.random()*4-2,c.y+4,(Math.random()-0.5)*0.4,-Math.random()*0.4,25,1,'#88ddff','spark');
  }
}

      // Dallar
      renderCtx.fillStyle='#1e1409';

      renderCtx.fillRect(Math.floor(sx+6-sway*0.4), Math.floor(sy+3),  3,  5);

      renderCtx.fillRect(Math.floor(sx+2+sway*0.2), Math.floor(sy+2),  4,  3);
      renderCtx.fillRect(Math.floor(sx+1+sway*0.3), Math.floor(sy+5),  3,  2);
      renderCtx.fillRect(Math.floor(sx+5-sway*0.2), Math.floor(sy+4),  2,  2);

    } else if (npc.type==='source') {

function drawDoor(lvl) {
  if (!lvl.door) return;
  const d=lvl.door, sx=d.x-cam.x, sy=d.y-cam.y;
  const p=Math.sin(frameCount*0.04)*0.2+0.6;
  renderCtx.save();
  renderCtx.globalAlpha=p*0.35;
  renderCtx.fillStyle='#7755ff';
  renderCtx.beginPath(); renderCtx.arc(sx+4,sy+8,11,0,Math.PI*2); renderCtx.fill();
  renderCtx.globalAlpha=p;
  renderCtx.fillStyle='#9977ff'; renderCtx.fillRect(Math.floor(sx),Math.floor(sy),8,16);
  renderCtx.fillStyle='#ccaaff'; renderCtx.fillRect(Math.floor(sx+2),Math.floor(sy+2),4,12);
  renderCtx.restore();
  if (frameCount%7===0) emit(d.x+Math.random()*8,d.y+Math.random()*16,(Math.random()-0.5)*0.2,-Math.random()*0.4,35,1,'#aa88ff','spark');
}

function drawPlayer() {
  // Squash & Stretch boyutları hesapla
  let rw, rh, offX, offY;
  if (player.squash > 0) {
    // Squash: yatayda genişle, dikeyde küçül (yere iniş)
    const t = player.squash / 8;
    rw = Math.round(5 + 2 * t);   // 5 → 7
    rh = Math.round(7 - 2 * t);   // 7 → 5
  } else if (player.squash < 0) {
    // Stretch: dikeyde uzat, yatayda daralt (zıplama)
    rw = 4;
    rh = 8;
  } else {
    rw = 5; rh = 7;
  }
  // Ayaklar zemine sabit kalsın diye y ofset
  offX = Math.floor((5 - rw) / 2);
  offY = 7 - rh;

  const sx=Math.floor(player.x-cam.x)+offX, sy=Math.floor(player.y-cam.y)+offY;
  renderCtx.save();
  renderCtx.globalCompositeOperation='lighter';
  const p=Math.sin(frameCount*0.07)*0.12+0.85;
  renderCtx.globalAlpha=0.25*p;
  renderCtx.fillStyle='#88bbff';
  renderCtx.beginPath(); renderCtx.arc(sx+rw/2,sy+rh/2,7,0,Math.PI*2); renderCtx.fill();
  renderCtx.globalAlpha=0.45*p;
  renderCtx.fillStyle='#cceeff';
  renderCtx.beginPath(); renderCtx.arc(sx+rw/2,sy+rh/2,4,0,Math.PI*2); renderCtx.fill();
  renderCtx.restore();
  // Gövde
  renderCtx.fillStyle='#eef8ff';
  renderCtx.fillRect(sx+1,sy+1,rw-2,rh-2);
  renderCtx.fillStyle='#ffffff';
  renderCtx.fillRect(sx+Math.floor(rw/2)-1,sy+2,1,rh-4);
  // Gözler (sadece normal/stretch modda göster)
  if (rw >= 4) {
    renderCtx.fillStyle='#6699cc';
    renderCtx.fillRect(sx+1,sy+2,1,1);
    renderCtx.fillRect(sx+rw-2,sy+2,1,1);
  }
  if (frameCount%4===0&&(player.vx!==0||!player.grounded))
    emit(player.x+2,player.y+6,(Math.random()-0.5)*0.15,0.15,18,1,'#6699bb','dust');
}

function getTile(tiles,px,py) {
  const tx=Math.floor(px/TILE), ty=Math.floor(py/TILE);
  if (ty<0||ty>=tiles.length||tx<0||tx>=tiles[0].length) return T.AIR;
  return tiles[ty][tx];
}
function isSolid(tiles,px,py) { return getTile(tiles,px,py)===T.SOLID; }

function resolveX(lvl) {
  const t=lvl.tiles;
  for (let i=0;i<3;i++) {
    const cy=player.y+1+(player.h-2)*i/2;
    if (player.vx>0&&isSolid(t,player.x+player.w,cy)) { player.x=Math.floor((player.x+player.w)/TILE)*TILE-player.w; player.vx=0; break; }
    if (player.vx<0&&isSolid(t,player.x,cy)) { player.x=Math.floor(player.x/TILE)*TILE+TILE; player.vx=0; break; }
  }
}

function resolveY(lvl) {
  const t=lvl.tiles;
  player.grounded=false;
  for (let i=0;i<2;i++) {
    const cx=player.x+1+(player.w-2)*i;
    if (player.vy>0) {
      if (isSolid(t,cx,player.y+player.h)) {
        player.y=Math.floor((player.y+player.h)/TILE)*TILE-player.h;
        player.vy=0; player.grounded=true; break;
      }
      const ty=Math.floor((player.y+player.h)/TILE);
      const tx=Math.floor(cx/TILE);
      if (ty>=0&&ty<t.length&&tx>=0&&tx<t[0].length) {
        if (t[ty][tx]===T.PLATFORM && player.y+player.h-player.vy<=ty*TILE+1) {
          player.y=ty*TILE-player.h; player.vy=0; player.grounded=true; break;
        }
      }
    } else if (player.vy<0) {
      if (isSolid(t,cx,player.y)) { player.y=Math.floor(player.y/TILE)*TILE+TILE; player.vy=0; break; }
    }
  }
}

function updatePlay() {
  if (isPause()) { gameState='pause'; pauseSel=0; return; }
  const lvl=levels[currentLevel];
  player.vx=0;
  if (isLeft()) { player.vx=-PLAYER_SPEED; player.face=-1; }
  if (isRight()) { player.vx=PLAYER_SPEED; player.face=1; }
  if (player.grounded&&player.vx!==0) { player.stepT++; if(player.stepT>15){playStep();player.stepT=0;} }
  else player.stepT=10;
  if (player.grounded) player.coyote=COYOTE_TIME; else if(player.coyote>0) player.coyote--;
  if (isJump()) player.jbuf=JUMP_BUFFER; else if(player.jbuf>0) player.jbuf--;
  if (player.jbuf>0&&player.coyote>0) { player.vy=JUMP_FORCE; player.jbuf=0; player.coyote=0; player.grounded=false; playJump(); }
  if (!keys['Space']&&!keys['ArrowUp']&&!keys['KeyW']&&player.vy<-1) player.vy*=0.4;
  player.vy+=GRAVITY; if(player.vy>MAX_FALL) player.vy=MAX_FALL;
  player.x+=player.vx; resolveX(lvl);
  player.y+=player.vy; resolveY(lvl);

  // Squash & Stretch
  const justLanded = !player.wasGrounded && player.grounded;
  if (justLanded && player.prevVy > 1.5) {
    // Sert iniş → squash (yatayda genişle), şiddet hıza bağlı
    player.squash = Math.min(8, Math.round(player.prevVy * 1.8));
  } else if (player.grounded && player.squash < 0) {
    // Yere değdiğinde stretch bitir
    player.squash = 0;
  }
  // Squash sayacını azalt
  if (player.squash > 0) player.squash--;
  // Stretch: havadayken ve yukarı çıkarken
  if (!player.grounded && player.vy < -0.5 && player.squash <= 0) {
    player.squash = -1;
  } else if (player.grounded && player.squash === -1) {
    player.squash = 0;
  }
  player.wasGrounded = player.grounded;
  player.prevVy = player.vy;
  if (player.y>lvl.h*TILE+30) { respawn(); return; }
  const hx=player.x+player.w/2, hy=player.y+player.h;
  if (getTile(lvl.tiles,hx,hy)===T.HAZARD||getTile(lvl.tiles,hx,hy-1)===T.HAZARD) { respawn(); return; }
  for (let c of lvl.crystals) {
    if (c.col) continue;
    if (Math.abs(player.x-c.x)<10&&Math.abs(player.y-c.y)<10) {
      c.col=true; fragments++; playCrystal();
      for (let i=0;i<14;i++) emit(c.x+4,c.y+4,(Math.random()-0.5)*2,(Math.random()-0.5)*2,35,1,'#88eeff','spark');
      if (getCrystDlg(c.id)) startDlg(getCrystDlg(c.id));
    }
  }
  for (let cp of lvl.cps) { if (Math.abs(player.x-cp.x)<14&&Math.abs(player.y-cp.y)<14) { checkpointX=cp.x; checkpointY=cp.y; } }
  if (isInteract()) {
    for (let npc of lvl.npcs) {
      if (Math.abs(player.x-npc.x)+Math.abs(player.y-npc.y)<40&&!npc.done) {
        npc.done=true; startDlg(npc.linesKey ? tx(npc.linesKey) : npc.lines);
      }
    }
  }
  if (lvl.door) {
    if (Math.abs(player.x-lvl.door.x)<12&&Math.abs(player.y-lvl.door.y)<18) {
      if (currentLevel<4) startFade(1,()=>startLevel(currentLevel+1));
    }
  }
  if (currentLevel===4) {
    const src=lvl.npcs.find(n=>n.type==='source');
    if (src&&src.done) {
      const ptx=Math.floor((player.x+player.w/2)/TILE);
      const pty=Math.floor((player.y+player.h)/TILE);
      if (pty>=0&&pty<lvl.h&&ptx>=0&&ptx<lvl.w) {
        const ct=lvl.tiles[pty][ptx];
        if ((ct===T.CHOICE_A||lvl.tiles[Math.max(0,pty-1)][ptx]===T.CHOICE_A)&&isInteract()) {
          endingType='sacrifice'; startFade(1,()=>{gameState='ending';endingTimer=0;stopAmbient();playEnding('sacrifice');});
        }
        if ((ct===T.CHOICE_B||lvl.tiles[Math.max(0,pty-1)][ptx]===T.CHOICE_B)&&isInteract()) {
          endingType='selfish'; startFade(1,()=>{gameState='ending';endingTimer=0;stopAmbient();playEnding('selfish');});
        }
      }
    }
  }
  updateCam(lvl);
}

function respawn() {
  playDeath();
  resetPlayer(checkpointX,checkpointY);
  fadeAlpha=0.6; fadeDir=-1;
  for (let i=0;i<10;i++) emit(player.x+3,player.y+4,(Math.random()-0.5)*1.5,(Math.random()-0.5)*1.5,25,1,'#88aadd','spark');
}

function startLevel(idx) {
  currentLevel=idx;
  const lvl=levels[idx];
  for (let c of lvl.crystals) c.col=false;
  for (let n of lvl.npcs) n.done=false;
  resetPlayer(lvl.sx,lvl.sy);
  checkpointX=lvl.sx; checkpointY=lvl.sy;
  cam.x=player.x-WIDTH/2; cam.y=player.y-HEIGHT/2;
  gameState='play';
  startAmbient(idx);
  fadeAlpha=1; fadeDir=-1;
  zoneTimer=0;
}

function startFade(dir,cb) { fadeDir=dir; fadeCallback=cb; if(dir===1)fadeAlpha=0; }
function updateFade() {
  if (fadeDir===1) { fadeAlpha+=0.025; if(fadeAlpha>=1){fadeAlpha=1;fadeDir=-1;if(fadeCallback){fadeCallback();fadeCallback=null;}} }
  else if (fadeDir===-1) { fadeAlpha-=0.025; if(fadeAlpha<=0){fadeAlpha=0;fadeDir=0;} }
}
function drawFade() { if(fadeAlpha>0){renderCtx.save();renderCtx.globalAlpha=fadeAlpha;renderCtx.fillStyle='#000';renderCtx.fillRect(0,0,WIDTH,HEIGHT);renderCtx.restore();} }

// --- SİS SİSTEMİ (Ana Menü) ---
const fogLayers = [
  { y: 0.55, speed: 0.18, amp: 6,  freq: 0.012, alpha: 0.13, h: 28, color: '#1a1830' },
  { y: 0.65, speed: 0.28, amp: 8,  freq: 0.018, alpha: 0.18, h: 22, color: '#1e1a3a' },
  { y: 0.72, speed: 0.12, amp: 5,  freq: 0.009, alpha: 0.12, h: 32, color: '#141228' },
  { y: 0.80, speed: 0.38, amp: 10, freq: 0.022, alpha: 0.22, h: 20, color: '#231e42' },
  { y: 0.88, speed: 0.20, amp: 7,  freq: 0.015, alpha: 0.16, h: 26, color: '#1a1830' },
];
let fogOffset = 0;

// Sis için offscreen buffer
let fogCanvas = null, fogCtx = null;

function drawFog() {
  fogOffset += 0.18;

  const PX = 4; // daha iri piksel bloklar
  const cols = Math.ceil(WIDTH / PX);
  const rows = Math.ceil(HEIGHT / PX);

  if (!fogCanvas) {
    fogCanvas = document.createElement('canvas');
    fogCanvas.width = cols;
    fogCanvas.height = rows;
    fogCtx = fogCanvas.getContext('2d');
  }

  const imgData = fogCtx.createImageData(cols, rows);
  const data = imgData.data;

  for (let row = 0; row < rows; row++) {
    for (let ny = row / rows, col = 0; col < cols; col++) {
      const nx = col / cols;

      // Yavaş kayan köşegen bantlar
      const d1 = Math.sin((nx * 1.8 - ny * 2.4 + fogOffset * 0.006) * Math.PI);
      const d2 = Math.sin((nx * 0.9 + ny * 1.6 - fogOffset * 0.004) * Math.PI * 1.5);
      const d3 = Math.sin((nx * 2.9 - ny * 1.1 + fogOffset * 0.003) * Math.PI * 0.8);

      const noise = d1 * 0.5 + d2 * 0.3 + d3 * 0.2;

      // Sadece koyu bant bölgelerinde piksel bas
      if (noise < 0.05 || noise > 0.62) continue;

      const t = (noise - 0.05) / 0.57;
      const a = t * (1 - t) * 4 * 0.28; // max ~%28 opaklık

      const idx = (row * cols + col) * 4;
      // Neredeyse siyah, çok hafif mor tint
      data[idx]     = 8;
      data[idx + 1] = 6;
      data[idx + 2] = 16;
      data[idx + 3] = Math.floor(a * 255);
    }
  }

  fogCtx.putImageData(imgData, 0, 0);
  renderCtx.save();
  renderCtx.imageSmoothingEnabled = false;
  renderCtx.drawImage(fogCanvas, 0, 0, WIDTH, HEIGHT);
  renderCtx.restore();
}

// --- FLICKER DURUMU (global, drawMenu dışında tutulur) ---
const flicker = {
  phase: 0,       // 0=normal, 1=kesinti
  timer: 0,
  nextAt: 90 + Math.floor(Math.random() * 130),
  alpha: 1,
  offsetX: 0,
  type: 'rapid',  // 'rapid' | 'blackout' | 'glitch'
  dur: 3,
  glitchLine: 0
};

function updateFlicker() {
  flicker.timer++;
  if (flicker.phase === 0) {
    // Normal: alpha'yı 1'e çek, offsetX'i sıfırla
    flicker.alpha += (1 - flicker.alpha) * 0.18;
    flicker.offsetX *= 0.75;
    if (flicker.timer >= flicker.nextAt) {
      flicker.phase = 1;
      flicker.timer = 0;
      // Kesinti türünü seç
      const r = Math.random();
      flicker.type = r < 0.35 ? 'blackout' : r < 0.65 ? 'rapid' : 'glitch';
      flicker.dur = flicker.type === 'blackout' ? 4 + Math.floor(Math.random() * 9)
                  : flicker.type === 'glitch'   ? 5 + Math.floor(Math.random() * 7)
                  :                               2 + Math.floor(Math.random() * 4);
      flicker.glitchLine = Math.floor(Math.random() * 3);
    }
  } else {
    // Kesinti aktif
    if (flicker.type === 'blackout') {
      flicker.alpha = flicker.timer % 2 === 0 ? 0.0 : 0.12;
    } else if (flicker.type === 'rapid') {
      flicker.alpha = flicker.timer % 2 === 0 ? 0.85 : 0.08;
    } else { // glitch
      flicker.alpha = 0.65 + Math.sin(flicker.timer * 2.1) * 0.35;
      flicker.offsetX = (Math.random() - 0.5) * 7;
    }
    if (flicker.timer >= flicker.dur) {
      // %40 ihtimalle ard arda ikinci kısa titreme (sadece rapid/blackout)
      if (Math.random() < 0.4 && flicker.type !== 'glitch') {
        flicker.timer = 0;
        flicker.dur = 1 + Math.floor(Math.random() * 3);
      } else {
        flicker.phase = 0;
        flicker.timer = 0;
        flicker.nextAt = 55 + Math.floor(Math.random() * 200);
        flicker.offsetX = 0;
      }
    }
  }
}

function updateMenu() {
  if (showCtrl) { if(jp['Escape']||jp['Enter']||jp['Space']) showCtrl=false; return; }
  if (showSettings) { updateSettings(); return; }
  if (jp['ArrowDown']||jp['KeyS']) menuSel=(menuSel+1)%3;
  if (jp['ArrowUp']||jp['KeyW']) menuSel=(menuSel+2)%3;
  if (jp['Enter']||jp['Space']) {
    initAudio();
    if (menuSel===0) startFade(1,()=>{gameState='intro';introStep=0;introTimer=0;});
    else if (menuSel===1) showCtrl=true;
    else showSettings=true;
  }
}

function updateSettings() {
  if (jp['Escape']) { showSettings=false; settingSel=0; return; }
  if (jp['ArrowDown']||jp['KeyS']) settingSel=(settingSel+1)%2;
  if (jp['ArrowUp']||jp['KeyW']) settingSel=(settingSel+2)%2;
  if (jp['Enter']||jp['Space']||jp['ArrowLeft']||jp['ArrowRight']||jp['KeyA']||jp['KeyD']) {
    if (settingSel===0) {
      soundEnabled=!soundEnabled;
      if (masterGain) masterGain.gain.value = soundEnabled ? 0.6 : 0;
    } else {
      lang = lang==='TR' ? 'ENG' : 'TR';
    }
  }
}

function drawMenu() {
  renderCtx.fillStyle='#030306'; renderCtx.fillRect(0,0,WIDTH,HEIGHT);
  drawFog();
  if (frameCount%4===0) emit(Math.random()*WIDTH,HEIGHT+2,(Math.random()-0.5)*0.2,-Math.random()*0.6-0.3,55,1,'#3344aa','dust');
  drawParts(0,0);
  renderCtx.save();

  // --- BAŞLIK: THE / LAST / LIGHT — elektrik kesintisi efekti ---
  updateFlicker();
  const fk = flicker;
  const titleLines = ['THE', 'LAST', 'LIGHT'];
  const lineH = 20;

  renderCtx.save();
  renderCtx.translate(WIDTH/2 + fk.offsetX, 42);
  renderCtx.rotate(-20 * Math.PI / 180);

  titleLines.forEach(function(line, i) {
    const isMiddle = i === 1;
    renderCtx.font = (isMiddle ? '15px' : '12px') + ' "Press Start 2P",monospace';

    // Glitch satırına özel kayma
    let la = fk.alpha;
    let lox = 0;
    if (fk.phase === 1 && fk.type === 'glitch' && i === fk.glitchLine) {
      la = Math.random() < 0.5 ? 1.0 : 0.15;
      lox = (Math.random() - 0.5) * 9;
    }

    const lw = renderCtx.measureText(line).width;
    const bx = -lw / 2 + lox;
    const by = i * lineH;

    // Elektrik mavi halo (normal fazda hafif, kesintide parlayan)
    if (la > 0.3) {
      renderCtx.globalAlpha = la * (fk.phase === 1 ? 0.35 : 0.12);
      renderCtx.fillStyle = '#33aaff';
      renderCtx.fillText(line, bx + 1, by + 1);
      renderCtx.fillText(line, bx - 1, by - 1);
    }

    // Glitch renk ayrışması (kırmızı + cyan katmanları)
    if (fk.phase === 1 && fk.type === 'glitch' && i === fk.glitchLine) {
      renderCtx.globalAlpha = la * 0.6;
      renderCtx.fillStyle = '#ff4422';
      renderCtx.fillText(line, bx - 2, by);
      renderCtx.globalAlpha = la * 0.5;
      renderCtx.fillStyle = '#22ffee';
      renderCtx.fillText(line, bx + 2, by);
    }

    // Ana metin
    renderCtx.globalAlpha = la;
    renderCtx.fillStyle = isMiddle ? '#cceeff' : '#7799bb';
    renderCtx.fillText(line, bx, by);

    // "LAST" satırı üzerinde ince parlama çizgisi (tam parlak anında)
    if (isMiddle && la > 0.85 && fk.phase === 0) {
      renderCtx.globalAlpha = (la - 0.85) * 1.2;
      renderCtx.fillStyle = '#aaddff';
      renderCtx.fillRect(bx, by - 13, lw, 1);
    }
  });

  renderCtx.globalAlpha = 1;
  renderCtx.restore();
  // --- BAŞLIK SONU ---

  // Alt yazı ve menü seçenekleri
  renderCtx.fillStyle='#334'; renderCtx.font='6px "Press Start 2P",monospace';
  const subW=renderCtx.measureText(tx('atmospheric')).width;
  renderCtx.fillText(tx('atmospheric'),WIDTH/2-subW/2,108);
  const items=[tx('play'),tx('controls'),tx('settings')];
  renderCtx.font='7px "Press Start 2P",monospace';
  items.forEach((it,i)=>{
    renderCtx.fillStyle=i===menuSel?'#dde':'#556';
    const tw=renderCtx.measureText('> '+it).width;
    renderCtx.fillText((i===menuSel?'> ':'  ')+it,WIDTH/2-tw/2,122+i*18);
  });
  renderCtx.restore();
  if (showCtrl) drawCtrlScreen();
  if (showSettings) drawSettingsScreen();
}

function drawSettingsScreen() {
  renderCtx.fillStyle='rgba(0,0,0,0.92)'; renderCtx.fillRect(18,18,WIDTH-36,HEIGHT-36);
  renderCtx.strokeStyle='#334'; renderCtx.strokeRect(18,18,WIDTH-36,HEIGHT-36);
  renderCtx.fillStyle='#99aabb'; renderCtx.font='7px "Press Start 2P",monospace';
  const titleW=renderCtx.measureText(tx('settingsTitle')).width;
  renderCtx.fillText(tx('settingsTitle'),WIDTH/2-titleW/2,36);
  renderCtx.font='6px "Press Start 2P",monospace';

  // Satır 1: Ana Ses
  const row0sel = settingSel===0;
  renderCtx.fillStyle=row0sel?'#dde':'#778';
  renderCtx.fillText((row0sel?'> ':' ')+tx('masterVol'),30,62);
  const bx=WIDTH-62, by=54, bw=40, bh=12;
  renderCtx.fillStyle=soundEnabled?'#2255aa':'#222';
  renderCtx.fillRect(bx,by,bw,bh);
  renderCtx.strokeStyle='#556'; renderCtx.strokeRect(bx,by,bw,bh);
  const kx=soundEnabled?bx+bw-10:bx+2;
  renderCtx.fillStyle=soundEnabled?'#aaddff':'#556';
  renderCtx.fillRect(kx,by+2,8,8);
  renderCtx.fillStyle=soundEnabled?'#aaddff':'#778';
  renderCtx.font='5px "Press Start 2P",monospace';
  renderCtx.fillText(soundEnabled?tx('on'):tx('off'),bx+2,by+10);

  // Satır 2: Dil
  renderCtx.font='6px "Press Start 2P",monospace';
  const row1sel = settingSel===1;
  renderCtx.fillStyle=row1sel?'#dde':'#778';
  renderCtx.fillText((row1sel?'> ':' ')+tx('langLabel'),30,82);
  const lbx=WIDTH-62, lby=74, lbw=40, lbh=12;
  renderCtx.fillStyle='#2255aa'; renderCtx.fillRect(lbx,lby,lbw,lbh);
  renderCtx.strokeStyle='#556'; renderCtx.strokeRect(lbx,lby,lbw,lbh);
  renderCtx.fillStyle='#aaddff'; renderCtx.font='5px "Press Start 2P",monospace';
  renderCtx.fillText(lang,lbx+4,lby+10);

  renderCtx.fillStyle='#445'; renderCtx.font='5px "Press Start 2P",monospace';
  renderCtx.fillText(tx('change'),30,108);
  renderCtx.fillText(tx('back'),30,120);
}

function drawCtrlScreen() {
  renderCtx.fillStyle='rgba(0,0,0,0.92)'; renderCtx.fillRect(18,18,WIDTH-36,HEIGHT-36);
  renderCtx.strokeStyle='#334'; renderCtx.strokeRect(18,18,WIDTH-36,HEIGHT-36);
  renderCtx.fillStyle='#99aabb'; renderCtx.font='7px "Press Start 2P",monospace';
  const ctW=renderCtx.measureText(tx('controlsTitle')).width;
  renderCtx.fillText(tx('controlsTitle'),WIDTH/2-ctW/2,36);
  renderCtx.font='6px "Press Start 2P",monospace'; renderCtx.fillStyle='#778';
  const c=[tx('move'),tx('jump'),tx('interact'),tx('pauseKey'),'',tx('goBack')];
  c.forEach((l,i)=>renderCtx.fillText(l,30,54+i*13));
}

function updateIntro() {
  introTimer++;
  if (introTimer>300||jp['Space']||jp['Enter']) {
    introStep++; introTimer=0;
    if (introStep>=tx('introTxts').length) startFade(1,()=>startLevel(0));
  }
}
function drawIntro() {
  renderCtx.fillStyle='#020204'; renderCtx.fillRect(0,0,WIDTH,HEIGHT);
  const introTxts=tx('introTxts');
  if (introStep<introTxts.length&&introTxts[introStep]) {
    const a=Math.min(1,introTimer/35);
    renderCtx.save(); renderCtx.globalAlpha=a;
    renderCtx.fillStyle='#8899bb'; renderCtx.font='7px "Press Start 2P",monospace';
    const txt=introTxts[introStep];
    const tw=renderCtx.measureText(txt).width;
    renderCtx.fillText(txt,(WIDTH-tw)/2,HEIGHT/2);
    renderCtx.restore();
  }
}

function updatePause() {
  if (jp['ArrowDown']||jp['KeyS']) pauseSel=(pauseSel+1)%2;
  if (jp['ArrowUp']||jp['KeyW']) pauseSel=(pauseSel+1)%2;
  if (jp['Enter']||jp['Space']) { if(pauseSel===0)gameState='play'; else{gameState='menu';stopAmbient();} }
  if (jp['Escape']) gameState='play';
}
function drawPause() {
  renderCtx.fillStyle='rgba(0,0,0,0.82)'; renderCtx.fillRect(0,0,WIDTH,HEIGHT);
  renderCtx.fillStyle='#ccd'; renderCtx.font='7px "Press Start 2P",monospace';
  renderCtx.fillText(tx('pause'),WIDTH/2-34,55);
  [tx('resume'),tx('mainMenu')].forEach((it,i)=>{
    renderCtx.fillStyle=i===pauseSel?'#fff':'#556';
    renderCtx.fillText((i===pauseSel?'> ':'  ')+it,WIDTH/2-40,80+i*16);
  });
}

function updateEnding() { endingTimer++; }
function drawEnding() {
  renderCtx.fillStyle=endingType==='sacrifice'?'#030508':'#050303';
  renderCtx.fillRect(0,0,WIDTH,HEIGHT);
  const texts=endingType==='sacrifice'?tx('endSacrifice'):tx('endSelfish');
  const speed=600;
  const grp=Math.floor(endingTimer/speed);
  const alpha=Math.min(1,(endingTimer%speed)/30);
  renderCtx.save(); renderCtx.font='7px "Press Start 2P",monospace';
  for (let i=0;i<3;i++) {
    const li=grp*3+i; if(li>=texts.length) break;
    renderCtx.fillStyle=endingType==='sacrifice'?'#99ccee':'#ddaa77';
    renderCtx.globalAlpha=alpha;
    const tw=renderCtx.measureText(texts[li]).width;
    renderCtx.fillText(texts[li],(WIDTH-tw)/2,55+i*22);
  }
  renderCtx.restore();
  if (endingType==='sacrifice') {
    if(frameCount%3===0) emit(Math.random()*WIDTH,HEIGHT+3,(Math.random()-0.5)*0.4,-Math.random()*1.2-0.4,70,1,'#88ccff','dust');
  } else {
    if(frameCount%8===0) emit(Math.random()*WIDTH,Math.random()*HEIGHT,(Math.random()-0.5)*0.15,(Math.random()-0.5)*0.15,50,1,'#443322','dust');
  }
  drawParts(0,0);
  if (endingTimer>speed*Math.ceil(texts.length/3)+150) {
    renderCtx.globalAlpha=0.7+Math.sin(frameCount*0.05)*0.3;
    renderCtx.fillStyle='#778'; renderCtx.font='6px "Press Start 2P",monospace';
    renderCtx.fillText(tx('returnMenu'),WIDTH/2-62,HEIGHT-14);
    renderCtx.globalAlpha=1;
    if (jp['Enter']||jp['Space']) {
      gameState='menu'; endingTimer=0; fragments=0;
      for (let l of levels) { for(let c of l.crystals) c.col=false; for(let n of l.npcs) n.done=false; }
    }
  }
}

function loop(time) {
  requestAnimationFrame(loop);
  const dt=time-lastTime; lastTime=time;
  if (dt>100) { clearJP(); }
  frameCount++;

  renderCtx.fillStyle=levels[currentLevel]?levels[currentLevel].bg:'#020204';
  renderCtx.fillRect(0,0,WIDTH,HEIGHT);

  updateFade();
  updateParts();

  switch(gameState) {
    case 'loading':
    case 'menu': updateMenu(); drawMenu(); break;
    case 'intro': updateIntro(); drawIntro(); break;
    case 'play':
      updatePlay();
      drawParallax(levels[currentLevel]);
      drawDeco(levels[currentLevel]);
      drawTiles(levels[currentLevel]);
      drawCrystals(levels[currentLevel]);
      drawNPCs(levels[currentLevel]);
      drawDoor(levels[currentLevel]);
      drawPlayer();
      drawParts(cam.x,cam.y);
      drawLighting();
      drawHUD();
      if(currentLevel===4) drawChoices();
      break;
    case 'dialogue':
      drawParallax(levels[currentLevel]);
      drawDeco(levels[currentLevel]);
      drawTiles(levels[currentLevel]);
      drawCrystals(levels[currentLevel]);
      drawNPCs(levels[currentLevel]);
      drawDoor(levels[currentLevel]);
      drawPlayer();
      drawParts(cam.x,cam.y);
      drawLighting();
      drawHUD();
      if(currentLevel===4) drawChoices();
      updateDlg();
      drawDlg();
      break;
    case 'pause':
      drawParallax(levels[currentLevel]);
      drawTiles(levels[currentLevel]);
      drawPlayer();
      drawLighting();
      updatePause(); drawPause();
      break;
    case 'ending': updateEnding(); drawEnding(); break;
  }

  drawFade();
  clearJP();
  ctx.drawImage(renderCanvas,0,0);
}

function resize() {
  const ratio=WIDTH/HEIGHT;
  let w=window.innerWidth, h=window.innerHeight;
  if (w/h>ratio) w=h*ratio; else h=w/ratio;
  canvas.style.width=Math.floor(w)+'px';
  canvas.style.height=Math.floor(h)+'px';
}

function init() {
  if (window.gameInitialized) return;
  window.gameInitialized = true;
  canvas=document.getElementById('game');
  canvas.width=WIDTH; canvas.height=HEIGHT;
  ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  renderCanvas=document.createElement('canvas');
  renderCanvas.width=WIDTH; renderCanvas.height=HEIGHT;
  renderCtx=renderCanvas.getContext('2d');
  renderCtx.imageSmoothingEnabled=false;
  lightCanvas=document.createElement('canvas');
  lightCanvas.width=WIDTH; lightCanvas.height=HEIGHT;
  lightCtx=lightCanvas.getContext('2d');
  window.addEventListener('resize',resize);
  resize();
  clearJP();
  for (let k in keys) delete keys[k];
  gameState = 'menu';
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function startWhenReady() {
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function() { setTimeout(init, 100); }).catch(function() { setTimeout(init, 100); });
  } else {
    setTimeout(init, 500);
  }
}

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  startWhenReady();
} else {
  document.addEventListener('DOMContentLoaded', startWhenReady);
}
setTimeout(function() { if (!window.gameInitialized) init(); }, 3000);

})();
</script>
</body>
</html>
