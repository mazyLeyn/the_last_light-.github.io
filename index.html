let actx = null, masterGain = null, audioReady = false;
let ambOsc = null, windSrc = null, ambGain2 = null, windGain2 = null;

function initAudio() {
  if (audioReady) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain();
    masterGain.gain.value = soundEnabled ? 0.6 : 0;
    masterGain.connect(actx.destination);
    audioReady = true;
    if (actx.state === 'suspended') actx.resume().catch(()=>{});
  } catch(e) {}
}

function playTone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol || 0.1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur);
}

function playCrystal() {
  playTone(880, 0.4, 'sine', 0.12);
  playTone(1320, 0.5, 'sine', 0.08, 0.08);
  playTone(1760, 0.4, 'sine', 0.06, 0.16);
}

function playStep() {
  if (!actx) return;
  const sr = actx.sampleRate;
  const len = Math.floor(sr * 0.055);
  const buf = actx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const env = Math.pow(1 - i / len, 2.5);
    d[i] = (Math.random() * 2 - 1) * env * 0.18;
  }
  const flt = actx.createBiquadFilter();
  flt.type = 'lowpass';
  flt.frequency.value = 900 + Math.random() * 400;
  flt.Q.value = 0.6;
  const o = actx.createOscillator();
  const og = actx.createGain();
  o.type = 'sine';
  o.frequency.value = 120 + Math.random() * 40;
  og.gain.setValueAtTime(0.04, actx.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.04);
  o.connect(og); og.connect(masterGain);
  o.start(); o.stop(actx.currentTime + 0.04);
  const src = actx.createBufferSource();
  const ng = actx.createGain();
  ng.gain.value = 0.55;
  src.buffer = buf;
  src.connect(flt); flt.connect(ng); ng.connect(masterGain);
  src.start();
}

function playTick() {
  if (!actx) return;
  const sr = actx.sampleRate;
  const t = actx.currentTime;
  const len = Math.floor(sr * 0.025);
  const buf = actx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3) * 1.0;
  }
  const src = actx.createBufferSource();
  const flt = actx.createBiquadFilter();
  flt.type = 'bandpass';
  flt.frequency.value = 800 + Math.random() * 300;
  flt.Q.value = 2.5;
  const g = actx.createGain();
  g.gain.value = 0.45;
  src.buffer = buf;
  src.connect(flt); flt.connect(g); g.connect(masterGain);
  src.start(t);
  const o = actx.createOscillator();
  const og = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(180 + Math.random() * 40, t);
  o.frequency.exponentialRampToValueAtTime(90, t + 0.03);
  og.gain.setValueAtTime(0.12, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  o.connect(og); og.connect(masterGain);
  o.start(t); o.stop(t + 0.04);
}

function playJump() {
  if (!actx) return;
  const t = actx.currentTime;
  const o1 = actx.createOscillator();
  const g1 = actx.createGain();
  o1.type = 'sine';
  o1.frequency.setValueAtTime(180, t);
  o1.frequency.exponentialRampToValueAtTime(420, t + 0.14);
  g1.gain.setValueAtTime(0.09, t);
  g1.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o1.connect(g1); g1.connect(masterGain);
  o1.start(t); o1.stop(t + 0.18);
  const o2 = actx.createOscillator();
  const g2 = actx.createGain();
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(360, t + 0.02);
  o2.frequency.exponentialRampToValueAtTime(700, t + 0.13);
  g2.gain.setValueAtTime(0.04, t + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  o2.connect(g2); g2.connect(masterGain);
  o2.start(t + 0.02); o2.stop(t + 0.16);
}

function playDeath() { playTone(150, 0.3, 'sawtooth', 0.06); playTone(100, 0.4, 'sine', 0.04, 0.1); }

function startAmbient(lvl) {
  if (!actx) return;
  stopAmbient();
  const scales = [
    [220, 261, 294, 330, 392],
    [196, 220, 261, 294, 349],
    [174, 196, 220, 261, 294],
    [164, 196, 220, 246, 294],
    [220, 246, 294, 330, 370],
  ];
  const scale = scales[Math.min(lvl, scales.length - 1)];
  windGain2 = actx.createGain();
  windGain2.gain.value = 0;
  windGain2.connect(masterGain);
  // Derin uğultu
  ambOsc = actx.createOscillator(); ambOsc.type='sine'; ambOsc.frequency.value=scale[0]/4;
  const dg = actx.createGain(); dg.gain.value=0.05; ambOsc.connect(dg); dg.connect(masterGain); ambOsc.start();
  let melodyActive = true;
  function schedMelody(startTime) {
    if (!melodyActive) return;
    const gap = 2.2 + Math.random() * 3.5;
    const note = scale[Math.floor(Math.random() * scale.length)];
    const harmNote = scale[Math.floor(Math.random() * scale.length)];
    const t = startTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine';
    o.frequency.value = note;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.028, t + 0.18);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 1.4);
    const o2 = actx.createOscillator();
    const g2 = actx.createGain();
    o2.type = 'triangle';
    o2.frequency.value = harmNote * 1.5;
    g2.gain.setValueAtTime(0, t + 0.05);
    g2.gain.linearRampToValueAtTime(0.010, t + 0.25);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
    o2.connect(g2); g2.connect(masterGain);
    o2.start(t + 0.05); o2.stop(t + 1.2);
    const tid = setTimeout(() => { if (melodyActive) schedMelody(actx.currentTime); }, gap * 1000);
    windGain2._tid = tid;
  }
  schedMelody(actx.currentTime + 0.5);
  windGain2._stop = () => { melodyActive = false; if (windGain2._tid) clearTimeout(windGain2._tid); };
}

function stopAmbient() {
  try { if (ambOsc) ambOsc.stop(); } catch(e){}
  try { if (windSrc) windSrc.stop(); } catch(e){}
  try { if (windGain2 && windGain2._stop) windGain2._stop(); } catch(e){}
  ambOsc = null; windSrc = null; windGain2 = null;
}

function playEnding(type) {
  if (!actx) return;
  const notes = type === 'sacrifice'
    ? [262,294,330,349,392,440,494,523,587]
    : [220,196,185,165,147,131,123,110,98];
  notes.forEach((n,i) => {
    playTone(n, 1.0, 'sine', 0.10, i*0.5);
    playTone(n*1.5, 0.7, 'triangle', 0.05, i*0.5+0.15);
  });
}

const parts = [];
for (let i = 0; i < PARTICLE_POOL; i++) parts.push({a:false,x:0,y:0,vx:0,vy:0,l:0,ml:0,s:1,c:'#fff',t:'n'});

function emit(x,y,vx,vy,life,size,color,type) {
  for (let p of parts) {
    if (!p.a) { p.a=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.l=life;p.ml=life;p.s=size;p.c=color;p.t=type||'n'; return; }
  }
}

function updateParts() {
  for (let p of parts) {
    if (!p.a) continue;
    p.x+=p.vx; p.y+=p.vy; p.l--;
    if (p.t==='dust') p.vy-=0.008;
    if (p.t==='spark') { p.vy+=0.015; p.vx*=0.97; }
    if (p.l<=0) p.a=false;
  }
}

function drawParts(cx,cy) {
  renderCtx.save();
  renderCtx.globalCompositeOperation = 'lighter';
  for (let p of parts) {
    if (!p.a) continue;
    const sx=p.x-cx, sy=p.y-cy;
    if (sx<-10||sx>WIDTH+10||sy<-10||sy>HEIGHT+10) continue;
    renderCtx.globalAlpha = p.l/p.ml;
    renderCtx.fillStyle = p.c;
    renderCtx.fillRect(Math.floor(sx), Math.floor(sy), p.s, p.s);
  }
  renderCtx.restore();
}

const SAVE_KEY='tll_save', SAVE_V=1;
let S = newSave();
function newSave() { return {v:SAVE_V,level:0,cx:null,cy:null,cr:[],ab:[],met:[],boss:false}; }
function writeSave() {
  try {
    const old=localStorage.getItem(SAVE_KEY);
    if (old) localStorage.setItem(SAVE_KEY+'_bak',old);
    localStorage.setItem(SAVE_KEY,JSON.stringify(S));
  } catch(e) {}
}
function readSave() {
  for (const k of [SAVE_KEY,SAVE_KEY+'_bak']) {
    try {
      const d=JSON.parse(localStorage.getItem(k));
      if (d&&d.v===SAVE_V&&levels[d.level]&&[d.cr,d.ab,d.met].every(Array.isArray)) return d;
    } catch(e) {}
  }
  return null;
}

let trauma=0, hitStop=0;
function impact(tr,stop) { trauma=Math.min(1,trauma+tr); hitStop=Math.max(hitStop,stop||0); }

const cam = {x:0,y:0,look:0,ly:0,lt:0};
function updateCam(lvl,snap) {
  cam.look += (player.face*18-cam.look)*0.035;
  const gx = player.x - WIDTH/2 + player.w/2 + cam.look;
  // W / Yukarı ok basılı tutulunca kamera yukarı bakar
  cam.lt = (upHeld()&&player.grounded&&gameState==='play')?cam.lt+1:0;
  cam.ly += ((cam.lt>10?-40:0)-cam.ly)*0.1;
  const gy = player.y - HEIGHT/2 - 8 + cam.ly;
  const dy = gy-cam.y;
  cam.x += (gx-cam.x)*(snap?1:0.09);
  if (snap) cam.y=gy; else if (Math.abs(dy)>10) cam.y += (dy-Math.sign(dy)*10)*0.1;
  cam.x = Math.max(0, Math.min(cam.x, lvl.w*TILE-WIDTH));
  cam.y = Math.max(0, Math.min(cam.y, lvl.h*TILE-HEIGHT));
}

function spawnEnemies(lvl) {

  });
  boss=null;
  if (lvl.arena) { setGate(lvl,lvl.arena.l,false); setGate(lvl,lvl.arena.r,!S.boss); }
}
function setGate(lvl,c,on) {
  if (on) lvl['gt'+c]=frameCount;
  else if (lvl.tiles[10][c]===T.GATE) for (let i=0;i<50;i++) emit(c*TILE+Math.random()*8,24+Math.random()*136,(Math.random()-0.5)*0.8,Math.random()*0.4,60,1,i%2?'#7c7ae0':'#cfd0ff','dust');
  for (let r=3;r<20;r++) lvl.tiles[r][c]=on?T.GATE:T.AIR; }
const ov=(a,x,y,w,h)=>a.x<x+w&&a.x+a.w>x&&a.y<y+h&&a.y+a.h>y;

function hurtPlayer(fromX) {
  if (player.inv>0||player.dash>0) return;
  player.hp--; player.inv=75; player.lock=12;
  player.vx=player.x<fromX?-2:2; player.vy=-2; player.cut=true;
  impact(0.6,6); playTone(110,0.25,'sawtooth',0.08);
  for (let i=0;i<14;i++) emit(player.x+2,player.y+3,(Math.random()-0.5)*2.4,(Math.random()-0.5)*2.4,30,1,'#ffcc88','spark');
  if (player.hp<=0) respawn();
}
function pitFall() {
  player.hp--; impact(0.5,0); playDeath();
  if (player.hp<=0) { respawn(); return; }
  resetPlayer(player.safeX,player.safeY); player.inv=75;
  fadeAlpha=0.8; fadeDir=-1;
}
function dropMotes(x,y,n) { for (let i=0;i<n;i++) motes.push({x,y,vx:(Math.random()-0.5)*2,vy:-1-Math.random(),l:480}); }

function strike() {
  const r = player.atkDown ? [player.x-5,player.y+player.h-2,15,15]
    : player.atkUp ? [player.x-5,player.y-15,15,16]
    : [player.face>0?player.x+3:player.x-16,player.y-5,18,16];
  const targets = boss&&boss.st!=='die' ? enemies.concat(boss) : enemies;
  for (const e of targets) {
    if (player.hit.includes(e)||!ov(e,...r)) continue;
    player.hit.push(e); e.hp--; e.hurt=10;
    impact(0.22,3); playTone(520,0.12,'triangle',0.1); playTone(180,0.1,'square',0.04);
    for (let i=0;i<8;i++) emit(e.x+e.w/2,e.y+e.h/2,(Math.random()-0.5)*2.5,(Math.random()-0.5)*2.5,22,1,'#bbddff','spark');
    if (player.atkDown) { player.vy=-3.3; player.cut=true; player.airDash=true; }
    else if (player.atkUp) { e.vx=player.face*0.8; }
    else { player.vx-=player.face*1.4; if (e!==boss) e.vx=player.face*1.6; }
    if (e===boss) {
      if (e.hp%2===0) dropMotes(e.x+7,e.y+8,1);
      if (e.hp<=0) { e.st='die'; e.tm=0; shots=[]; impact(1,9); }
    } else if (e.hp<=0) {
      impact(0.2,4); dropMotes(e.x+e.w/2,e.y,e.t==='lurker'?2:1);
      for (let i=0;i<18;i++) emit(e.x+e.w/2,e.y+e.h/2,(Math.random()-0.5)*2,(Math.random()-0.5)*2,45,1,'#5a4a88','dust');
    }
  }
  enemies=enemies.filter(e=>e.hp>0);
}

function updateEnemies(lvl) {
  const t=lvl.tiles;
  for (const e of enemies) {
    e.tm++; if (e.hurt>0) e.hurt--;
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy);
    if (e.t==='crawler') {
      if (e.hurt<=0) e.vx=0.35*e.face;
      const ahead=e.vx>0?e.x+e.w+1:e.x-1;
      if (isSolid(t,ahead,e.y+3)||!isSolid(t,ahead,e.y+e.h+2)||ahead<0) { if (e.hurt<=0) e.face*=-1; }
      else e.x+=e.vx;
    } else if (e.t==='moth') {           // ışığa çekilir
      const on=d<90, gx=on?dx:e.hx-e.x, gy=on?dy-4:e.hy-e.y, gd=Math.hypot(gx,gy)||1;
      const k=on?0.032:0.015;
      e.vx=(e.vx+gx/gd*k)*0.97; e.vy=(e.vy+gy/gd*k+Math.sin(e.tm*0.12)*0.02)*0.97;
      e.x+=e.vx; e.y+=e.vy; e.face=e.vx<0?-1:1;
    } else {                              // pusu: 0 gizli, 1 uyanış, 2 atılış, 3 dinlenme
      if (e.st===0&&d<52&&Math.abs(dy)<26) { e.st=1; e.tm=0; e.face=dx<0?-1:1; playTone(90,0.4,'sine',0.08); }
      else if (e.st===1&&e.tm>34) { e.st=2; e.tm=0; e.vx=e.face*2; }
      else if (e.st===2) {
        if (e.hurt<=0) e.vx=e.face*2*Math.max(0,1-e.tm/34);
        const ahead=e.vx>0?e.x+e.w+1:e.x-1;
        if (!isSolid(t,ahead,e.y+4)&&isSolid(t,ahead,e.y+e.h+2)) e.x+=e.vx;
        if (e.tm>32) { e.st=3; e.tm=0; }
      } else if (e.st===3&&e.tm>60) { e.st=0; e.tm=0; }
    }
    if (!(e.t==='lurker'&&e.st===0)&&e.hurt<=0&&ov(player,e.x+1,e.y+1,e.w-2,e.h-2)) hurtPlayer(e.x+e.w/2);
  }
  for (const s of shots) {
    s.x+=s.vx; s.y+=s.vy; s.l--;
    if (frameCount%3===0) emit(s.x+3,s.y+3,0,-0.2,18,1,'#8855cc','dust');
    if (ov(player,s.x,s.y,s.w,s.h)) hurtPlayer(s.x+3);
  }
  shots=shots.filter(s=>s.l>0);
  for (const m of motes) {
    const dx=player.x+2-m.x, dy=player.y+3-m.y, d=Math.hypot(dx,dy)||1;
    if (d<60) { m.vx+=dx/d*0.2; m.vy+=dy/d*0.2; } else m.vy+=0.03;
    m.vx*=0.93; m.vy*=0.93; m.x+=m.vx; m.y+=m.vy; m.l--;
    if (d<8) {
      m.l=0; player.motes++; playTone(990,0.15,'sine',0.06);
      if (player.motes>=3) { player.motes=0; if (player.hp<MAX_HP) { player.hp++; playCrystal(); } }
    }
  }
  motes=motes.filter(m=>m.l>0);
}

function updateBoss(lvl) {
  if (!lvl.arena||S.boss) return;
  const L=(lvl.arena.l+1)*TILE, R=lvl.arena.r*TILE, FY=20*TILE-26;
  if (!boss) {
    if (player.x>L+28) {
      setGate(lvl,lvl.arena.l,true);
      boss={x:R-70,y:FY,w:14,h:26,hp:BOSS_HP,vx:0,vy:0,st:'idle',tm:0,hurt:0,face:-1,last:''};
      impact(0.7,0); playTone(55,1.4,'sawtooth',0.08);
      if (!bossIntro) { bossIntro=true; startDlg(tx('bossLines')); }
    }
    return;
  }
  const b=boss, rage=b.hp<=4; b.tm++; if (b.hurt>0) b.hurt--;
  const dx=player.x-b.x-5;
  if (b.st==='die') {
    emit(b.x+Math.random()*14,b.y+Math.random()*26,(Math.random()-0.5),-Math.random(),50,1,'#ffddaa','spark');
    if (b.tm>110) {
      S.boss=true; boss=null; setGate(lvl,lvl.arena.l,false); setGate(lvl,lvl.arena.r,false);
      writeSave(); playEnding('sacrifice'); startDlg(tx('bossEndLines'));
    }
    return;
  }
  if (b.st==='idle') {
    b.face=dx<0?-1:1; b.x+=b.face*0.25;
    if (b.y<FY) b.y=Math.min(FY,b.y+2);
    if (b.tm>(rage?58:80)) {
      const o=['charge','rise','cast'].filter(s=>s!==b.last);
      b.next=b.last=o[Math.random()*o.length|0]; b.st='tele'; b.tm=0;
      playTone(b.next==='rise'?140:b.next==='cast'?220:80,0.5,'triangle',0.09);
    }
  } else if (b.st==='tele') {
    if (b.tm>(rage?36:46)) { b.st=b.next; b.tm=0; b.face=dx<0?-1:1; }
  } else if (b.st==='charge') {
    b.x+=b.face*(rage?2.5:2.1);
    emit(b.x+7,b.y+20,-b.face,0,25,2,'#5533aa','dust');
    if (b.x<=L||b.x>=R-b.w) { impact(0.4,0); b.st='idle'; b.tm=-30; }
  } else if (b.st==='rise') {
    b.y+=(60-b.y)*0.1; if (b.tm<28) b.x+=Math.max(-1.6,Math.min(1.6,dx*0.1)); // sonra kilitlenir: kaçma payı
    if (b.tm>44) { b.st='slam'; b.tm=0; }
  } else if (b.st==='slam') {
    if (b.tm>8) b.y+=4.5;
    if (b.y>=FY) {
      b.y=FY; impact(0.6,0); playTone(60,0.4,'sawtooth',0.1);
      for (const s of [-1,1]) shots.push({x:b.x+4,y:20*TILE-8,vx:s*(rage?1.5:1.2),vy:0,w:6,h:8,l:110});
      b.st='idle'; b.tm=-35;
    }
  } else if (b.st==='cast') {
    if (b.tm%20===0) {
      const ox=b.x+4, oy=b.y+6, a=Math.atan2(player.y-oy,player.x-ox);
      shots.push({x:ox,y:oy,vx:Math.cos(a)*1.1,vy:Math.sin(a)*1.1,w:6,h:6,l:150});
      playTone(330,0.2,'triangle',0.06);
    }
    if (b.tm>=(rage?64:44)) { b.st='idle'; b.tm=0; }
  }
  b.x=Math.max(L,Math.min(R-b.w,b.x));
  // Yalnızca saldırırken temas hasarı verir
  if ((b.st==='charge'||b.st==='slam')&&ov(player,b.x+2,b.y+3,b.w-4,b.h-3)) hurtPlayer(b.x+7);
}

let dlgActive=false, dlgCB=null, dlgPages=[], dlgPage=0, dlgChar=0, dlgWait=0, dlgTimer=0, dlgOpen=0, dlgClosing=false;

// Konuşmacı renkleri ve "ses"leri: her karakter farklı tonda konuşur
const SPK={
  'fenerci':['#ffc98a',196,'triangle'],'lamplighter':['#ffc98a',196,'triangle'],
  'yankı':['#9ec9e6',330,'sine'],'echo':['#9ec9e6',330,'sine'],
  'şarkıcı':['#d9a8ea',440,'triangle'],'singer':['#d9a8ea',440,'triangle'],
  'sönmüş olan':['#b79cff',110,'sawtooth'],'the extinguished':['#b79cff',110,'sawtooth'],
  'içimde bir ses':['#ffe2a8',262,'sine'],'a voice within':['#ffe2a8',262,'sine'],
  'eski ağaç':['#8fd9a0',170,'triangle'],'old tree':['#8fd9a0',170,'triangle'],
  'kaynak':['#9fbfff',523,'sine'],'the source':['#9fbfff',523,'sine'],
  'kıvılcım':['#ffd9a0',392,'sine'],'spark':['#ffd9a0',392,'sine'],
  'seçimini yap':['#ffe2a8',262,'sine'],'make your choice':['#ffe2a8',262,'sine']
};
function wrapLines(c,text,mw) {
  const words=text.split(' '), out=[]; let line='';
  for (const w of words) {
    const test=line?line+' '+w:w;
    if (c.measureText(test).width>mw&&line) { out.push(line); line=w; } else line=test;
  }
  if (line) out.push(line);
  return out;
}
function startDlg(lines,cb,defWho) {
  const R=renderCtx; R.save(); R.font='7px "Press Start 2P",monospace';
  dlgPages=[];
  let cur=defWho||'';
  for (const raw of lines) {
    let who=cur, body=raw;
    const m=/^([A-Za-zÇĞİÖŞÜçğıöşüÂâÎîÛû' ]{2,18}?(?: \d+)?): (.+)$/.exec(raw);
    if (m) { who=m[1]; body=m[2]; cur=who; }
    const mem=/^(Fragman|Fragment) \d+$/.test(who);
    const wl=wrapLines(R,body,WIDTH-34);
    for (let i=0;i<wl.length;i+=3) { const ls=wl.slice(i,i+3); dlgPages.push({who,mem,lines:ls,flat:ls.join('')}); }
  }
  R.restore();
  dlgActive=true; dlgClosing=false; dlgOpen=0; dlgPage=0; dlgChar=0; dlgWait=10; dlgTimer=0; dlgCB=cb||null;
  gameState='dialogue';
}
function speakTick(pg) {
  const k=SPK[pg.who.toLowerCase()];
  if (k) playTone(k[1]*(0.95+Math.random()*0.12),0.035,k[2],0.03);
  else if (pg.mem) playTone(880+Math.random()*60,0.04,'sine',0.018);
  else playTick();
}
function updateDlg() {
  if (!dlgActive) return;
  if (dlgClosing) {
    dlgOpen-=0.14;
    if (dlgOpen<=0) { dlgOpen=0; dlgActive=false; dlgClosing=false; gameState='play'; const cb=dlgCB; dlgCB=null; if (cb) cb(); }
    return;
  }
  if (dlgOpen<1) dlgOpen=Math.min(1,dlgOpen+0.14);
  dlgTimer++;
  const pg=dlgPages[dlgPage], typing=dlgChar<pg.flat.length;
  const confirm=jp['Space']||jp['KeyE']||jp['Enter'];
  if (dlgOpen>=1&&typing) {
    if (dlgWait>0) dlgWait--;
    else {
      dlgChar++;
      const ch=pg.flat[dlgChar-1], nx=pg.flat[dlgChar]||'';
      // Okuma ritmi: virgülde kısa, noktada uzun, "..." üç noktada duraklar
      let w=2;
      if (ch===','||ch===';'||ch===':') w=8;
      else if (ch==='—'||ch==='–') w=7;
      else if (ch==='.'||ch==='!'||ch==='?'||ch==='…') w=(nx==='.'||nx==='!'||nx==='?')?5:(nx===''?2:17);
      dlgWait=w;
      if (ch!==' '&&dlgChar%2===0) speakTick(pg);
    }
  }
  if (confirm&&dlgOpen>=1) {
    if (typing) { dlgChar=pg.flat.length; dlgWait=0; }
    else {
      dlgPage++; dlgChar=0; dlgWait=9;
      if (dlgPage>=dlgPages.length) { dlgPage=dlgPages.length-1; dlgChar=pg.flat.length; dlgClosing=true; }
      else playTone(520,0.05,'sine',0.02);
    }
  }
}
function drawDlg() {
  if (!dlgActive) return;
  const R=renderCtx, pg=dlgPages[dlgPage], e=1-Math.pow(1-dlgOpen,3);
  const k=SPK[pg.who.toLowerCase()];
  const col=pg.mem?'#7fdcff':(k?k[0]:'#aab4cc');
  const ac=ZONE_TILES[levels[currentLevel].zone][3];
  R.save();
  // Alt kenar kararması: sahne geri çekilir, metin öne çıkar
  const g=R.createLinearGradient(0,HEIGHT-96,0,HEIGHT);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,6,${0.62*e})`);
  R.fillStyle=g; R.fillRect(0,HEIGHT-96,WIDTH,96);
  const bx=8, bw=WIDTH-16, bh=44, by=Math.round(HEIGHT-bh-6+(1-e)*(bh+14));
  R.globalAlpha=Math.min(1,e*1.4);
  const panel=(x,y,w,h,edge)=>{
    R.fillStyle='#07070f'; R.fillRect(x+1,y,w-2,h); R.fillRect(x,y+1,w,h-2);
    R.fillStyle=edge; R.fillRect(x+1,y,w-2,1); R.fillRect(x+1,y+h-1,w-2,1); R.fillRect(x,y+1,1,h-2); R.fillRect(x+w-1,y+1,1,h-2);
  };
  panel(bx,by,bw,bh,pg.mem?'#3d7a96':ac);
  R.fillStyle='rgba(255,255,255,0.05)'; R.fillRect(bx+2,by+1,bw-4,1);
  R.fillStyle=pg.mem?'rgba(127,220,255,0.10)':'rgba(255,255,255,0.03)'; R.fillRect(bx+2,by+2,bw-4,bh-4);
  R.font='7px "Press Start 2P",monospace';
  // İsim levhası
  if (pg.who) {
    const nw=Math.ceil(R.measureText(pg.who).width)+10;
    panel(bx+8,by-8,nw,11,col);
    R.fillStyle=col; R.fillRect(bx+11,by-5,2,5);
    R.fillStyle=col; R.fillText(pg.who,bx+15,by+1);
  }
  // Metin: harf harf belirir, son harf parlar
  let rem=dlgChar;
  const tcol=pg.mem?'#cdf1ff':'#dde2ee';
  for (let i=0;i<pg.lines.length;i++) {
    const L=pg.lines[i], n=Math.min(rem,L.length); rem-=n;
    if (n<=0) break;
    const y=by+17+i*10, last=(rem<=0&&dlgChar<pg.flat.length);
    const head=last?L.substring(0,n-1):L.substring(0,n);
    R.fillStyle='rgba(0,0,0,0.9)'; R.fillText(L.substring(0,n),bx+9,y+1);
    R.fillStyle=tcol; R.fillText(head,bx+9,y);
    if (last) { R.fillStyle='#ffffff'; R.fillText(L[n-1],bx+9+Math.round(R.measureText(head).width),y); }
    if (rem<=0) break;
  }
  // Sayfa noktaları ve devam oku
  if (dlgPages.length>1) for (let i=0;i<dlgPages.length&&i<10;i++) {
    R.fillStyle=i<=dlgPage?col:'#2a2a3a'; R.fillRect(bx+bw-9-(Math.min(dlgPages.length,10)-i)*4+4,by+bh-5,2,2);
  }
  if (dlgChar>=pg.flat.length&&!dlgClosing) {
    const b=Math.floor(Math.sin(dlgTimer*0.14)*1.5+1.5);
    R.fillStyle=col; const ax=bx+bw-16, ay=by+bh-14+b;
    R.fillRect(ax,ay,5,1); R.fillRect(ax+1,ay+1,3,1); R.fillRect(ax+2,ay+2,1,1);
  }
  R.restore();
}

      R.fillRect(bx,HEIGHT-hh,w,hh);
      R.beginPath(); R.moveTo(bx-3,HEIGHT-hh); R.lineTo(bx+w/2,HEIGHT-hh-11+(i%2)*4); R.lineTo(bx+w+3,HEIGHT-hh); R.fill();
      if (i%3!==1) R.fillRect(bx+w-8,HEIGHT-hh-16,3,8);
      R.fillStyle=cols[0]; R.fillRect(bx+5,HEIGHT-hh+6,3,4); R.fillRect(bx+w-9,HEIGHT-hh+6,3,4); R.fillStyle=cols[1];
    }

    for (let i=0;i<10;i++) {

// Kapalı alanlarda (maden, kaynak) arka duvar: ışık/derinlik hissi için hafif doku
function drawBackWall(lvl) {

function drawMtn(x,y,w,h) {

const ZONE_TILES=[
  ['#16202a','#0e161d','#1a4a3e','#256054','#3a8a78'],['#1d1830','#130f20','#3a2a50','#4e3a68','#7a5c96'],
  ['#1e1a1c','#141012','#46301e','#5e4228','#8a6238'],['#161c30','#0e1222','#25406a','#325688','#5c88bc'],
  ['#17163a','#0e0d26','#36328a','#4a46aa','#7c7ae0']];
function tileHash(c,r) {
  let h=(Math.imul(c,374761393)+Math.imul(r,668265263))|0;
  h=Math.imul(h^(h>>>13),1274126177); return (h^(h>>>16))>>>0;
}
function drawTiles(lvl) {
  const R=renderCtx, z=lvl.zone;
  const [zb,zd,z1,z2,z3]=ZONE_TILES[z];
  const sc=Math.max(0,Math.floor(cam.x/TILE));
  const ec=Math.min(lvl.w,Math.ceil((cam.x+WIDTH)/TILE)+1);
  const sr=Math.max(0,Math.floor(cam.y/TILE));
  const er=Math.min(lvl.h,Math.ceil((cam.y+HEIGHT)/TILE)+1);
  const px=(col,x,y,w,h)=>{ R.fillStyle=col; R.fillRect(x,y,w,h); };
  for (let r=sr;r<er;r++) for (let c=sc;c<ec;c++) {
    const tile=lvl.tiles[r][c];
    if (!tile) continue;
    const sx=Math.floor(c*TILE-cam.x), sy=Math.floor(r*TILE-cam.y);
    if (tile===T.SOLID) {
      const h=tileHash(c,r);
      const isBottom=r<lvl.h-1&&lvl.tiles[r+1][c]!==T.SOLID;
      const isTop=r>0&&lvl.tiles[r-1][c]!==T.SOLID;
      const isLeft=c>0&&lvl.tiles[r][c-1]!==T.SOLID;
      const isRight=c<lvl.w-1&&lvl.tiles[r][c+1]!==T.SOLID;
      px(zb,sx,sy,TILE,TILE);
      // Bölgeye özgü gövde dokusu
      if (z===0) {                                   // Uyanış: köklü, nemli toprak taş
        px(zd,sx,sy+4,TILE,4);
        for (let x=0;x<TILE;x++) { const w=4+Math.round(Math.sin((c*TILE+x)*0.6)*1.5); px(zb,sx+x,sy+4,1,w-4); }
        if (h%5===0) { px(z1,sx+(h>>3)%6+1,sy+3+(h>>5)%4,1,3); }
        if (h%7===0) px(z2,sx+2,sy+5,1,1);
      } else if (z===1) {                            // Köy: harap tuğla örgü
        px(zd,sx,sy+3,TILE,1); px(zd,sx,sy+7,TILE,1);
        px(zd,sx+3,sy,1,3); px(zd,sx+7,sy+4,1,3);
        if (h%6===0) { px(z1,sx+1,sy+1,2,1); px(z1,sx+5,sy+5,2,1); }
        if (h%13===0) px(zd,sx+(h>>4)%5+1,sy+1,2,2);
      } else if (z===2) {                            // Maden: tabakalı kaya ve cevher
        px(zd,sx,sy+2,TILE,1); px(zd,sx,sy+5,TILE,1);
        if (h%3===0) px(zb,sx+(h>>4)%5,sy+2,3,1);
        if (h%9===0) { px(z3,sx+(h>>3)%5+1,sy+3,2,1); px(z2,sx+(h>>3)%5+1,sy+4,2,1); }
        if (h%9===0&&(frameCount+h)%110<6) px('#ffe9b8',sx+(h>>3)%5+1,sy+3,1,1);
      } else if (z===3) {                            // Uçurum: buzlu, çatlak taş
        px(zd,sx,sy+5,TILE,3);
        if (h%4===0) { const cx=sx+(h>>3)%5+1; px(zd,cx,sy+1,1,3); px(zd,cx+1,sy+3,1,2); }
        if (h%8===0) px(z3,sx+(h>>5)%6,sy+(h>>9)%5,1,1);
      } else {                                       // Kaynak: yüzeyli, parlayan kristal taş
        for (let i=0;i<TILE;i++) px(zd,sx+i,sy+TILE-1-i,1,1);
        if (h%2===0) for (let i=0;i<TILE;i+=2) px(zd,sx+i,sy+i,1,1);
        if (h%9===0) { const a=0.35+0.35*Math.sin(frameCount*0.05+h); R.globalAlpha=a; px(z3,sx+(h>>4)%6+1,sy+(h>>7)%6+1,1,1); R.globalAlpha=1; }

      if (isBottom) px('#000',sx,sy+TILE-2,TILE,2);
      if (isLeft) px('#000',sx,sy,1,TILE);
      if (isRight) px('#000',sx+TILE-1,sy,1,TILE);
      R.globalAlpha=1;
      // Üst yüzey: bölgenin kendi "kaplaması"
      if (isTop) {
        const drips=[2,3,2,1,2,4,3,2];
        if (z===0) {                                 // yosun
          for (let x=0;x<TILE;x++) px(z1,sx+x,sy,1,drips[(c*TILE+x)%8]);
          for (let x=1;x<TILE-1;x++) { const d=drips[(c*TILE+x)%8]; if (d>=2) px(z2,sx+x,sy,1,d-1); }
          px(z3,sx,sy,TILE,1);
          for (let x=0;x<TILE;x+=2) if ((c+x)%4===0) px(z3,sx+x,sy-1,1,1);
        } else if (z===1) {                          // solgun çim ve kül
          px(z1,sx,sy,TILE,2); px(z2,sx,sy,TILE,1);
          for (let x=0;x<TILE;x++) if ((h>>x)%3===0) px(z3,sx+x,sy-1-((h>>(x+3))&1),1,1+((h>>(x+5))&1));
          if (h%11===0) px(z3,sx+3,sy-3,1,3);
        } else if (z===2) {                          // ahşap destek tahtası
          px(z1,sx,sy,TILE,3); px(z2,sx,sy,TILE,1); px(zd,sx,sy+2,TILE,1);
          if (c%2===0) { px(z3,sx+1,sy+1,1,1); px(z3,sx+6,sy+1,1,1); }
        } else if (z===3) {                          // kırağı
          px(z2,sx,sy,TILE,2); px(z3,sx,sy,TILE,1);
          for (let x=0;x<TILE;x++) if ((h>>x)%4===0) px('#cfe6ff',sx+x,sy-1,1,1);
        } else {                                     // kristal yüzey

          const a=0.55+0.3*Math.sin(frameCount*0.05+c*0.7); R.globalAlpha=a; px(z3,sx,sy,TILE,1);
          R.globalAlpha=1;
          if (h%4===0) { px(z3,sx+(h>>4)%5+1,sy-1,1,1); px(z3,sx+(h>>4)%5+1,sy-2,1,1); }
        }
      }
      // Alt yüzey süsleri
      if (isBottom) {
        if (z===3) { const n=1+h%3; for (let i=0;i<2;i++) px(z3,sx+1+i*4+(h>>6)%2,sy+TILE,1,n-i%2); }

        const w=Math.round(Math.sin(frameCount*0.07+c*0.8)*1.5);
        R.globalAlpha=0.7; px(z2,sx,sy+2+w,TILE,2); R.globalAlpha=0.9; px(z3,sx+(c%2)*3,sy+1+w,3,1); R.restore();
      } else {                                       // Dikenler
        px(zd,sx,sy+6,TILE,2);
        for (let i=0;i<2;i++) {
          const x=sx+i*4;
          px('#6c6478',x+1,sy+4,2,3); px('#a89fb4',x+1,sy+2,2,2); px('#e4def0',x+2,sy,1,3);
        }
      }
    } else if (tile===T.VEIL) {
      const gy=r*TILE;                               // iki yanda bölge taşından söve, arada gölge dokuma
      for (let i=0;i<TILE;i++) for (const x of [-4,-3,-2,8,9,10]) {
        const top=lvl.tiles[r+1]&&lvl.tiles[r+1][c]!==T.VEIL, band=(r%5===0&&i<2);
        px(band?z2:x===-4?z1:x===10||x===8?zd:zoneMat(z,c*TILE+x,gy+i),sx+x,sy+i,1,1);
        if (top&&i>4) px(i===5?z3:zoneMat(z,c*TILE+x*2,gy+i),sx+(x<0?x-2:x+2),sy+i,1,1);
      }
      px('#15101f',sx-1,sy,10,TILE);
      for (let i=0;i<TILE;i+=2) for (let k=0;k<4;k++) {
        const w=Math.sin(frameCount*0.04+(gy+i)*0.11+k*1.7);
        px(w>0.6?'#5f4c90':w>-0.2?'#3b2d60':'#241b3c',sx+k*2+Math.round(w),sy+i,2,2);

        for (let k=0;k<3;k++) {
          const x=sx+k*3-(k===0?1:0), o=tileHash(c+k,r)%4;
          px(z1,x,sy,3,TILE); px(z3,x,sy,1,TILE); px(zd,x+2,sy,1,TILE); px(z2,x+1,sy+o,1,3);
        }
        px(zd,sx-1,sy+7,10,1);
        if (r===19) { for (let i=0;i<5;i++) px(i<2?z2:zoneMat(z,c*TILE+i,160),sx-3-(i>>1),sy+3+i,14+(i>>1)*2,1); px(z3,sx-3,sy+3,14,1); }
        if (r===3) { px(z2,sx-3,sy,14,2); px(z1,sx-2,sy+2,12,1); }
        R.globalAlpha=0.45+0.3*Math.sin(frameCount*0.06+r*0.5); px('#d4b5ff',sx+3,sy+(r*5)%6,2,2); R.globalAlpha=1;  // gölge mührü
        if (age<up+12) { px('#cfd0ff',sx,sy,2,3); px('#cfd0ff',sx+5,sy+1,2,2); }

  }
}

function drawNPCs(lvl) {
  for (let npc of lvl.npcs) {
    const sx=npc.x-cam.x, sy=npc.y-cam.y;
    if (sx<-20||sx>WIDTH+20) continue;
    if (npc.type==='tree') drawTree(npc,sx,sy);
    else if (npc.type==='source') drawSource(npc,sx,sy);
    else drawWanderer(npc,sx,sy);
    const dist=Math.abs(player.x-npc.x)+Math.abs(player.y-npc.y);
    if (dist<35&&!npc.done) {
      renderCtx.fillStyle='#aab'; renderCtx.font='6px "Press Start 2P",monospace';
      renderCtx.fillText('E',Math.floor(sx+2),Math.floor(sy-(npc.type==='tree'?26:npc.type==='source'?20:8)));
    }
  }
}

// --- GEÇİTLER: bölgenin kendi taşından örülmüş, zemine gömülü kemerler ---
// Yerel koordinat: x=0 kemerin ortası, h=0 zemin çizgisi (h<0 zeminin içi)
function portalOpen(z,x,h) {
  const ax=Math.abs(x+0.5);
  if (h<0) return false;
  return z===2 ? ax<8&&h<24 : ax<8&&(h<18||ax*ax+(h-18)*(h-18)<64);
}
function portalBody(z,x,h) {
  const ax=Math.abs(x+0.5), foot=h<3?3:h<6?1:0;
  if (h<0) return h>=-4&&ax<18+h;
  if (z===2) return ax<13+foot&&h<31||ax<17&&h>=24&&h<30;
  return ax<13+foot&&h<18||h>=18&&ax*ax+(h-18)*(h-18)<169;
}
const portalCache={};
function portalStone(z,wx,wy) {
  const key=z+'_'+wx+'_'+wy;
  if (portalCache[key]) return portalCache[key];
  const [zb,zd,z1,z2,z3]=ZONE_TILES[z], c=document.createElement('canvas');
  c.width=48; c.height=44;
  const q=c.getContext('2d');
  const put=(col,x,h)=>{ q.fillStyle=col; q.fillRect(x+24,37-h,1,1); };
  // Kenarı yıpranmış gövde: kopuk taşlar sabit gürültüyle belirlenir
  const raw=(x,h)=>portalBody(z,x,h)&&!portalOpen(z,x,h);
  const worn=(x,h)=>z!==2&&h>7&&tileHash((wx+x)>>1,(wy-h)>>1)%6===0;
  const body=(x,h)=>raw(x,h)&&!(worn(x,h)&&(!portalBody(z,x-1,h)||!portalBody(z,x+1,h)||!portalBody(z,x,h+1)));
  for (let h=-4;h<34;h++) for (let x=-22;x<22;x++) {
    if (!body(x,h)) continue;
    const X=wx+x, Y=wy-h-1, mx=((X%8)+8)%8, my=((Y%8)+8)%8, n=tileHash(X,Y);
    let col=zb;
    if (z===0) col=my>=4+Math.round(Math.sin(X*0.6)*1.5)?zd:zb;
    else if (z===1) col=my===3||my===7||(my<3?mx===3:mx===7)?zd:zb;
    else if (z===2) col=h>=24?(h===24||h===29?zd:z1):h>=0?(mx%4===0?zd:z1):(my===2||my===5?zd:zb);
    else if (z===3) col=my>=5||n%17===0?zd:zb;
    else col=mx+my===7||(mx===my&&mx%2===0)?zd:zb;
    if (h>=0&&z!==2&&n%23===0) col=z1;
    // Kemer taşlarının derzleri
    if (z!==2&&h>=18) {
      const k=Math.atan2(h-18,x+0.5)/Math.PI*9;
      if (Math.abs(k-Math.round(k))<0.08) col=zd;
    }
    const inner=portalOpen(z,x-1,h)||portalOpen(z,x+1,h)||portalOpen(z,x,h-1);
    if (inner) col=z2;
    else if (h>=0&&!body(x+1,h)) col=zd;
    // Üst kaplama: zemindeki yosun/çim/kırağı kemere de tırmanır
    if (h>2&&!portalOpen(z,x,h+1)) {
      if (!body(x,h+1)) col=z3;
      else if (!body(x,h+2)&&!portalOpen(z,x,h+2)) col=z2;
      else if (n%3===0&&!body(x,h+3)&&!portalOpen(z,x,h+3)) col=z1;
    }
    if (h===-1) col=Math.abs(x+0.5)<8?z3:z2;       // eşik taşı zeminle birleşir
    if (h===-2) col=z1;
    put(col,x,h);
  }
  // Bölgeye özgü bağlantılar
  if (z===0) for (const [x0,d,len] of [[-14,-1,15],[13,1,11]])      // zeminden tırmanan kökler
    for (let i=0;i<len;i++) { const x=x0-d*Math.round(Math.sin(i*0.45)*1.6); put(z1,x,i); if (i%3===0) put(z2,x-d,i); if (i%5===2) put(z3,x+d,i); }
  if (z===1) for (let i=0;i<9;i++) { put(z1,12,16-i+(i>5?1:0)); if (i%2) put(z2,13,16-i); put(z1,-12,23-i); }  // solgun sarmaşık
  if (z===2) for (const x of [-11,10]) { put(z3,x,27); put(z3,x,3); for (let i=0;i<5;i++) put(zd,x+(x<0?i:-i)-(x<0?1:-1),22-i); } // çivi ve payanda
  if (z===3) for (const [x,l] of [[-6,3],[-3,2],[2,4],[5,2]]) {      // buz saçakları
    let h=26; while (h>0&&!portalOpen(3,x,h)) h--;
    for (let i=0;i<l;i++) put(i===l-1?'#cfe6ff':z3,x,h-i);
  }
  if (z===4) for (const [x,l,d] of [[-15,9,-1],[-12,6,-1],[14,8,1],[11,5,1]]) // yerden çıkan kristaller
    for (let i=0;i<l;i++) { const X=x+d*(i>>2); put(i>l-3?'#cfd0ff':z3,X,i); put(z2,X+1,Math.max(0,i-1)); }
  return portalCache[key]=c;
}
function drawPortal(lvl,wx,wy,dest,fwd) {
  const R=renderCtx, z=lvl.zone, x0=Math.floor(wx-cam.x), y0=Math.floor(wy-cam.y);
  if (x0<-40||x0>WIDTH+40||y0<-10||y0>HEIGHT+50) return;
  const near=Math.max(0,1-Math.hypot(player.x-wx,player.y+4-wy)/70), t=frameCount;
  const [,dark,low,mid,glow]=ZONE_TILES[dest];
  // İçerisi: gidilen bölgenin renginde akan ışık perdesi
  for (let h=0;h<26;h++) for (let x=-8;x<8;x++) {
    if (!portalOpen(z,x,h)) continue;
    const e=Math.max(Math.abs(x+0.5)/8,h>14?(h-14)/12:0);
    const v=Math.sin(h*0.32+t*(fwd?-0.045:0.03)+Math.sin(x*0.55+t*0.02)*1.8)*0.5+0.5;
    const b=(1-e*0.75)*(0.35+0.65*v)+near*0.25-(fwd?0:0.18)+((x+h)&1)*0.05;
    R.fillStyle=b>1.12?'#f2f0ff':b>0.7?glow:b>0.42?mid:b>0.22?low:dark;
    R.fillRect(x0+x,y0-h-1,1,1);
  }
  R.drawImage(portalStone(z,Math.floor(wx),wy),x0-24,y0-38);
  // Kilit taşındaki mühür
  const ky=y0-(z===2?28:29), a=0.45+0.3*Math.sin(t*0.05)+near*0.25;
  R.save(); R.globalAlpha=Math.min(1,a); R.fillStyle=glow;
  R.fillRect(x0-1,ky-1,2,4); R.fillRect(x0-2,ky,4,2);
  R.fillStyle='#fff'; R.fillRect(x0-1,ky,2,2); R.restore();
  // Zemine vuran ışık
  R.save(); R.fillStyle=glow;
  for (let i=1;i<5;i++) { R.globalAlpha=(0.2-i*0.035)*(fwd?1:0.55)+near*0.06; R.fillRect(x0-8-i*2,y0+i-1,16+i*4,1); }
  R.restore();
  coreGlow(x0,y0-12,fwd?15:11,glow,(fwd?0.13:0.07)+near*0.08);
  if (t%(fwd?9:20)===0) emit(wx-7+Math.random()*14,wy-2-Math.random()*18,(Math.random()-0.5)*0.15,-0.15-Math.random()*0.25,45,1,glow,'dust');
  if (!fwd&&!boss&&Math.abs(player.x-lvl.sx)<8&&Math.abs(player.y-lvl.sy)<24) {
    R.fillStyle='#aab'; R.font='6px "Press Start 2P",monospace'; R.fillText('E',x0-3,y0-36);
  }
}
function drawDoor(lvl) {
  if (currentLevel>0) drawPortal(lvl,lvl.sx+3,groundY(lvl,lvl.sx,lvl.sy),currentLevel-1,false);
  if (lvl.door) drawPortal(lvl,lvl.door.x+4,groundY(lvl,lvl.door.x,lvl.door.y),currentLevel+1,true);
}

// --- FENERLER: bölgenin malzemesinden, zemine gömülü kaideler ---
// Fener başının yeri (x: merkezden, h: zeminden yükseklik), asılı mı
const LAMP_HEAD=[{x:4,h:19,hang:1},{x:0,h:24,hang:0},{x:5,h:21,hang:1},{x:0,h:17,hang:0},{x:0,h:14,hang:0}];
const lampCache={};
function lampStone(z,wx,wy) {
  const key=z+'_'+wx+'_'+wy;
  if (lampCache[key]) return lampCache[key];
  const [zb,zd,z1,z2,z3]=ZONE_TILES[z], c=document.createElement('canvas');
  c.width=32; c.height=44;
  const q=c.getContext('2d');
  const put=(col,x,h,w,n)=>{ q.fillStyle=col; q.fillRect(x+16,37-h-((n||1)-1),w||1,n||1); };
  // Kaide: zemin karosuyla aynı doku ve ızgara
  const top=[6,5,4,7,5][z];
  const half=h=>h<0?9+h:h<2?7:h<top-1?5:6;
  for (let h=-4;h<top;h++) for (let x=-half(h);x<half(h);x++) {
    const X=wx+x, Y=wy-h-1, mx=((X%8)+8)%8, my=((Y%8)+8)%8, n=tileHash(X,Y);
    let col=zb;
    if (z===0) col=my>=4?zd:zb;
    else if (z===1) col=my===3||my===7||(my<3?mx===3:mx===7)?zd:zb;
    else if (z===2) col=h>=0?(mx%4===0?zd:z1):(my===2||my===5?zd:zb);
    else if (z===3) col=my>=5||n%13===0?zd:zb;
    else col=mx+my===7||(mx===my&&mx%2===0)?zd:zb;
    if (h>=0&&x===half(h)-1) col=zd;
    if (h===top-1) col=z3; else if (h===top-2||h===-1) col=z2; else if (h===-2||(h===1&&Math.abs(x)>4)) col=z1;
    put(col,x,h);
  }
  if (z===0) {                                   // canlı kök: kıvrılıp feneri taşır
    for (let i=0;i<22;i++) { const x=-2+Math.round(Math.sin(i*0.28)*1.5); put(z1,x,top+i-1,2); if (i%4===0) put(z2,x,top+i-1); }
    for (let i=0;i<6;i++) put(z1,-1+i,27-(i>3?1:0),1,2);
    put(z3,-3,20); put(z3,-4,21); put(z2,-3,14); put(z3,1,16); put(z3,2,28); put(z3,-1,29);
    for (let i=0;i<7;i++) { put(z1,-7+(i>>2),i); put(z1,6-(i>>2),i+1); } put(z3,-6,6); put(z3,5,7);
  } else if (z===1) {                            // köyün sokak lambası
    put('#2a2636',-1,top,2,17); put('#4a4460',-1,top,1,17);
    put('#2a2636',-2,top,4,2); put('#2a2636',-2,14,4,1); put('#4a4460',-3,21,6,1); put('#2a2636',-4,22,1,1); put('#2a2636',3,22,1,1);
    for (let i=0;i<8;i++) put(i%2?z2:z1,i%4<2?1:-2,top+i);  // sarmaşık
  } else if (z===2) {                            // maden direği
    put(z1,-4,top,3,25); put(z2,-4,top,1,25); put(zd,-2,top,1,25);
    put(z1,-6,27,14,2); put(z2,-6,28,14,1); put(z3,-3,27); put(z3,-3,9);
    for (let i=0;i<5;i++) put(zd,-1+i,22+i,1,2);
  } else if (z===3) {                            // kırağılı dikilitaş
    for (let h=top;h<15;h++) { const w=h<10?3:2; for (let x=-w;x<w;x++) put(x===w-1?zd:tileHash(wx+x,wy-h)%7===0?z1:zb,x,h); }
    put(z2,-4,14,8,1); put(z3,-4,15,8,1); put('#cfe6ff',-3,16); put('#cfe6ff',2,16);
    put(z3,-4,12,1,2); put('#cfe6ff',-4,11); put(z3,3,13); put(z3,-6,6,1,1); put('#cfe6ff',5,7);
  } else {                                       // alevi kucaklayan kristaller
    for (const [x,l,d] of [[-6,15,0.12],[5,13,-0.1],[-4,9,0],[3,8,0]])
      for (let i=0;i<l;i++) { const X=Math.round(x+d*i*(i/6)); put(z1,X+1,top+i); put(i>l-4?'#cfd0ff':z3,X,top+i); if (i<l*0.6) put(z2,X-1,top+i); }
    put(z2,-3,top,6,2); put(z3,-3,top+2,6,1);
  }
  return lampCache[key]=c;
}
function drawLantern(lvl,c) {
  const R=renderCtx, z=lvl.zone, wx=c.x+3, wy=c.y+14, x0=Math.floor(wx-cam.x), y0=Math.floor(wy-cam.y), t=frameCount;
  if (x0<-40||x0>WIDTH+40||y0<-10||y0>HEIGHT+50) return;
  const lit=S.level===currentLevel&&S.cx===c.x, [,,z1,z2,z3]=ZONE_TILES[z], H=LAMP_HEAD[z];
  c.fire=(c.fire||0)+((lit?1:0)-(c.fire||0))*0.06;         // yumuşak tutuşma ve sönme
  const f=c.fire, px=(col,x,y,w,h)=>{ R.fillStyle=col; R.fillRect(x,y,w,h); };
  R.drawImage(lampStone(z,Math.floor(wx),wy),x0-16,y0-38);
  const sw=H.hang?Math.round(Math.sin(t*0.035+wx)*0.9):0;
  const hx=x0+H.x+sw, hy=y0-H.h;                           // camın alt ortası

  }
  if (f>0.04) {
    const fl=Math.round(Math.sin(t*0.17+wx)), n=Math.max(1,Math.round(5*f));
    px('#e8913c',hx-1,hy-Math.min(3,n),3,Math.min(3,n)); px('#ffd27a',hx,hy-n-(f>0.8&&fl>0?1:0),1,n); px('#fff3c4',hx,hy-Math.min(2,n),1,Math.min(2,n));
    if (z===4&&f>0.6) px('#ffd27a',hx+fl,hy-n-2,1,2);
    coreGlow(hx,hy-3,11,'#ffbb66',0.2*f); coreGlow(hx,hy-3,4,'#fff3c4',0.2*f);
    R.save(); R.fillStyle='#ffbb66';                       // zemine ve kaideye vuran ışık
    for (let i=1;i<4;i++) { R.globalAlpha=(0.17-i*0.04)*f; R.fillRect(x0-6-i*2,y0+i-1,12+i*4,1); }
    R.restore();
    if (t%14===0&&lit) emit(wx+H.x,wy-H.h-5,(Math.random()-0.5)*0.2,-0.3,45,1,'#ffcc77','dust');
    if (lit&&Math.abs(player.x-c.x)<12&&Math.abs(player.y-c.y)<14) { R.fillStyle='#aab'; R.font='6px "Press Start 2P",monospace'; R.fillText('E',x0-3,y0-38); }
  } else if ((t+Math.floor(wx))%120<12) px(z3,hx,hy-2,1,1); // sönük fener: camda ufak pırıltı
}

const sprCache={};
function sprite(name,flash) {
  const key=name+(flash?'!':'');
  if (sprCache[key]) return sprCache[key];
  const g=SPR[name], h=g.length, w=g[0].length, c=document.createElement('canvas');
  c.width=w+2; c.height=h+2;
  const q=c.getContext('2d'), on=(x,y)=>y>=0&&y<h&&x>=0&&x<w&&g[y][x]!=='.';
  for (let y=-1;y<=h;y++) for (let x=-1;x<=w;x++) {
    if (on(x,y)) {
      q.fillStyle=flash?'#e6f2ff':PAL[g[y][x]]; q.fillRect(x+1,y+1,1,1);
      if (!flash&&!on(x,y-1)) { q.fillStyle='rgba(200,225,255,0.16)'; q.fillRect(x+1,y+1,1,1); }
    } else if (on(x-1,y)||on(x+1,y)||on(x,y-1)||on(x,y+1)) { q.fillStyle='#05060c'; q.fillRect(x+1,y+1,1,1); }
  }
  return sprCache[key]=c;
}
// cx: yatay merkez, fy: ayak çizgisi (ekran pikseli)
function drawSpr(name,cx,fy,flip,flash,sx,sy) {
  const c=sprite(name,flash), R=renderCtx;
  R.save(); R.translate(Math.round(cx),Math.round(fy));
  R.scale((flip?-1:1)*(sx||1),sy||1);
  R.drawImage(c,-Math.floor(c.width/2),1-c.height);
  R.restore();
}
function coreGlow(x,y,r,color,a) {        // kenarı görünmeyen yumuşak hale
  const R=renderCtx, n=parseInt(color.slice(1),16), c=`${n>>16},${n>>8&255},${n&255}`;
  const g=R.createRadialGradient(x,y,0,x,y,r*1.7);
  for (let k=0;k<=8;k++) { const t=k/8; g.addColorStop(t,`rgba(${c},${a*1.3*(1-t)**2*(1+2*t)})`); }
  R.save(); R.globalCompositeOperation='lighter'; R.fillStyle=g;
  R.fillRect(x-r*1.7,y-r*1.7,r*3.4,r*3.4); R.restore();
}

function drawEnemies() {
  for (const e of enemies) {

    const fl=e.hurt>6, flip=e.face<0;
    if (e.t==='crawler') drawSpr('crawler'+((e.tm>>3)%2),cx,fy,flip,fl);
    else if (e.t==='moth') drawSpr('moth'+((e.tm>>2)%2),cx,fy+2,flip,fl);
    else if (e.st===0) {
      renderCtx.fillStyle='#15101f'; renderCtx.fillRect(Math.floor(cx-6),Math.floor(fy-1),12,1);
      renderCtx.fillStyle='#3b2d60'; renderCtx.fillRect(Math.floor(cx-3+Math.sin(e.tm*0.05)*2),Math.floor(fy-2),4,1);
    } else if (e.st===2) drawSpr('lurk',cx,fy,flip,fl,1.2,0.85);
    else drawSpr('lurk',cx,fy,flip,fl,1,e.st===1?Math.max(0.1,Math.min(1,e.tm/30)):1);

    const b=boss, R=renderCtx, tele=b.st==='tele', rage=b.hp<=4;

    const sx=b.st==='slam'?0.85:1, sy=b.st==='slam'?1.12:1+Math.sin(frameCount*0.05)*0.02;
    drawSpr('boss',cx,fy,b.face<0,b.hurt>6,sx,sy);
    for (let k=0;k<3;k++) {                                      // uçuşan pelerin ucu

    }

    R.fillStyle='#0b0d18'; R.fillRect(x-3,y-3,6,8);              // kırık göğüs feneri
    R.fillStyle='#75594a'; R.fillRect(x-3,y-4,6,1); R.fillRect(x-3,y+5,6,1);
    R.fillStyle=c; R.fillRect(x-1,y-1,2,5); R.fillRect(x-2,y+1,4,2);
    R.fillStyle='#0b0d18'; R.fillRect(x,y-2,1,2); R.fillRect(x-1,y,1,1); R.fillRect(x,y+1,1,1);

function drawPlayer() {
  if (player.inv>0&&player.hp<MAX_HP&&frameCount%8<4) return;
  const R=renderCtx, p=player, cx=Math.round(p.x-cam.x+2.5), fy=Math.round(p.y-cam.y+7), flip=p.face<0, D=p.face;
  coreGlow(cx,fy-7,14,'#88bbff',0.12);
  coreGlow(cx,fy-8,6,'#cceeff',0.16);
  let n='pIdle', sx=1, sy=1;
  if (p.dash>0) n='pDash';
  else if (!p.grounded) n=p.vy<0?'pJump':'pFall';
  else if (Math.abs(p.vx)>0.3) n=(frameCount>>3)%2?'pRun0':'pRun1';
  else sy=1+Math.sin(frameCount*0.06)*0.025;
  if (p.squash>0) { sx=1+p.squash*0.035; sy=1-p.squash*0.035; }
  else if (n==='pJump') { sx=0.94; sy=1.06; }
  const run=Math.min(1,Math.abs(p.vx)/1.35);
  if (p.dash<=0) for (let k=0;k<6;k++) {                         // altın atkı
    const wv=Math.sin(frameCount*0.14-k*0.7)*(0.4+k*0.2)+(1-run)*k*0.6-(p.vy>0.5?k*0.7:0);
    R.fillStyle=k>3?'#e8913c':'#ffd27a';
    R.fillRect(Math.round(cx-D*(3+k*(0.5+run*0.5))),Math.round(fy-4+wv),1,k>4?1:2);
  }
  if (p.dash>0) for (let k=2;k>0;k--) { R.save(); R.globalAlpha=0.3/k; drawSpr('pDash',cx-D*k*8,fy-1,flip); R.restore(); }
  drawSpr(n,cx,fy,flip,false,sx,sy);
  if (p.dash<=0) for (let k=0;k<3;k++) {                         // canlı alev ucu
    R.fillStyle=['#f4fbff','#bfe4ff','#7fb4ea'][k];
    R.fillRect(Math.round(cx-p.vx*k*0.9+(k?Math.sin(frameCount*0.15+k)*0.9:0)),Math.round(fy-13*sy-k),1,1);
  }
  if (p.atk>0) {                                                 // üç katmanlı ışık yayı
    const k=p.atk/7, mid=p.atkDown?Math.PI/2:p.atkUp?-Math.PI/2:D>0?0:Math.PI, y=fy-5;
    R.save(); R.lineCap='round';
    for (const [c,w,r,a] of [['#5876ad',5,12,0.35],['#bfe4ff',3,13,0.7],['#ffffff',1,14,1]]) {
      R.globalAlpha=k*a; R.strokeStyle=c; R.lineWidth=w; R.beginPath(); R.arc(cx,y,r-k*2,mid-0.95,mid+0.95); R.stroke();
    }
    R.restore();
  }
  if (frameCount%4===0&&(p.vx!==0||!p.grounded))
    emit(p.x+2,p.y+5,(Math.random()-0.5)*0.15,0.15,18,1,'#6699bb','dust');
}

// --- ORTAK YAPI DİLİ (bkz. TASARIM.md): zeminle aynı ızgarada malzeme, gömülü taban ---
function zoneMat(z,X,Y) {
  const [zb,zd,z1]=ZONE_TILES[z], mx=((X%8)+8)%8, my=((Y%8)+8)%8, n=tileHash(X,Y);
  if (z===0) return my>=4+Math.round(Math.sin(X*0.6)*1.5)?zd:n%29===0?z1:zb;
  if (z===1) return my===3||my===7||(my<3?mx===3:mx===7)?zd:zb;
  if (z===2) return my===2||my===5?zd:zb;
  if (z===3) return my>=5||n%17===0?zd:zb;
  return mx+my===7||(mx===my&&mx%2===0)?zd:zb;
}
const propCache={};
// build(put): put(renk,x,h[,w,n]) — x merkezden, h zeminden; tuval 64x56, zemin 48. satırda
function propSprite(key,build) {
  if (propCache[key]) return propCache[key];
  const c=document.createElement('canvas'); c.width=64; c.height=56;
  const q=c.getContext('2d');
  build((col,x,h,w,n)=>{ q.fillStyle=col; q.fillRect(x+32,47-h-((n||1)-1),w||1,n||1); });
  return propCache[key]=c;
}
function drawProp(c,x0,y0) { renderCtx.drawImage(c,x0-32,y0-48); }
// Gömülü kaide: half(h) yarı genişlik
function buildBase(put,z,wx,wy,top,half) {
  const [,zd,z1,z2,z3]=ZONE_TILES[z];
  for (let h=-4;h<top;h++) { const w=half(h); for (let x=-w;x<w;x++)
    put(h===top-1?z3:h===top-2||h===-1?z2:h===-2?z1:h>=0&&x===w-1?zd:zoneMat(z,wx+x,wy-h-1),x,h); }
  if (z===0) { put(z1,-half(0)-1,0,1,3); put(z1,half(0),0,1,2); put(z2,-half(0),3); }
  else if (z===1) { put(z1,half(1)-1,1,1,2); put(z2,half(1),2); }
  else if (z===2) { put(z3,-half(1)+1,1); put(z3,half(1)-2,1); }
  else if (z===3) { put('#cfe6ff',-half(top-1),top-2); put('#cfe6ff',half(top-1)-1,top-3); }
  else { put(z3,-half(0)-1,0,1,4); put('#cfd0ff',-half(0)-1,4); put(z3,half(0)+1,0,1,3); put('#cfd0ff',half(0)+1,3); }
}
function floorLight(x0,y0,w,color,a) {
  const R=renderCtx; R.save(); R.fillStyle=color;
  for (let i=1;i<5;i++) { R.globalAlpha=Math.max(0,a*(1-i*0.2)); R.fillRect(x0-w-i*2,y0+i-1,w*2+i*4,1); }
  R.restore();
}
SPR.gem=['...w...','..cws..','..cws..','.ccwss.','.ccwss.','.ccwsl.','..cws..','..csl..','...l...'];
SPR.spark=['...g...','...y...','..gyg..','gyywyyg','..gyg..','...y...','...o...'];

// Fragman: taştan bir yuvada duran hatıra kristali; alınınca yuva boş kalır
function drawCrystals(lvl) {
  for (const c of lvl.crystals) {
    const wx=c.x+4, wy=groundY(lvl,c.x,c.y), x0=Math.floor(wx-cam.x), y0=Math.floor(wy-cam.y), z=lvl.zone;
    if (x0<-40||x0>WIDTH+40) continue;
    const top=Math.max(4,wy-c.y-9), [,,z1,z2,z3]=ZONE_TILES[z];

const ZONE_DARK=['3,9,12','9,6,15','5,4,6','6,8,18','5,5,20'];
// Gürültülü (dither) ışık dokusu: kademe çizgilerini kırar
let lightTexC=null;
function lightTex() {
  if (lightTexC) return lightTexC;
  const N=192, c=document.createElement('canvas'); c.width=c.height=N;
  const q=c.getContext('2d'), im=q.createImageData(N,N), d=im.data;
  for (let y=0;y<N;y++) for (let x=0;x<N;x++) {
    const t=Math.min(1,Math.hypot(x-N/2+0.5,y-N/2+0.5)/(N/2)), f=Math.pow(1-t*t,2.2);
    d[(y*N+x)*4+3]=Math.max(0,Math.min(255,f*255+(Math.random()-0.5)*26*Math.min(1,f*6)));
  }
  q.putImageData(im,0,0);
  return lightTexC=c;
}
function drawLighting() {
  const L=lightCtx, lvl=levels[currentLevel];
  L.clearRect(0,0,WIDTH,HEIGHT);
  // Maske arka plandan koyu olmalı; yoksa ışık koyu halka bırakır
  L.fillStyle=`rgba(${ZONE_DARK[currentLevel].split(',').map(v=>v*0.25|0)},0.80)`;
  L.fillRect(0,0,WIDTH,HEIGHT);
  L.save(); L.globalCompositeOperation='destination-out';
  const hole=(wx,wy,r,a)=>{
    const x=wx-cam.x, y=wy-cam.y;
    if (x<-r||x>WIDTH+r||y<-r||y>HEIGHT+r) return;
    L.globalAlpha=a; L.drawImage(lightTex(),x-r,y-r,r*2,r*2); L.globalAlpha=1;
  };
  // Can = ışık: yara aldıkça dünya daralır
  player.glow+=((34+Math.max(0,player.hp)*9)-player.glow)*0.06;
  hole(player.x+2,player.y+1,player.glow*1.5+Math.sin(frameCount*0.03)+(player.atk>0?8:0),1);
  for (const c of lvl.crystals) hole(c.x+4,c.y+4,c.col?14:28,c.col?0.35:0.75);
  for (const n of lvl.npcs) hole(n.x+4,n.y+8,n.type==='source'?60:n.type==='tree'?46:30,0.7);
  for (const c of lvl.cps) hole(c.x+3+LAMP_HEAD[lvl.zone].x*0.6,c.y+14-LAMP_HEAD[lvl.zone].h+4,24+36*(c.fire||0),0.45+0.4*(c.fire||0));
  for (const s of lvl.shrines) hole(s.x+3,s.y+2,has(s.ab)?18:40,has(s.ab)?0.4:0.8);
  for (const m of motes) hole(m.x,m.y,9,0.6);
  for (const s of shots) hole(s.x+3,s.y+3,10,0.6);
  if (boss) hole(boss.x+7,boss.y+12,36,0.75);
  if (lvl.door) hole(lvl.door.x+4,groundY(lvl,lvl.door.x,lvl.door.y)-14,44,0.8);
  if (currentLevel>0) hole(lvl.sx+3,groundY(lvl,lvl.sx,lvl.sy)-14,36,0.6);
  if (lvl.arena&&lvl.npcs.some(n=>n.type==='source'&&n.done)) { hole(90*TILE,19*TILE,40,0.7); hole(106*TILE,19*TILE,40,0.7); }
  L.restore();
  renderCtx.drawImage(lightCanvas,0,0);
  coreGlow(player.x-cam.x+2,player.y-cam.y-1,player.glow*0.85,'#5f86c8',0.07);  // ortam ışığı: aydınlık gerçekten aydınlık
}

// Ön plan silüetleri ve sis: derinlik hissi
function drawForeground() {
  const R=renderCtx; R.save();
  const tint=ZONE_DARK[currentLevel].split(',').map(v=>+v*5+12).join(',');
  for (let i=0;i<4;i++) {
    const w=150, x=((i*130-cam.x*0.5+frameCount*(0.06+i*0.02))%520+520)%520-w;
    R.save(); R.translate(x+w/2,HEIGHT-28-i*18); R.scale(1,0.18);
    const mg=R.createRadialGradient(0,0,0,0,0,w/2);
    for (let k=0;k<=6;k++) mg.addColorStop(k/6,`rgba(${tint},${0.09*(1-k/6)**2})`);
    R.fillStyle=mg; R.fillRect(-w/2,-w/2,w,w); R.restore();
  }
  R.fillStyle='#010103';
  for (let i=0;i<5;i++) {
    const x=Math.floor(((i*113-cam.x*1.35)%565+565)%565-60), h=10+(i*7)%13;
    R.beginPath(); R.moveTo(x,HEIGHT); R.quadraticCurveTo(x+6,HEIGHT-h,x+3,HEIGHT-h-6);
    R.quadraticCurveTo(x+13,HEIGHT-h,x+16,HEIGHT); R.fill();
    R.beginPath(); R.moveTo(x+50,0); R.lineTo(x+54,h); R.lineTo(x+60,0); R.fill();
  }
  R.restore();
}

function drawDeco(lvl) {
  if (currentLevel===0) {
    for (let i=0;i<18;i++) {
      const tx=i*55-(cam.x*0.65)%55;
      const th=25+Math.sin(i*2.1)*10;
      renderCtx.fillStyle='#150c06'; renderCtx.fillRect(Math.floor(tx+3),HEIGHT-th,2,th-8);
      renderCtx.fillStyle='#0a1510'; renderCtx.beginPath();
      renderCtx.arc(tx+4,HEIGHT-th,6+Math.sin(i)*2,0,Math.PI*2); renderCtx.fill();
    }
  } else if (currentLevel===1) {
    renderCtx.fillStyle='#151520';
    for (let i=0;i<8;i++) {
      const lx=(20+i*18)*TILE-cam.x;
      if (lx<-5||lx>WIDTH+5) continue;
      renderCtx.fillRect(Math.floor(lx),50,1,90);
      renderCtx.fillRect(Math.floor(lx-1),48,3,2);
    }
  } else if (currentLevel===2) {
    renderCtx.fillStyle='#120a04';
    for (let i=0;i<22;i++) {
      const bx=i*48-(cam.x*0.85)%48;
      renderCtx.fillRect(Math.floor(bx),8,2,HEIGHT-16);
      renderCtx.fillRect(Math.floor(bx-2),8,6,2);
    }
  } else if (currentLevel===3) {
    for (let i=0;i<10;i++) {
      const dx=i*100-(cam.x*0.35)%100+Math.sin(frameCount*0.008+i)*4;
      const dy=50+Math.sin(frameCount*0.006+i*2)*15;
      renderCtx.fillStyle='#101020'; renderCtx.fillRect(Math.floor(dx),Math.floor(dy),3,2);
    }
  } else if (currentLevel===4) {
    renderCtx.fillStyle='#101028';
    for (let i=0;i<16;i++) {

      const ch=4+Math.sin(i*1.9)*2;
      renderCtx.beginPath(); renderCtx.moveTo(cx,0); renderCtx.lineTo(cx+2,ch); renderCtx.lineTo(cx+4,0); renderCtx.fill();
      renderCtx.beginPath(); renderCtx.moveTo(cx+20,HEIGHT); renderCtx.lineTo(cx+22,HEIGHT-ch-2); renderCtx.lineTo(cx+24,HEIGHT); renderCtx.fill();
    }
    if (frameCount%12===0) emit(cam.x+Math.random()*WIDTH,Math.random()*20,0,0.08,35,1,'#223366','dust');
  }
}

// Can göstergesi: yara aldıkça eriyen yatay mum
let candleLen=48, candleTrail=48;
function drawCandle() {
  const R=renderCtx, SEG=12, X=9, Y=9, hp=Math.max(0,player.hp), goal=hp*SEG;
  const px=(c,x,y,w,h)=>{R.fillStyle=c;R.fillRect(Math.round(x),Math.round(y),w,h);};
  candleLen+=(goal-candleLen)*0.25;
  candleTrail=Math.max(candleLen,candleTrail-0.35);
  const len=Math.round(candleLen), full=MAX_HP*SEG, low=hp<=1;
  // Şamdan ve boş yuva
  px('#4a4058',X-5,Y-2,3,9); px('#6e6284',X-5,Y-2,1,9); px('#4a4058',X-2,Y+6,full+3,1);
  px('#15121f',X,Y,full,5);
  // Yeni kaybedilen kısım kor gibi söner
  const tr=Math.round(candleTrail); if (tr>len) px('#a8452c',X+len,Y+1,tr-len,4);
  // Balmumu gövde
  px(low?'#b98a72':'#cfc4a4',X,Y,len,5); px(low?'#d8ac90':'#f3ebd0',X,Y,len,1); px('#8c8068',X,Y+4,len,1);
  for (let k=1;k<MAX_HP;k++) {
    if (k*SEG<len) px('#8c8068',X+k*SEG,Y+1,1,3); else px('#2c2638',X+k*SEG,Y+1,1,3);
  }
  // Erime damlaları
  if (len>8) { px('#cfc4a4',X+len-3,Y+5,1,2); px('#cfc4a4',X+len-7,Y+5,1,1); }
  // Fitil ve alev
  px('#2a1f1a',X+len,Y+2,2,1);
  const fl=Math.round(Math.sin(frameCount*(low?0.5:0.16))), fx=X+len+2;
  coreGlow(fx+1,Y,8,low?'#ff5522':'#ffbb66',0.22+0.04*fl);
  px(low?'#e0502c':'#ff9a3c',fx,Y-1,3,4); px(low?'#e0502c':'#ff9a3c',fx+1,Y-4-fl,1,4+fl);
  px('#fff3c4',fx+1,Y,1,2);
  // Kıvılcımlar: üçü bir bölüm mumu onarır
  for (let k=0;k<3;k++) {
    const x=X+2+k*8, y=Y+12, on=k<player.motes, c=on?'#ffd27a':'#3a344a';
    px(c,x,y-1,1,3); px(c,x-1,y,3,1); if (on) px('#fff8e0',x,y,1,1);
  }
}

function drawHUD() {
  renderCtx.save();
  drawCandle();
  renderCtx.font='6px "Press Start 2P",monospace';
  const ft=`${tx('fragments')} ${fragments}/${totalFragments}`;
  renderCtx.fillStyle='#667788'; renderCtx.fillText(ft,WIDTH-6-renderCtx.measureText(ft).width,11);
  if (boss) {
    const n=tx('bossName'); renderCtx.fillStyle='#b8a8d8';
    renderCtx.fillText(n,(WIDTH-renderCtx.measureText(n).width)/2,HEIGHT-14);
    renderCtx.fillStyle='#1a1428'; renderCtx.fillRect(90,HEIGHT-10,140,3);
    renderCtx.fillStyle='#b48cff'; renderCtx.fillRect(90,HEIGHT-10,Math.max(0,140*boss.hp/BOSS_HP),3);
  }
  renderCtx.restore();

  // Bölge ismi animasyonu
  if (zoneTimer < 200) {
    zoneTimer++;
    const FADE_IN=35, HOLD=120, FADE_OUT=45;
    let alpha, slideY;
    if (zoneTimer<=FADE_IN) { alpha=zoneTimer/FADE_IN; slideY=(1-alpha)*20; }
    else if (zoneTimer<=FADE_IN+HOLD) { alpha=1; slideY=0; }
    else { const t=(zoneTimer-FADE_IN-HOLD)/FADE_OUT; alpha=Math.max(0,1-t); slideY=0; }
    if (alpha>0) {
      const name=tx('zoneNames')[currentLevel];
      renderCtx.save();
      renderCtx.globalAlpha=alpha;
      const cy=Math.floor(HEIGHT/2)+Math.floor(slideY);
      renderCtx.fillStyle='rgba(0,0,0,0.5)';
      renderCtx.fillRect(0,cy-16,WIDTH,24);
      renderCtx.fillStyle='rgba(140,170,210,0.4)';
      renderCtx.fillRect(0,cy-16,WIDTH,1);
      renderCtx.fillRect(0,cy+8,WIDTH,1);
      renderCtx.font='9px "Press Start 2P",monospace';
      const tw=renderCtx.measureText(name).width;
      const tx2=Math.floor((WIDTH-tw)/2);
      renderCtx.fillStyle='rgba(0,0,10,0.9)';
      renderCtx.fillText(name,tx2+1,cy+1);
      renderCtx.fillStyle='#c8dcf0';
      renderCtx.fillText(name,tx2,cy);
      renderCtx.restore();
    }
  }
}

function drawChoices() {

function getTile(tiles,px,py) {
  const c=Math.floor(px/TILE), r=Math.floor(py/TILE);
  if (r<0||r>=tiles.length||c<0||c>=tiles[0].length) return T.AIR;
  return tiles[r][c];
}
function isSolid(tiles,px,py) {
  const t=getTile(tiles,px,py);
  return t===T.SOLID||t===T.GATE||(t===T.VEIL&&player.dash<=0);
}
function inVeil(t) { return [0,player.w].some(dx=>getTile(t,player.x+dx,player.y+3)===T.VEIL); }

function resolveX(lvl) {
  const t=lvl.tiles;
  for (let i=0;i<3;i++) {
    const cy=player.y+1+(player.h-2)*i/2;
    if (player.vx>0&&isSolid(t,player.x+player.w,cy)) { player.x=Math.floor((player.x+player.w)/TILE)*TILE-player.w-0.01; player.vx=0; break; }
    if (player.vx<0&&isSolid(t,player.x,cy)) { player.x=Math.floor(player.x/TILE)*TILE+TILE; player.vx=0; break; }
  }
  player.x=Math.max(0,Math.min(player.x,lvl.w*TILE-player.w));
}

function resolveY(lvl) {
  const t=lvl.tiles;
  player.grounded=false;
  if (player.vy>0) {
    if (isSolid(t,player.x+1,player.y+player.h)||isSolid(t,player.x+player.w-1,player.y+player.h)) {
      player.y=Math.floor((player.y+player.h)/TILE)*TILE-player.h;
      player.vy=0; player.grounded=true;
    }
  } else if (player.vy<0) {
    const l=isSolid(t,player.x+1,player.y), r=isSolid(t,player.x+player.w-1,player.y);
    if (l!==r) {                          // köşe düzeltmesi
      for (let n=1;n<=3;n++) {
        const nx=player.x+(l?n:-n);
        if (!isSolid(t,nx+1,player.y)&&!isSolid(t,nx+player.w-1,player.y)&&!isSolid(t,nx,player.y+4)&&!isSolid(t,nx+player.w,player.y+4)) { player.x=nx; return; }
      }
    }
    if (l||r) { player.y=Math.floor(player.y/TILE)*TILE+TILE; player.vy=0; }
  }
}

function movePlayer(lvl) {
  const t=lvl.tiles, p=player;
  if (p.inv>0) p.inv--;
  if (p.atkCd>0) p.atkCd--;
  if (p.dashCd>0) p.dashCd--;
  if (p.lock>0) p.lock--;
  const dir=(isRight()?1:0)-(isLeft()?1:0);
  if (p.lock<=0&&p.dash<=0) {
    if (dir&&p.atk<=0) p.face=dir;
    const goal=dir*PLAYER_SPEED, acc=p.grounded?0.28:0.18;
    p.vx+=Math.max(-acc,Math.min(acc,goal-p.vx));
  }
  if (p.grounded&&Math.abs(p.vx)>0.3) { if (++p.stepT>15) { playStep(); p.stepT=0; } } else p.stepT=10;
  if (p.grounded) { p.coyote=COYOTE_TIME; p.airDash=true; } else if (p.coyote>0) p.coyote--;
  if (isJump()) p.jbuf=JUMP_BUFFER; else if (p.jbuf>0) p.jbuf--;

  p.wall=0;
  if (has('cling')&&!p.grounded&&p.dash<=0) {
    if (isSolid(t,p.x+p.w+1,p.y+3)) p.wall=1; else if (isSolid(t,p.x-1,p.y+3)) p.wall=-1;
    if (p.wall&&dir===p.wall&&p.vy>0.8) { p.vy=0.8; if (frameCount%6===0) emit(p.x+2,p.y+6,0,0.2,16,1,'#8899bb','dust'); }
  }
  if (p.jbuf>0&&p.dash<=0) {
    if (p.coyote>0) { p.vy=JUMP_FORCE; p.jbuf=0; p.coyote=0; p.cut=false; p.grounded=false; playJump(); }
    else if (p.wall) { p.vy=-3.8; p.vx=-p.wall*1.9; p.face=-p.wall; p.lock=9; p.jbuf=0; p.cut=false; p.airDash=true; playJump(); }
  }
  if (!jumpHeld()&&!p.cut&&p.vy<-1) { p.vy*=0.45; p.cut=true; }

  if (isDash()&&has('dash')&&p.dashCd<=0&&p.airDash) {
    p.dash=10; p.dashCd=32; p.airDash=false; p.lock=0; if (dir) p.face=dir;
    impact(0.12,0); playTone(300,0.18,'triangle',0.08); playTone(700,0.15,'sine',0.05,0.03);
  }
  if (p.dash>0) {
    p.vx=p.face*3.6; p.vy=0;
    emit(p.x+2,p.y+3,-p.face*0.3,0,20,2,'#88bbff','dust');
  } else {
    let g=p.vy>0?FALL_GRAVITY:GRAVITY;
    if (jumpHeld()&&Math.abs(p.vy)<0.6) g*=0.5;
    p.vy=Math.min(p.vy+g,MAX_FALL);
  }
  if (isAttack()&&p.atkCd<=0) {
    p.atk=7; p.atkCd=20; p.hit=[]; p.atkDown=!p.grounded&&!!(keys['ArrowDown']||keys['KeyS']); p.atkUp=!p.atkDown&&!!upHeld();
    playTone(640,0.1,'triangle',0.05); playTone(1100,0.07,'sine',0.03,0.02);
  }
  p.x+=p.vx; resolveX(lvl);
  p.y+=p.vy; resolveY(lvl);
  // Atılma perdenin içinde bitmez
  if (p.dash>0&&--p.dash===0) { if (inVeil(t)) p.dash=1; else p.vx=p.face*PLAYER_SPEED; }
  // Güvenli zemin: iki yanı da dolu olan son nokta
  if (p.grounded&&frameCount%8===0&&isSolid(t,p.x-8,p.y+9)&&isSolid(t,p.x+12,p.y+9)) { p.safeX=p.x; p.safeY=p.y; }

  if (!p.wasGrounded&&p.grounded&&p.prevVy>1.5) {
    p.squash=Math.min(8,Math.round(p.prevVy*1.8));
    for (let i=0;i<5;i++) emit(p.x+2,p.y+6,(Math.random()-0.5)*1.2,-Math.random()*0.3,18,1,'#667799','dust');
  } else if (p.grounded&&p.squash<0) p.squash=0;
  if (p.squash>0) p.squash--;
  if (!p.grounded&&p.vy<-0.5&&p.squash<=0) p.squash=-1;
  p.wasGrounded=p.grounded; p.prevVy=p.vy;
}

function updatePlay() {
  trauma=Math.max(0,trauma-0.02);
  if (fadeCallback) return;
  if (isPause()) { gameState='pause'; pauseSel=0; return; }
  if (hitStop>0) { hitStop--; if (isJump()) player.jbuf=JUMP_BUFFER; return; }
  const lvl=levels[currentLevel];
  movePlayer(lvl);
  if (player.atk>0) { strike(); player.atk--; }
  const hx=player.x+player.w/2, hy=player.y+player.h;
  if (player.y>lvl.h*TILE+20||getTile(lvl.tiles,hx,hy)===T.HAZARD) { pitFall(); updateCam(lvl); return; }
  updateEnemies(lvl);
  updateBoss(lvl);
  updateCam(lvl);
  if (gameState!=='play'||fadeCallback) return;

  for (const c of lvl.crystals) {
    if (c.col||Math.abs(player.x-c.x)>=10||Math.abs(player.y-c.y)>=10) continue;
    c.col=true; S.cr.push(c.id); fragments=S.cr.length; writeSave(); playCrystal();
    for (let i=0;i<14;i++) emit(c.x+4,c.y+4,(Math.random()-0.5)*2,(Math.random()-0.5)*2,35,1,'#88eeff','spark');
    startDlg(getCrystDlg(c.id)); return;
  }
  for (const s of lvl.shrines) {
    if (has(s.ab)||Math.abs(player.x-s.x)>=10||Math.abs(player.y-s.y)>=14) continue;
    S.ab.push(s.ab); writeSave(); impact(0.4,0); playCrystal(); startDlg(tx(s.ab+'Lines'),null,lang==='TR'?'Kıvılcım':'Spark'); return;
  }
  for (const c of lvl.cps) {
    if (Math.abs(player.x-c.x)>=12||Math.abs(player.y-c.y)>=14) continue;
    const isNew=!(S.level===currentLevel&&S.cx===c.x);
    if (isNew||isInteract()) {
      S.level=currentLevel; S.cx=c.x; S.cy=c.y+6; checkpointX=c.x; checkpointY=c.y+6;
      player.hp=MAX_HP; writeSave(); playTone(523,0.5,'sine',0.08); playTone(784,0.6,'sine',0.06,0.12);
      for (let i=0;i<12;i++) emit(c.x+3,c.y+3,(Math.random()-0.5),(Math.random()-0.5),40,1,'#ffcc77','spark');
      if (!isNew) { if (!boss) spawnEnemies(lvl); return; }
    }
  }
  if (isInteract()) {
    for (const npc of lvl.npcs) {
      if (Math.abs(player.x-npc.x)+Math.abs(player.y-npc.y)>=40) continue;
      if (npc.type==='source') {
        if (!npc.done) { npc.done=true; startDlg(tx('npc1lines').concat(canShare()?tx('shareHint'):[]),null,lang==='TR'?'Kaynak':'The Source'); return; }
        if (canShare()) { beginEnding('share'); return; }
      } else if (!npc.done) {
        npc.done=true; if (!S.met.includes(npc.type)) S.met.push(npc.type);
        writeSave(); startDlg(tx(npc.linesKey),null,npc.type==='tree'?(lang==='TR'?'Eski Ağaç':'Old Tree'):''); return;
      } else if (T_TEXT[lang][npc.linesKey+'R']) { startDlg(tx(npc.linesKey+'R')); return; }
    }
    if (currentLevel>0&&!boss&&Math.abs(player.x-lvl.sx)<8&&Math.abs(player.y-lvl.sy)<24) {
      const to=currentLevel-1, d=levels[to].door;
      startFade(1,()=>startLevel(to,d.x-28,d.y)); return;
    }
    const src=lvl.npcs.find(n=>n.type==='source');
    if (src&&src.done) {
      const ct=getTile(lvl.tiles,hx,player.y+3);
      if (ct===T.CHOICE_A) { beginEnding('sacrifice'); return; }
      if (ct===T.CHOICE_B) { beginEnding('selfish'); return; }
    }
  }
  if (lvl.door&&Math.abs(player.x-lvl.door.x)<12&&Math.abs(player.y-lvl.door.y)<18) {
    const to=currentLevel+1; startFade(1,()=>startLevel(to));
  }
}

function beginEnding(type) {
  endingType=type;
  startFade(1,()=>{ gameState='ending'; endingTimer=0; stopAmbient(); playEnding(type==='selfish'?'selfish':'sacrifice'); });
}

function respawn() {
  playDeath(); impact(0.8,0);
  player.hp=MAX_HP; player.motes=0; hitStop=0;
  startLevel(S.level,S.cx,S.cy);
  for (let i=0;i<20;i++) emit(player.x+3,player.y+4,(Math.random()-0.5)*2,(Math.random()-0.5)*2,40,1,'#88aadd','spark');
}

function startLevel(idx,x,y) {
  currentLevel=idx;
  const lvl=levels[idx];
  for (const c of lvl.crystals) c.col=S.cr.includes(c.id);
  for (const n of lvl.npcs) n.done=n.type!=='source'&&S.met.includes(n.type);
  fragments=S.cr.length;
  if (x==null) { x=lvl.sx; y=lvl.sy; }
  // Bölge girişi de kayıt noktasıdır
  if (S.level!==idx||S.cx==null) { S.level=idx; S.cx=x; S.cy=y; }
  writeSave();
  resetPlayer(x,y);
  checkpointX=x; checkpointY=y;
  spawnEnemies(lvl);
  updateCam(lvl,true);
  gameState='play';
  startAmbient(idx);
  fadeAlpha=1; fadeDir=-1;
  zoneTimer=0;
}

function startFade(dir,cb) { if (fadeCallback) return; fadeDir=dir; fadeCallback=cb; if(dir===1)fadeAlpha=0; }
function updateFade() {
  if (fadeDir===1) {
    fadeAlpha+=0.025;
    if (fadeAlpha>=1) { fadeAlpha=1; fadeDir=-1; const cb=fadeCallback; fadeCallback=null; if (cb) cb(); }
  } else if (fadeDir===-1) { fadeAlpha-=0.025; if(fadeAlpha<=0){fadeAlpha=0;fadeDir=0;} }
}
function drawFade() { if(fadeAlpha>0){renderCtx.save();renderCtx.globalAlpha=fadeAlpha;renderCtx.fillStyle='#000';renderCtx.fillRect(0,0,WIDTH,HEIGHT);renderCtx.restore();} }
